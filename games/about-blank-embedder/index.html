<!DOCTYPE html>
<html>
<head>
    <title id="tab-title">Dashboard</title>
    <link id="tab-icon" rel="icon" type="image/png" href="/ExistenceGG75/imgs/canvas.png">
    <style>
        :root { --bg: #f5f5f5; --header: #24292e; --text: #ffffff; --accent: #e00122; --card: #ffffff; --border: #d1d1d1; --card-text: #2d3b45; }
        [data-theme="dark"] { --bg: #0f172a; --header: #111827; --text: #ffffff; --accent: #3b82f6; --card: #1e293b; --border: #334155; --card-text: #ffffff; }

        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; min-height: 100vh; }
        header { padding: 12px 20px; background: var(--header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 600; color: var(--accent); font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        
        .setup-area { display: none; flex-direction: column; gap: 10px; padding: 20px; background: rgba(0,0,0,0.05); border-bottom: 1px solid var(--border); color: var(--card-text); }
        .setup-area.visible { display: flex; }
        
        .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 5px; align-items: center; }
        input, select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: #000; font-size: 13px; }
        
        button { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; background: var(--accent); color: white; font-weight: bold; transition: 0.2s; }
        .edit-toggle { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 18px; padding: 4px 10px; }

        .category-header { border-bottom: 1px solid var(--border); padding: 0 20px; margin: 25px 0 10px; display: flex; align-items: center; justify-content: space-between; }
        .category-title { font-size: 0.85rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 0 20px; }
        .app-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--card-text); transition: 0.3s; position: relative; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .app-icon { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .delete-btn { position: absolute; top: 5px; right: 5px; color: #ff4d4d; font-size: 18px; display: none; }
        .editing .delete-btn { display: block; }
    </style>
</head>
<body data-theme="canvas">

<header>
    <div class="logo"><img src="/ExistenceGG75/imgs/canvas.png" width="24"> <span>Dashboard</span></div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <select id="cloakSelect" onchange="applyTheme(this.value)">
            <option value="canvas">Theme: Canvas</option>
            <option value="dark">Theme: Dark</option>
        </select>
        <button class="edit-toggle" onclick="toggleEditMode()">⚙️</button>
    </div>
</header>

<div id="setupArea" class="setup-area">
    <div class="row">
        <input type="text" id="appName" placeholder="App Name">
        <input type="text" id="appUrl" placeholder="URL (google.com)">
        <input type="text" id="appCat" placeholder="Category">
        <button onclick="addApp()">+ Add App</button>
    </div>
    <div class="row">
        <input type="text" id="proxyBaseUrl" placeholder="https://xhunter75.github.io" style="width: 450px;" oninput="saveProxyBase()">
        <select id="cloakType">
            <option value="blank">Cloak: about:blank</option>
            <option value="blob">Cloak: Blob URL</option>
        </select>
    </div>
</div>

<div id="categories-container"></div>

<script>
    let apps = JSON.parse(localStorage.getItem("workspaceApps")) || [];
    let recentApps = JSON.parse(localStorage.getItem("recentApps")) || [];
    let isEditing = false;

    function toggleEditMode() {
        isEditing = !isEditing;
        document.getElementById("setupArea").classList.toggle("visible", isEditing);
        document.body.classList.toggle("editing", isEditing);
    }

    function uvEncode(str) {
        if (!str) return str;
        return encodeURIComponent(str.split('').map((char, i) => i % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char).join(''));
    }

    function addApp() {
        const name = document.getElementById("appName").value, urlInput = document.getElementById("appUrl").value;
        const category = document.getElementById("appCat").value || "General";
        if (!name || !urlInput) return;
        let url = urlInput.startsWith("http") ? urlInput : "https://" + urlInput;
        apps.push({ name, url, category, icon: `https://www.google.com{url}&sz=64` });
        localStorage.setItem("workspaceApps", JSON.stringify(apps));
        renderApps();
    }

    function renderApps() {
        const container = document.getElementById("categories-container");
        container.innerHTML = "";

        // Render Recently Used (Top 4)
        if (recentApps.length > 0) {
            const rHeader = document.createElement("div");
            rHeader.className = "category-header";
            rHeader.innerHTML = `<div class="category-title" style="color:#888;">Recently Used</div>`;
            const rGrid = document.createElement("div");
            rGrid.className = "apps";
            recentApps.forEach(app => rGrid.appendChild(createCard(app)));
            container.appendChild(rHeader);
            container.appendChild(rGrid);
        }

        // Render Categories
        const groups = apps.reduce((acc, app) => {
            const cat = app.category || "General";
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(app);
            return acc;
        }, {});

        Object.keys(groups).sort().forEach(cat => {
            const header = document.createElement("div");
            header.className = "category-header";
            header.innerHTML = `<div class="category-title">${cat}</div>`;
            const grid = document.createElement("div");
            grid.className = "apps";
            groups[cat].forEach(app => grid.appendChild(createCard(app)));
            container.appendChild(header);
            container.appendChild(grid);
        });
    }

    function createCard(app) {
        const card = document.createElement("div");
        card.className = "app-card";
        card.onclick = () => openApp(app);
        card.innerHTML = `
            <img src="${app.icon}" class="app-icon">
            <div style="font-weight:600;font-size:0.9rem;">${app.name}</div>
            <span class="delete-btn" onclick="event.stopPropagation(); removeApp('${app.name}')">&times;</span>
        `;
        return card;
    }

    function openApp(app) {
        // Track Recent
        recentApps = [app, ...recentApps.filter(a => a.name !== app.name)].slice(0, 4);
        localStorage.setItem("recentApps", JSON.stringify(recentApps));
        renderApps();

        const base = localStorage.getItem("uvBaseUrl");
        const cloak = document.getElementById("cloakType").value;
        const icon = "/ExistenceGG75/imgs/canvas.png";
        
        if (!base) return alert("Please set your UV-Static URL!");

        const encoded = uvEncode(app.url);
        // Matching the new /Ultraviolet-Static/ prefix
        const finalUrl = base.replace(/\/$/, "") + "/uv/service/" + encoded;

        const html = `<html><head><title>Dashboard</title><link rel="icon" href="${icon}"><style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}iframe{width:100%;height:100%;border:none;}</style></head><body><iframe src="${finalUrl}"></iframe></body></html>`;

        if (cloak === "blob") {
            window.open(URL.createObjectURL(new Blob([html], { type: "text/html" })), "_blank");
        } else {
            const win = window.open("about:blank", "_blank");
            win.document.write(html);
            win.document.close();
        }
    }

    function removeApp(name) {
        apps = apps.filter(a => a.name !== name);
        recentApps = recentApps.filter(a => a.name !== name);
        localStorage.setItem("workspaceApps", JSON.stringify(apps));
        localStorage.setItem("recentApps", JSON.stringify(recentApps));
        renderApps();
    }

    function saveProxyBase() { localStorage.setItem("uvBaseUrl", document.getElementById("proxyBaseUrl").value); }
    function applyTheme(type) { document.body.setAttribute("data-theme", type); localStorage.setItem("preferredTheme", type); }

    document.getElementById("proxyBaseUrl").value = localStorage.getItem("uvBaseUrl") || "";
    applyTheme(localStorage.getItem("preferredTheme") || "canvas");
    renderApps();
</script>
</body>
</html>
