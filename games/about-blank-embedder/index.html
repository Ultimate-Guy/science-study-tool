<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser OS Prototype v12</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#1e1e2f;color:white;transition:background 0.3s;}
#desktop-container{position:absolute;top:30px;left:0;width:100%;height:calc(100% - 30px);background-size:cover;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px;padding:20px;transition:opacity 0.3s ease, transform 0.3s ease;}
#workspace-tabs{position:absolute;top:0;left:0;width:100%;display:flex;gap:5px;background:rgba(0,0,0,0.3);padding:5px;z-index:20;}
.workspace-tab{padding:5px 10px;background:#2e2e44;border-radius:6px;cursor:pointer;transition:.2s;}
.workspace-tab.active{background:#2563eb;}
.app{background:#1e293b;border-radius:12px;padding:15px;text-align:center;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;}
.app img{width:40px;height:40px;margin-bottom:8px;}
.app:hover{transform:scale(1.05);}
.folder{background:#312e81;}
.window{position:absolute;width:400px;height:300px;background:#1e1e2f;border:2px solid #444;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:transform .3s ease, opacity .3s ease;}
.window-header{background:#2e2e44;padding:5px 10px;cursor:move;display:flex;justify-content:space-between;align-items:center;color:white;user-select:none;}
.window-buttons button{width:16px;height:16px;border:none;border-radius:50%;margin-left:5px;cursor:pointer;}
.window-buttons .close{background:#ff5c5c;}
.window-buttons .min{background:#ffbd4c;}
.window-buttons .max{background:#00ca56;}
.window-content{flex:1;overflow:hidden;}
#dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:5px 10px;background:rgba(0,0,0,0.3);border-radius:20px;backdrop-filter:blur(5px);}
.dock-app{width:60px;height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s;}
.dock-app img{width:40px;height:40px;transition:transform .2s;}
.dock-app span{font-size:10px;margin-top:2px;text-align:center;}
#context-menu{position:absolute;display:none;background:#2e2e44;padding:8px;border-radius:8px;z-index:50;}
#context-menu div{padding:5px 10px;cursor:pointer;}
#context-menu div:hover{background:#444;}
#search{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:300px;padding:8px;border-radius:6px;border:none;display:none;z-index:1000;}
#folder-view{position:absolute;top:30px;left:0;width:100%;height:calc(100% - 30px);background:rgba(0,0,0,0.9);display:none;flex-wrap:wrap;gap:20px;padding:20px;overflow:auto;z-index:50;transition:opacity .3s ease, transform .3s ease;}
#folder-back{position:absolute;top:10px;left:10px;padding:5px 10px;background:#2563eb;border-radius:6px;cursor:pointer;z-index:100;}
.hidden{opacity:0;transform:scale(0.95);pointer-events:none;}
.visible{opacity:1;transform:scale(1);pointer-events:auto;}
#json-buttons{position:absolute;top:35px;right:20px;z-index:1000;display:flex;gap:10px;}
#json-buttons button{padding:5px 10px;border-radius:6px;border:none;color:white;cursor:pointer;}
#export-btn{background:#2563eb;}
#import-btn{background:#16a34a;}
#dock-settings{position:absolute;top:75px;right:20px;z-index:1000;padding:10px;background:rgba(0,0,0,0.3);border-radius:6px;}
#dock-settings label{display:block;margin-bottom:5px;}
#dock-settings input{width:200px;margin-bottom:5px;}
#dock-settings button{padding:5px 5px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;}
.snap-guide{position:absolute;border:2px dashed rgba(255,255,255,0.3);pointer-events:none;z-index:100;}
.resize-handle{position:absolute;width:10px;height:10px;right:0;bottom:0;cursor:se-resize;background:#2563eb;border-radius:2px;}
</style>
</head>
<body>
<div id="workspace-tabs"></div>
<div id="desktop-container"></div>
<div id="dock"></div>
<div id="context-menu"></div>
<input type="text" id="search" placeholder="Spotlight Search...">
<div id="folder-view"><div id="folder-back">← Back</div></div>
<div id="json-buttons">
  <button id="export-btn" onclick="exportJSON()">Export JSON</button>
  <button id="import-btn" onclick="document.getElementById('importFile').click()">Import JSON</button>
  <input type="file" id="importFile" style="display:none" accept=".json" onchange="importJSON(event)">
</div>
<div id="dock-settings">
  <label>Desktop Wallpaper URL:</label>
  <input type="text" id="wallpaper-input" placeholder="https://example.com/wallpaper.jpg">
  <button onclick="changeWallpaper()">Apply Wallpaper</button>
</div>
<script>
// ===== Data =====
let workspaces=JSON.parse(localStorage.getItem('workspaces'))||[
  {name:'Workspace 1',apps:[],wallpaper:'https://i.imgur.com/5QFfA3K.jpg'},
  {name:'Workspace 2',apps:[],wallpaper:'https://i.imgur.com/5QFfA3K.jpg'}
];
let currentWorkspace=0;
let zIndexCounter=10;
let currentFolder=null;

// ===== Elements =====
const desktop=document.getElementById('desktop-container');
const dock=document.getElementById('dock');
const menu=document.getElementById('context-menu');
const searchInput=document.getElementById('search');
const workspaceTabs=document.getElementById('workspace-tabs');
const folderView=document.getElementById('folder-view');
const folderBack=document.getElementById('folder-back');
const wallpaperInput=document.getElementById('wallpaper-input');

// ===== Save =====
function save(){localStorage.setItem('workspaces',JSON.stringify(workspaces));}

// ===== Workspace Tabs =====
function renderWorkspaceTabs(){
  workspaceTabs.innerHTML='';
  workspaces.forEach((ws,i)=>{
    const tab=document.createElement('div');
    tab.className='workspace-tab'+(i===currentWorkspace?' active':'');
    tab.innerText=ws.name;
    tab.onclick=()=>{currentWorkspace=i;currentFolder=null;renderWorkspace();renderWorkspaceTabs();}
    workspaceTabs.appendChild(tab);
  });
}

// ===== Wallpaper =====
function updateWallpaper(){
  desktop.style.backgroundImage=`url('${workspaces[currentWorkspace].wallpaper||'https://i.imgur.com/5QFfA3K.jpg'}')`;
  wallpaperInput.value=workspaces[currentWorkspace].wallpaper||'';
}

// ===== Render Workspace =====
function renderWorkspace(){
  folderView.classList.add('hidden'); 
  desktop.classList.add('hidden'); 
  desktop.style.display='grid';
  updateWallpaper();
  desktop.innerHTML='';
  const ws=workspaces[currentWorkspace];
  const apps=currentFolder?currentFolder.apps:ws.apps;
  apps.forEach((app,i)=>{
    const div=document.createElement('div');
    div.className='app'+(app.folder?' folder':'');
    div.innerHTML=`<img src="${app.icon||'https://www.google.com/s2/favicons?sz=64&domain='+app.url}"><span>${app.name}</span>`;
    div.onclick=()=>app.folder?openFolder(app):openWindow(app);
    div.oncontextmenu=e=>{e.preventDefault();showContext(e,i);}
    div.draggable=true;
    div.ondragstart=e=>{e.dataTransfer.setData('appIndex',i);}
    div.ondragover=e=>e.preventDefault();
    div.ondrop=e=>{
      const from=parseInt(e.dataTransfer.getData('appIndex'));
      [apps[i],apps[from]]=[apps[from],apps[i]];
      save();renderWorkspace();
    }
    desktop.appendChild(div);
  });
  renderDock();
  renderWorkspaceTabs();
  requestAnimationFrame(()=>desktop.classList.remove('hidden')); // fade in
}

// ===== Dock =====
function renderDock(){
  dock.innerHTML='';
  const apps = currentFolder ? currentFolder.apps : workspaces[currentWorkspace].apps;
  apps.forEach((app,i)=>{
    const div = document.createElement('div');
    div.className='dock-app';
    div.innerHTML=`<img src="${app.icon||'https://www.google.com/s2/favicons?sz=64&domain='+app.url}"><span>${app.name}</span>`;
    div.onmousemove = e=>{
      const mouseX = e.clientX;
      Array.from(dock.children).forEach(child=>{
        const img = child.querySelector('img');
        const childRect = child.getBoundingClientRect();
        const distance = Math.abs((childRect.left + childRect.width/2) - mouseX);
        let scale = Math.max(1, 2 - distance/100);
        if(scale>2) scale=2;
        img.style.transform = `scale(${scale})`;
      });
    }
    div.onmouseleave = e=>{Array.from(dock.children).forEach(child=>child.querySelector('img').style.transform='scale(1)');}
    div.onclick = ()=> app.folder ? openFolder(app) : openWindow(app);
    div.oncontextmenu = e=>{e.preventDefault();showContext(e,i);}
    dock.appendChild(div);
  });
}

// ===== Context Menu =====
function showContext(e,i){
  menu.style.display='block';
  menu.style.top=e.clientY+'px';
  menu.style.left=e.clientX+'px';
  menu.innerHTML='';
  const rename=document.createElement('div'); rename.innerText='Rename'; rename.onclick=()=>{menu.style.display='none';renameApp(i);}
  const deleteApp=document.createElement('div'); deleteApp.innerText='Delete'; deleteApp.onclick=()=>{menu.style.display='none';deleteApp(i);}
  const move=document.createElement('div'); move.innerText='Move to Workspace'; move.onclick=()=>{menu.style.display='none';moveApp(i);}
  menu.appendChild(rename); menu.appendChild(deleteApp); menu.appendChild(move);
}
window.onclick=()=>menu.style.display='none';

// ===== Rename/Delete/Move =====
function renameApp(i){const apps=currentFolder?currentFolder.apps:workspaces[currentWorkspace].apps;const name=prompt('New name',apps[i].name);if(name){apps[i].name=name;save();renderWorkspace();}}
function deleteApp(i){const apps=currentFolder?currentFolder.apps:workspaces[currentWorkspace].apps;if(confirm('Delete '+apps[i].name+'?')){apps.splice(i,1);save();renderWorkspace();}}
function moveApp(i){const apps=currentFolder?currentFolder.apps:workspaces[currentWorkspace].apps;const wsIdx=prompt('Move to workspace index (0-'+(workspaces.length-1)+')');const idx=parseInt(wsIdx);if(workspaces[idx]){workspaces[idx].apps.push(apps[i]);apps.splice(i,1);save();renderWorkspace();}}

// ===== Add App =====
function addApp(name,url,icon,folder=false,parentFolder=null){
  const apps=parentFolder?parentFolder.apps:workspaces[currentWorkspace].apps;
  apps.push({name,url,icon,folder,apps:folder?[]:null});
  save();renderWorkspace();
}

// ===== Open Folder =====
function openFolder(folder){
  currentFolder = folder;
  folderView.classList.add('hidden'); 
  desktop.classList.add('hidden'); 
  folderView.style.display='flex';
  folderView.innerHTML='<div id="folder-back">← Back</div>';
  folderBack.onclick=()=>{currentFolder=null;renderWorkspace();}
  folder.apps.forEach((app,i)=>{
    const div = document.createElement('div');
    div.className='app'+(app.folder?' folder':'');
    div.innerHTML=`<img src="${app.icon||'https://www.google.com/s2/favicons?sz=64&domain='+app.url}"><span>${app.name}</span>`;
    div.onclick = ()=> app.folder ? openFolder(app) : openWindow(app);
    div.oncontextmenu = e=>{e.preventDefault();showContext(e,i);}
    div.draggable=true;
    div.ondragstart=e=>{e.dataTransfer.setData('appIndex',i);}
    div.ondragover=e=>e.preventDefault();
    div.ondrop=e=>{
      const from=parseInt(e.dataTransfer.getData('appIndex'));
      [folder.apps[i],folder.apps[from]]=[folder.apps[from],folder.apps[i]];
      save(); openFolder(folder);
    }
    folderView.appendChild(div);
  });
  renderDock();
  requestAnimationFrame(()=>folderView.classList.remove('hidden'));
}

// ===== Window Open with Snapping + Resize =====
function openWindow(app){
  const win=document.createElement('div'); 
  win.className='window hidden'; 
  win.style.top='100px'; win.style.left='100px'; win.style.zIndex=zIndexCounter++;
  win.innerHTML=`<div class="window-header"><span>${app.name}</span><div class="window-buttons"><button class="min"></button><button class="max"></button><button class="close"></button></div></div><div class="window-content"><iframe src="${app.url}" style="width:100%;height:100%;border:none;"></iframe></div><div class="resize-handle"></div>`;
  desktop.appendChild(win);
  requestAnimationFrame(()=>win.classList.remove('hidden'));
  const header=win.querySelector('.window-header'); const close=win.querySelector('.close'); const min=win.querySelector('.min'); const max=win.querySelector('.max'); const handle=win.querySelector('.resize-handle'); let isMax=false;

  // Close/Min/Max
  close.onclick=()=>{win.classList.add('hidden'); setTimeout(()=>desktop.removeChild(win),300);}
  min.onclick=()=>{win.style.display='none';setTimeout(()=>win.style.display='flex',100);}
  max.onclick=()=>{if(!isMax){win.style.top='0';win.style.left='0';win.style.width='100%';win.style.height='100%';isMax=true;}else{win.style.width='400px';win.style.height='300px';win.style.top='100px';win.style.left='100px';isMax=false;}}

  // Drag + Snap
  header.onmousedown=e=>{
    e.preventDefault();
    let offsetX=e.clientX-win.offsetLeft;
    let offsetY=e.clientY-win.offsetTop;
    function move(ev){
      let x=ev.clientX-offsetX;
      let y=ev.clientY-offsetY;
      win.style.left=x+'px';
      win.style.top=y+'px';
      // snapping
      const margin=20;
      if(x<margin) win.style.left='0px';
      if(y<margin) win.style.top='0px';
      if(window.innerWidth-(x+win.offsetWidth)<margin) win.style.left=(window.innerWidth-win.offsetWidth)+'px';
      if(window.innerHeight-(y+win.offsetHeight)<margin) win.style.top=(window.innerHeight-win.offsetHeight)+'px';
    }
    function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseup',up);
  }

  // Resize
  handle.onmousedown=e=>{
    e.preventDefault();
    e.stopPropagation();
    const startWidth=win.offsetWidth;
    const startHeight=win.offsetHeight;
    const startX=e.clientX;
    const startY=e.clientY;
    function resize(ev){
      const newWidth=startWidth+(ev.clientX-startX);
      const newHeight=startHeight+(ev.clientY-startY);
      win.style.width=newWidth+'px';
      win.style.height=newHeight+'px';
    }
    function up(){document.removeEventListener('mousemove',resize);document.removeEventListener('mouseup',up);}
    document.addEventListener('mousemove',resize);
    document.addEventListener('mouseup',up);
  }
}

// ===== Panic Canvas (Key "-") =====
function panicCanvas(){const win=document.createElement('div'); win.className='window hidden'; win.style.top='50px'; win.style.left='50px'; win.style.width='800px'; win.style.height='600px'; win.style.zIndex=zIndexCounter++; win.innerHTML=`<div class="window-header"><span>Canvas</span><div class="window-buttons"><button class="close"></button></div></div><div class="window-content"><iframe src="https://forsyth.instructure.com/?login_success=1" style="width:100%;height:100%;border:none;"></iframe></div>`; desktop.appendChild(win); requestAnimationFrame(()=>win.classList.remove('hidden')); win.querySelector('.close').onclick=()=>{win.classList.add('hidden'); setTimeout(()=>desktop.removeChild(win),300);}
document.addEventListener('keydown',e=>{if(e.key==='-'){panicCanvas();}});

// ===== Spotlight Search =====
document.addEventListener('keydown',e=>{if(e.ctrlKey && e.key===' '){searchInput.style.display='block';searchInput.focus();} if(e.key==='Escape'){searchInput.style.display='none';}});

// ===== Export/Import JSON =====
function exportJSON(){const data=new Blob([JSON.stringify(workspaces,null,2)],{type:'application/json'});const a=document.createElement('a'); a.href=URL.createObjectURL(data); a.download='workspaces.json'; a.click(); URL.revokeObjectURL(a.href);}
function importJSON(e){const file=e.target.files[0];if(!file)return; const reader=new FileReader(); reader.onload=function(ev){try{const data=JSON.parse(ev.target.result);workspaces=data;currentWorkspace=0;save();renderWorkspace();}catch(err){alert('Invalid JSON');}}; reader.readAsText(file);}

// ===== Wallpaper Setter =====
function changeWallpaper(){const url=wallpaperInput.value.trim();if(url){workspaces[currentWorkspace].wallpaper=url;save();updateWallpaper();}}

// ===== Init =====
if(workspaces[currentWorkspace].apps.length===0){
  addApp('Google','https://www.google.com');
  addApp('YouTube','https://www.youtube.com');
  addApp('Canvas','https://forsyth.instructure.com/?login_success=1');
}
renderWorkspace();
</script>
</body>
</html>
