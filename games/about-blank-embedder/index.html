function openApp(url) {
    const win = window.open("about:blank", "_blank");

    win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Dashboard</title>

            <!-- Canvas favicon -->
            <link rel="icon" type="image/png" href="https://static.instructure.com/images/favicon.ico">

            <style>
                html, body {
                    margin: 0;
                    padding: 0;
                    height: 100%;
                    overflow: hidden;
                    background: #000;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: none;
                }
            </style>
        </head>
        <body>

            <iframe src="${url}" allowfullscreen></iframe>

            <script>
                // Ctrl + P shortcut
                document.addEventListener("keydown", function(e) {
                    if (e.ctrlKey && e.key.toLowerCase() === "p") {
                        e.preventDefault(); // stops print dialog
                        window.open("https://forsyth.instructure.com/?login_success=1", "_blank");
                    }
                });
            <\/script>

        </body>
        </html>
    `);

    win.document.close();
}
