<!DOCTYPE html>
<html>
<head>
    <title id="tab-title">Dashboard</title>
    <link id="tab-icon" rel="icon" type="image/png" href="/ExistenceGG75/imgs/canvas.png">
    <style>
        :root { --bg: #f5f5f5; --header: #24292e; --text: #ffffff; --accent: #e00122; --card: #ffffff; --border: #d1d1d1; --card-text: #2d3b45; }
        [data-theme="dark"] { --bg: #0f172a; --header: #111827; --text: #ffffff; --accent: #3b82f6; --card: #1e293b; --border: #334155; --card-text: #ffffff; }

        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; min-height: 100vh; }
        header { padding: 12px 20px; background: var(--header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 600; color: var(--accent); font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
        
        /* Proxy Status Indicator */
        .proxy-status { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 20px; background: rgba(0,0,0,0.2); }
        .status-light { width: 10px; height: 10px; border-radius: 50%; background: #666; transition: 0.3s; }
        .online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        .setup-area { display: none; flex-direction: column; gap: 10px; padding: 20px; background: rgba(0,0,0,0.05); border-bottom: 1px solid var(--border); color: var(--card-text); }
        .setup-area.visible { display: flex; }
        
        .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 5px; align-items: center; }
        input, select, textarea { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: #000; font-size: 13px; }
        
        button { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; background: var(--accent); color: white; font-weight: bold; transition: 0.2s; font-size: 13px; }
        .edit-toggle { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 18px; padding: 4px 10px; }

        .category-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding: 0 20px; margin: 25px 0 10px; }
        .category-title { font-size: 0.85rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding: 0 20px; }
        .app-card { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--card-text); position: relative; }
        .app-icon { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }
        .delete-btn { font-size: 18px; color: #ff4d4d; cursor: pointer; padding: 5px; display: none; margin-left: auto; }
        .editing .delete-btn { display: flex; }
    </style>
</head>
<body data-theme="canvas">

<header>
    <div class="logo"><img src="/ExistenceGG75/imgs/canvas.png" width="24"> <span>Dashboard</span></div>
    
    <div class="proxy-status">
        <div id="proxyLight" class="status-light"></div>
        <span id="proxyText">Proxy: Offline</span>
        <button onclick="checkProxyStatus()" style="background:none; border:1px solid #fff; font-size:10px; padding:2px 5px; margin-left:5px;">Check</button>
    </div>

    <button class="edit-toggle" onclick="toggleEditMode()">⚙️</button>
</header>

<div id="setupArea" class="setup-area">
    <div class="row">
        <input type="text" id="appName" placeholder="App Name">
        <input type="text" id="appUrl" placeholder="URL (example.com)">
        <input type="text" id="appCat" placeholder="Category">
        <select id="proxyEngine">
            <option value="auto">Auto-Detect Engine</option>
            <option value="uv">Ultraviolet</option>
            <option value="sj">Scramjet</option>
            <option value="rh">Rammerhead</option>
            <option value="none">No Proxy</option>
        </select>
    </div>
    <div class="row">
        <label style="font-size: 11px;">Custom Icon: <input type="file" id="appIconFile" accept="image/*"></label>
        <button onclick="addApp()">+ Add App</button>
    </div>
    <div class="row">
        <input type="text" id="proxyUrlInput" placeholder="Your Codespace URL" style="width: 350px;" oninput="saveProxyUrl()">
        <select id="cloakType">
            <option value="blank">Cloak: about:blank</option>
            <option value="blob">Cloak: Blob URL</option>
        </select>
    </div>
    <div class="row" style="font-size: 0.8rem; opacity: 0.8;">
        <span>Panic Key: <input type="text" id="panicKey" placeholder="-" style="width:30px; text-align:center;" oninput="savePanic()"></span>
        <span>Redirect: <input type="text" id="panicLink" placeholder="google.com" oninput="savePanic()"></span>
    </div>
</div>

<div id="categories-container"></div>

<script>
    let apps = JSON.parse(localStorage.getItem("workspaceApps")) || [];
    let isEditing = false;

    function toggleEditMode() {
        isEditing = !isEditing;
        document.getElementById("setupArea").classList.toggle("visible", isEditing);
        document.body.classList.toggle("editing", isEditing);
    }

    function saveProxyUrl() {
        localStorage.setItem("customProxyUrl", document.getElementById("proxyUrlInput").value);
        checkProxyStatus();
    }

    async function checkProxyStatus() {
        const url = localStorage.getItem("customProxyUrl");
        if (!url) return;
        try {
            await fetch(url, { mode: 'no-cors' });
            document.getElementById("proxyLight").className = "status-light online";
            document.getElementById("proxyText").innerText = "Proxy: Online";
        } catch (e) {
            document.getElementById("proxyLight").className = "status-light offline";
            document.getElementById("proxyText").innerText = "Proxy: Offline";
        }
    }

    async function addApp() {
        const name = document.getElementById("appName").value, urlInput = document.getElementById("appUrl").value;
        const category = document.getElementById("appCat").value || "General", iconFile = document.getElementById("appIconFile").files;
        let engine = document.getElementById("proxyEngine").value;

        if (!name || !urlInput) return;
        let url = urlInput.startsWith("http") ? urlInput : "https://" + urlInput;

        let iconData = null;
        if (iconFile.length > 0) {
            iconData = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(iconFile[0]);
            });
        }

        if (engine === "auto") {
            try {
                const res = await fetch(`https://corsproxy.io{encodeURIComponent(url)}`, { method: 'HEAD' });
                engine = (res.headers.get("X-Frame-Options")) ? "uv" : "none";
            } catch (e) { engine = "uv"; }
        }

        apps.push({ name, url, category, proxy: engine, icon: iconData || `https://www.google.com{url}&sz=64` });
        localStorage.setItem("workspaceApps", JSON.stringify(apps));
        renderApps();
    }

    function renderApps() {
        const container = document.getElementById("categories-container");
        container.innerHTML = "";
        const groups = apps.reduce((acc, app) => {
            const cat = app.category || "General";
            if (!acc[cat]) acc[cat] = [];
            acc[cat].push(app);
            return acc;
        }, {});

        Object.keys(groups).sort().forEach(cat => {
            const header = document.createElement("div");
            header.className = "category-header";
            header.innerHTML = `<div class="category-title">${cat}</div>`;
            const grid = document.createElement("div");
            grid.className = "apps";
            groups[cat].forEach(app => {
                const card = document.createElement("div");
                card.className = "app-card";
                card.onclick = () => openApp(app);
                card.innerHTML = `<img src="${app.icon}" class="app-icon"><strong>${app.name}</strong><span class="delete-btn" onclick="event.stopPropagation(); removeApp('${app.name}')">&times;</span>`;
                grid.appendChild(card);
            });
            container.appendChild(header);
            container.appendChild(grid);
        });
    }

    function openApp(app) {
        const proxyBase = localStorage.getItem("customProxyUrl");
        const cloak = document.getElementById("cloakType").value;
        const icon = "/ExistenceGG75/imgs/canvas.png";
        let finalUrl = app.url;

        if (app.proxy !== "none" && proxyBase) {
            const enginePath = app.proxy === 'uv' ? '/service/' : (app.proxy === 'sj' ? '/main/' : '/proxy/');
            finalUrl = proxyBase.replace(/\/$/, "") + enginePath + btoa(app.url).replace(/=/g, "");
        }

        const html = `<html><head><title>Dashboard</title><link rel="icon" href="${icon}"><style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}iframe{width:100%;height:100%;border:none;}</style></head><body><iframe src="${finalUrl}"></iframe></body></html>`;

        if (cloak === "blob") {
            window.open(URL.createObjectURL(new Blob([html], { type: "text/html" })), "_blank");
        } else {
            const win = window.open("about:blank", "_blank");
            win.document.write(html);
            win.document.close();
        }
    }

    function removeApp(name) {
        apps = apps.filter(a => a.name !== name);
        localStorage.setItem("workspaceApps", JSON.stringify(apps));
        renderApps();
    }

    function savePanic() { localStorage.setItem("panicKey", document.getElementById("panicKey").value); localStorage.setItem("panicLink", document.getElementById("panicLink").value); }

    document.getElementById("panicKey").value = localStorage.getItem("panicKey") || "-";
    document.getElementById("panicLink").value = localStorage.getItem("panicLink") || "google.com";
    document.getElementById("proxyUrlInput").value = localStorage.getItem("customProxyUrl") || "";
    renderApps();
    checkProxyStatus();
</script>
</body>
</html>
