<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="https://instructure-uploads.s3.amazonaws.com">
    <style>
        :root {
            --bg: #1a1a1a; --card: #252525; --text: #ffffff; --primary: #4facfe; --danger: #ff4d4d;
        }
        body.light-mode {
            --bg: #f5f5f5; --card: #ffffff; --text: #2D3B45; --primary: #004d99; --danger: #d93025;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Segoe UI", sans-serif; overflow: hidden; background: var(--bg); color: var(--text); transition: 0.3s; }

        /* --- NEW EMBEDDER UI --- */
        #dashboard { display: flex; flex-direction: column; height: 100vh; }
        .nav { height: 60px; background: rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links span { margin-left: 20px; cursor: pointer; font-weight: 600; opacity: 0.8; }
        .nav-links span:hover { opacity: 1; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; display: block; }
        .section { display: none; max-width: 900px; margin: 0 auto; }
        .section.active { display: block; }

        /* App Creator Bar */
        .app-creator { display: flex; gap: 10px; margin-bottom: 30px; background: var(--card); padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .app-creator input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        .app-creator button { padding: 10px 20px; background: var(--primary); border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* App Grid */
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .app-item { background: var(--card); border-radius: 10px; padding: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); }
        .app-info { display: flex; align-items: center; gap: 12px; }
        .app-icon { width: 35px; height: 35px; border-radius: 6px; }
        .app-actions button { padding: 5px 10px; font-size: 12px; margin-left: 5px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
        .btn-cloak { background: var(--primary); color: white; }
        .btn-remove { background: var(--danger); color: white; }

        /* Settings Styles */
        .settings-card { background: var(--card); padding: 25px; border-radius: 10px; }
        .setting-item { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .setting-item label { font-size: 14px; font-weight: bold; opacity: 0.8; }
        .setting-item input, .setting-item select { padding: 10px; border-radius: 5px; background: #333; border: 1px solid #444; color: white; max-width: 300px; }
    </style>
</head>
<body class="dark-mode">

<div id="dashboard">
    <div class="nav">
        <div style="font-size: 20px; font-weight: 800; letter-spacing: 1px;">About Blank Embedder</div>
        <div class="nav-links">
            <span onclick="showSection('apps-sec')">Apps</span>
            <span onclick="showSection('settings-sec')">Settings</span>
        </div>
    </div>

    <div class="main-content">
        <!-- APPS SECTION -->
        <div id="apps-sec" class="section active">
            <div class="app-creator">
                <input type="text" id="new-name" placeholder="App Name">
                <input type="text" id="new-url" placeholder="https://example.com">
                <button onclick="addApp()">Add App</button>
            </div>
            <div class="apps-grid" id="apps"></div>
        </div>

        <!-- SETTINGS SECTION -->
        <div id="settings-sec" class="section">
            <div class="settings-card">
                <h2>Settings</h2>
                
                <div class="setting-item">
                    <label>Panic Key</label>
                    <input type="text" id="panic-key-input" maxlength="1" onchange="updateSetting('pKey', this.value)">
                </div>

                <div class="setting-item">
                    <label>Panic Redirect URL</label>
                    <input type="text" id="panic-url-input" onchange="updateSetting('panicUrl', this.value)">
                </div>

                <div class="setting-item">
                    <label>Cloaking Method</label>
                    <select id="cloak-method" onchange="updateSetting('method', this.value)">
                        <option value="about">about:blank</option>
                        <option value="blob">Blob URL</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>Appearance</label>
                    <select id="theme-select" onchange="toggleTheme(this.value)">
                        <option value="dark">Dark Mode</option>
                        <option value="light">Light Mode</option>
                    </select>
                </div>

                <div class="setting-item" style="flex-direction: row; gap: 10px; margin-top: 20px;">
                    <button onclick="floodHistory()" style="background:#444; color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer;">Flood History</button>
                    <button onclick="cloudSync()" style="background:var(--primary); color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer;">Cloud Sync / Login</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let config = JSON.parse(localStorage.getItem("ex_config")) || {
        apps: [],
        pKey: "]",
        panicUrl: "https://forsyth.instructure.com",
        method: "about",
        theme: "dark"
    };

    function save() { localStorage.setItem("ex_config", JSON.stringify(config)); }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function toggleTheme(mode) {
        config.theme = mode;
        document.body.className = mode + "-mode";
        save();
    }

    function updateSetting(key, val) { config[key] = val; save(); }

    function addApp() {
        const n = document.getElementById("new-name").value;
        const u = document.getElementById("new-url").value;
        if(n && u) {
            config.apps.push({name: n, url: u.startsWith('http') ? u : 'https://' + u});
            document.getElementById("new-name").value = "";
            document.getElementById("new-url").value = "";
            save(); renderApps();
        }
    }

    function removeApp(i) { config.apps.splice(i, 1); save(); renderApps(); }

    function renderApps() {
        const grid = document.getElementById("apps"); grid.innerHTML = "";
        config.apps.forEach((app, i) => {
            const div = document.createElement("div"); div.className = "app-item";
            const domain = new URL(app.url).hostname;
            div.innerHTML = `
                <div class="app-info">
                    <img class="app-icon" src="https://www.google.com{domain}&sz=128">
                    <div style="font-weight:600;">${app.name}</div>
                </div>
                <div class="app-actions">
                    <button class="btn-cloak" onclick="openApp(${i})">Cloak</button>
                    <button class="btn-remove" onclick="removeApp(${i})">Remove</button>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function openApp(i) {
        const url = config.apps[i].url;
        const win = window.open("about:blank", "_blank");
        if (!win) return alert("Pop-up blocked!");

        const content = `<html><head><title>Dashboard</title><link rel="icon" href="https://instructure-uploads.s3.amazonaws.com"><style>body,html,iframe{margin:0;padding:0;height:100%;width:100%;overflow:hidden;border:none;background:#fff;}</style></head>
            <body><iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe><script>window.onkeydown=(e)=>{if(e.key==="${config.pKey}")window.location.replace("${config.panicUrl}")};<\/script></body></html>`;
        
        if (config.method === "blob") {
            win.location.href = URL.createObjectURL(new Blob([content], { type: 'text/html' }));
        } else {
            win.document.write(content);
        }
    }

    function floodHistory() {
        for (let i = 0; i < 50; i++) {
            history.pushState({}, '', window.location.href + "#" + i);
        }
        alert("History Flooded!");
    }

    function cloudSync() {
        const user = prompt("Enter Sync ID / Username:");
        if (user) alert("Syncing with ExistenceGG Cloud...");
    }

    // Initialize UI
    document.getElementById("panic-key-input").value = config.pKey;
    document.getElementById("panic-url-input").value = config.panicUrl;
    document.getElementById("cloak-method").value = config.method;
    document.getElementById("theme-select").value = config.theme;
    toggleTheme(config.theme);
    renderApps();

    window.onkeydown = (e) => { if(e.key === config.pKey) window.location.replace(config.panicUrl); };
</script>
</body>
</html>
