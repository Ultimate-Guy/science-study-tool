<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" id="favicon" href="https://instructure-uploads.s3.amazonaws.com">
    <style>
        :root { --bg: #1a1a1a; --card: #252525; --text: #ffffff; --primary: #4facfe; --danger: #ff4d4d; }
        body.light-mode { --bg: #f5f5f5; --card: #ffffff; --text: #2D3B45; --primary: #004d99; --danger: #d93025; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Segoe UI", sans-serif; overflow: hidden; background: var(--bg); color: var(--text); transition: 0.3s; }
        #snapshot-mask { display: none; position: fixed; inset: 0; background: #ffffff; z-index: 9999; }
        #fake-cursor { position: absolute; width: 22px; transition: all 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95); pointer-events: none; z-index: 10000; }
        #dashboard { display: flex; flex-direction: column; height: 100vh; }
        .nav { height: 60px; background: rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links span { cursor: pointer; font-weight: 600; opacity: 0.8; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .section { display: none; max-width: 900px; margin: 0 auto; }
        .section.active { display: block; }
        .app-creator { display: flex; gap: 10px; margin-bottom: 30px; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .app-creator input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        .app-creator button { padding: 10px 20px; background: var(--primary); border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .app-item { background: var(--card); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .settings-card { background: var(--card); padding: 25px; border-radius: 10px; position: relative; }
        .close-settings { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; opacity: 0.6; color: var(--text); }
        .setting-item { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .setting-item input, .setting-item select { padding: 10px; border-radius: 5px; background: #333; border: 1px solid #444; color: white; }
        #toast { visibility: hidden; min-width: 200px; background-color: #22c55e; color: #fff; text-align: center; border-radius: 5px; padding: 12px; position: fixed; z-index: 10005; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="dark-mode" oncontextmenu="return false;">

<div id="toast">Received</div>

<div id="snapshot-mask">
    <img id="fake-cursor" src="https://www.pngall.com" alt="cursor">
    <img id="snapshot-img" src="https://i.ibb.co">
</div>

<div id="dashboard">
    <div class="nav">
        <div id="brand-title" style="font-size: 18px; font-weight: 800;">About Blank Embedder</div>
        <div class="nav-links">
            <span onclick="showSection('apps-sec')">Apps</span>
            <span onclick="showSection('settings-sec')">Settings</span>
        </div>
    </div>
    <div class="main-content">
        <div id="apps-sec" class="section active">
            <div class="app-creator">
                <input type="text" id="new-name" placeholder="App Name">
                <input type="text" id="new-url" placeholder="example.com">
                <button onclick="addApp(false)">Add App</button>
                <button onclick="addApp(true)" style="background:#ff4fac">Add Hidden</button>
            </div>
            <div class="apps-grid" id="apps"></div>
        </div>
        <div id="settings-sec" class="section">
            <div class="settings-card">
                <span class="close-settings" onclick="showSection('apps-sec')">✕</span>
                <h2>Master Settings</h2>
                <div class="setting-item"><label>Tab Masking</label><select id="mask-preset" onchange="updateMask(this.value)"><option value="canvas">Canvas</option><option value="drive">Google Drive</option><option value="campus">Infinite Campus</option><option value="gmail">Gmail</option></select></div>
                <div class="setting-item"><label>Shadow Mask (Idle Deception)</label><select id="shadow-toggle" onchange="updateSetting('shadowMode', this.value)"><option value="off">Off</option><option value="on">On</option></select></div>
                <div class="setting-item"><label>High-Security (Anti-Linewize)</label><select id="high-sec-toggle" onchange="updateSetting('highSec', this.value)"><option value="off">Off</option><option value="on">On</option></select></div>
                <div class="setting-item"><label>Active Proxy</label><select id="proxy-mirror-select" onchange="updateSetting('activeProxy', this.value)"></select><button onclick="proxyBot()" style="margin-top:5px; background:#444; color:white; border:none; padding:5px; cursor:pointer;">Scan Mirror Backups</button></div>
                <div class="setting-item"><label>App Sharing</label><div style="display:flex; gap:5px;"><button onclick="exportApps()" style="flex:1; background:#4facfe; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;">Copy Code</button><button onclick="importApps()" style="flex:1; background:#22c55e; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;">Import Code</button></div></div>
                <div class="setting-item"><label>Panic Key</label><input type="text" id="panic-key-input" maxlength="1" onchange="updateSetting('pKey', this.value)"></div>
                <div class="setting-item"><label>Panic URL</label><input type="text" id="panic-url-input" onchange="updateSetting('panicUrl', this.value)"></div>
                <button onclick="floodHistory()" style="padding:10px; background:#444; border:none; color:white; border-radius:4px;">Flood History (6 Steps)</button>
            </div>
        </div>
    </div>
</div>

<script>
    const p1 = "http://proxy.ikunbeautiful.workers.dev";
    const p2 = "https://hm3.agatab.com";
    const p3 = "https://vcsefghfhreesgfdf.dfgrdcfhfgfds.bonded-game.com";

    function crypt(str, key) { return btoa(str.split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))).join('')); }
    function decrypt(str, key) { try { return atob(str).split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))).join(''); } catch(e) { return "[]"; } }

    function loadConfig() {
        const raw = localStorage.getItem("ex_data_v75");
        let data = raw ? JSON.parse(atob(raw)) : { apps: "W00=", pKey: "]", panicUrl: "https://forsyth.instructure.com", pin: "1234", activeProxy: p1, proxies: [p1, p2, p3], mask: 'canvas', stealthKey: 'This-is-password', shadowMode: 'off', highSec: 'off', purgeHours: '0' };
        [p1, p2, p3].forEach(p => { if(!data.proxies.includes(p)) data.proxies.push(p); });
        data.appList = JSON.parse(decrypt(data.apps, data.pin));
        return data;
    }

    let config = loadConfig();
    let childWindow = null, shadowIframe = null, idleShadowTimer;

    function save() {
        let saveObj = {...config};
        saveObj.apps = crypt(JSON.stringify(config.appList), config.pin);
        delete saveObj.appList;
        localStorage.setItem("ex_data_v75", btoa(JSON.stringify(saveObj)));
    }

    function showNotification(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.className = "show";
        setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
    }

    // FIXED addApp FUNCTION
    function addApp(isSecret) {
        const nameInput = document.getElementById("new-name");
        const urlInput = document.getElementById("new-url");
        if(nameInput.value && urlInput.value) {
            const cleanUrl = urlInput.value.trim().replace(/^https?:\/\//, '');
            config.appList.push({ name: nameInput.value, url: cleanUrl, secret: isSecret });
            save();
            renderApps();
            nameInput.value = "";
            urlInput.value = "";
            showNotification("App Added");
        }
    }

    async function launch(i) {
        const app = config.appList[i];
        childWindow = window.open("about:blank", "_blank");
        const hs = config.highSec === 'on' ? `Object.defineProperty(navigator,'webdriver',{get:()=>undefined});Object.defineProperty(navigator,'hardwareConcurrency',{get:()=>8});` : '';
        const docContent = `<!DOCTYPE html><html><head><title>Dashboard</title><link rel="icon" href="https://instructure-uploads.s3.amazonaws.com"><style>body,html{margin:0;padding:0;height:100vh;overflow:hidden;background:#000;}iframe{width:100%;height:100%;border:none;}</style></head><body><iframe src="${config.activeProxy + app.url}"></iframe><script>${hs}window.onkeydown=(e)=>{if(e.key==="${config.pKey}"){window.parent.postMessage('panic','*');window.location.replace("${config.panicUrl}");}};<\/script></body></html>`;
        setTimeout(() => { childWindow.document.write(docContent); childWindow.document.close(); }, 100);
    }

    function renderApps() {
        const grid = document.getElementById("apps");
        grid.innerHTML = "";
        config.appList.forEach((app, i) => {
            grid.innerHTML += `<div class="app-item"><b>${app.name}</b><button onclick="launch(${i})">Cloak</button></div>`;
        });
    }

    function updateSetting(k, v) { config[k] = v; save(); showNotification("Setting Saved"); }
    function renderProxySelect() {
        const s = document.getElementById('proxy-mirror-select');
        if (!s) return;
        s.innerHTML = "";
        config.proxies.forEach(p => {
            const o = document.createElement('option');
            o.value = p;
            o.innerText = p.includes('ikun') ? "IKun (Default)" : p.includes('agatab') ? "AgaTab (Secure)" : "Mirror";
            if (p === config.activeProxy) o.selected = true;
            s.appendChild(o);
        });
    }
    
    function updateMask(val) { config.mask = val; save(); document.title = val === 'canvas' ? 'Dashboard' : val; }
    function showSection(id) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    window.addEventListener('DOMContentLoaded', () => {
        renderProxySelect();
        renderApps();
    });
</script>
</body>
</html>
