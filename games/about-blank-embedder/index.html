<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FCS | Login</title>
<link rel="icon" href="https://launchpad.classlink.com">

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f8fafc;
  --accent: #3b82f6;
  --danger: #ef4444;
  --success: #10b981;
}

.light-mode {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --accent: #2563eb;
}

body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Inter', 'Segoe UI', sans-serif;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}

/* LOGIN */
#login-page {
  height: 100vh;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FACADE */
#facade {
  display: none;
  height: 100vh;
  background: linear-gradient(135deg, #1aa3b0, #3ec6d3);
  flex-direction: column;
}

/* 🔥 CLASSLINK STYLE */
.fcs-wrapper { padding: 25px 30px; }

.fcs-row { margin-bottom: 30px; }

.fcs-row-title {
  color: white;
  font-size: 14px;
  margin-bottom: 10px;
}

.fcs-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}

.fcs-app {
  width: 95px;
  text-align: center;
  color: white;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.fcs-icon {
  width: 75px;
  height: 75px;
  border-radius: 16px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 6px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  transition: 0.2s;
}

.fcs-icon:hover { transform: scale(1.07); }

/* DASHBOARD + ORIGINAL STYLES KEPT */
#dashboard { display: none; height: 100vh; overflow-y: auto; }

.dash-header {
  display: flex;
  justify-content: space-between;
  padding: 20px;
  background: var(--card);
}

.container {
  max-width: 900px;
  margin: 40px auto;
}

.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-page">
  <div style="width:300px;text-align:center;">
    <img src="https://launchpad.classlink.com" style="width:60px;">
    <h2>Fulton County Schools</h2>
    <input type="text" placeholder="Username"><br><br>
    <input type="password" placeholder="Password"><br><br>
    <button onclick="fakeLogin()">Sign In</button>
  </div>
</div>

<!-- FACADE -->
<div id="facade">
  <div style="height:55px;background:rgba(0,77,153,0.95);display:flex;align-items:center;padding:0 20px;color:white;">
    <div style="font-weight:900;">FCS</div>
    <div style="flex:1;text-align:center;">
      <input placeholder="Search..." style="width:45%;padding:6px 15px;border-radius:20px;border:none;background:rgba(255,255,255,0.2);color:white;">
    </div>
  </div>

  <div class="fcs-wrapper" id="decoy-grid"></div>
</div>

<!-- DASHBOARD (UNCHANGED LOGIC) -->
<div id="dashboard">
  <div class="dash-header">
    <div>ExistenceGG</div>
  </div>

  <div class="container">
    <input id="appName" placeholder="App Name">
    <input id="appUrl" placeholder="URL">
    <button onclick="addApp()">Add</button>

    <div class="apps-grid" id="apps"></div>
  </div>
</div>

<script>
let apps = JSON.parse(localStorage.getItem("ex_v11_apps")) || [];
let config = JSON.parse(localStorage.getItem("ex_v11_conf")) || {
  pUrl: "https://drive.google.com",
  pKey: "`",
  th: "dark"
};

function fakeLogin() {
  document.getElementById("login-page").style.display = "none";
  document.getElementById("facade").style.display = "flex";
  document.title = "FCS | Dashboard";
  renderDecoy();
}

/* 🔥 CLASSLINK LAYOUT */
function renderDecoy() {
  const layout = [
    {
      title: "Main Apps",
      apps: [
        { name: "Infinite Campus", icon: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Infinite_Campus_logo.png" },
        { name: "Google Drive", icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_48dp.png" },
        { name: "Microsoft 365", icon: "https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" },
        { name: "OneDrive", icon: "https://upload.wikimedia.org/wikipedia/commons/4/4e/Microsoft_Office_OneDrive_%282019–present%29.svg" }
      ]
    },
    {
      title: "Learning",
      apps: [
        { name: "Canvas", icon: "https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico" },
        { name: "Science", icon: "https://img.icons8.com/color/96/test-tube.png" },
        { name: "Math", icon: "https://img.icons8.com/color/96/calculator.png" },
        { name: "ELA", icon: "https://img.icons8.com/color/96/book.png" }
      ]
    }
  ];

  const container = document.getElementById("decoy-grid");
  container.innerHTML = "";

  layout.forEach((row, r) => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "fcs-row";
    rowDiv.innerHTML = `<div class="fcs-row-title">${row.title}</div>`;

    const grid = document.createElement("div");
    grid.className = "fcs-grid";

    row.apps.forEach((app, i) => {
      const div = document.createElement("div");
      div.className = "fcs-app";

      if (r === 0 && i === 0) {
        div.onclick = (e) => {
          if (e.detail === 3) {
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("facade").style.display = "none";
          }
        };
      }

      div.innerHTML = `
        <div class="fcs-icon">
          <img src="${app.icon}" style="width:55%;">
        </div>
        <div>${app.name}</div>
      `;

      grid.appendChild(div);
    });

    rowDiv.appendChild(grid);
    container.appendChild(rowDiv);
  });
}

/* ORIGINAL APP SYSTEM */
function addApp() {
  const n = appName.value;
  let u = appUrl.value;
  if (!n || !u) return;
  if (!u.startsWith("http")) u = "https://" + u;
  apps.push({ name: n, url: u });
  localStorage.setItem("ex_v11_apps", JSON.stringify(apps));
  renderApps();
}

function renderApps() {
  const grid = document.getElementById("apps");
  grid.innerHTML = "";
  apps.forEach((a,i)=>{
    grid.innerHTML += `
      <div>
        ${a.name}
        <button onclick="openApp(${i})">Open</button>
      </div>
    `;
  });
}

/* 🔥 PROXY PATCH ONLY */
function openApp(i) {
  const app = apps[i];
  const win = window.open("about:blank");
  win.document.write(`
    <iframe src="http://proxy.ikunbeautiful.workers.dev/?url=https://corsproxy.io/?${encodeURIComponent(app.url)}" style="width:100%;height:100%;border:none;"></iframe>
  `);
}
</script>

</body>
</html>
