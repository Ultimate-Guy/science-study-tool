<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" id="favicon" href="https://instructure-uploads.s3.amazonaws.com">
    <style>
        :root { --bg: #1a1a1a; --card: #252525; --text: #ffffff; --primary: #4facfe; --danger: #ff4d4d; }
        body.light-mode { --bg: #f5f5f5; --card: #ffffff; --text: #2D3B45; --primary: #004d99; --danger: #d93025; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: "Segoe UI", sans-serif; overflow: hidden; background: var(--bg); color: var(--text); transition: 0.3s; }
        #maint-screen { display: none; position: fixed; inset: 0; background: white; color: black; z-index: 10001; padding: 50px; text-align: left; }
        #snapshot-mask { display: none; position: fixed; inset: 0; background: #ffffff; z-index: 9999; }
        #fake-cursor { position: absolute; width: 22px; transition: all 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95); pointer-events: none; z-index: 10000; }
        #dashboard { display: flex; flex-direction: column; height: 100vh; }
        .nav { height: 60px; background: rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 30px; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links span { cursor: pointer; font-weight: 600; opacity: 0.8; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .section { display: none; max-width: 900px; margin: 0 auto; }
        .section.active { display: block; }
        .app-creator { display: flex; gap: 10px; margin-bottom: 30px; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .app-creator input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        .app-creator button { padding: 10px 20px; background: var(--primary); border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .app-item { background: var(--card); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .settings-card { background: var(--card); padding: 25px; border-radius: 10px; position: relative; }
        .setting-item { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .setting-item input, .setting-item select { padding: 10px; border-radius: 5px; background: #333; border: 1px solid #444; color: white; }
    </style>
</head>
<body class="dark-mode" oncontextmenu="return false;">

<div id="maint-screen">
    <h1 style="font-size: 50px; margin-bottom: 10px;">404 Not Found</h1>
    <p>The requested URL was not found on this server.</p>
    <hr><address>Apache/2.4.41 (Ubuntu) Server at forsyth.instructure.com Port 443</address>
</div>

<div id="snapshot-mask">
    <img id="fake-cursor" src="https://www.pngall.com" alt="cursor">
    <img id="snapshot-img" src="https://i.ibb.co">
</div>

<div id="dashboard">
    <div class="nav">
        <div id="brand-title" style="font-size: 18px; font-weight: 800;" onclick="tripleClickPanic()">About Blank Embedder</div>
        <div class="nav-links">
            <span onclick="showSection('apps-sec')">Apps</span>
            <span onclick="showSection('settings-sec')">Settings</span>
        </div>
    </div>
    <div class="main-content">
        <div id="apps-sec" class="section active">
            <div class="app-creator">
                <input type="text" id="new-name" placeholder="App Name">
                <input type="text" id="new-url" placeholder="example.com">
                <button onclick="addApp(false)">Add App</button>
                <button onclick="addApp(true)" style="background:#ff4fac">Add Hidden</button>
            </div>
            <div class="apps-grid" id="apps"></div>
        </div>
        <div id="settings-sec" class="section">
            <div class="settings-card">
                <h2>Security & Stealth</h2>
                <div class="setting-item">
                    <label>Traffic Jitter (Anti-Linewize AI)</label>
                    <select id="jitter-toggle" onchange="updateSetting('jitter', this.value)">
                        <option value="off">Off</option>
                        <option value="on">On (Randomize traffic shape)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Screenshot Panic (BETA)</label>
                    <select id="ss-panic-toggle" onchange="updateSetting('ssPanic', this.value)">
                        <option value="off">Off</option>
                        <option value="on">On (Switch tab on PrintScreen)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Ghost Mode (Auto-Close)</label>
                    <select id="ghost-toggle" onchange="updateSetting('ghostMode', this.value)">
                        <option value="off">Off</option>
                        <option value="on">On (Close inactive tab after 2m)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Active Proxy</label>
                    <select id="proxy-mirror-select" onchange="updateSetting('activeProxy', this.value)"></select>
                    <button onclick="proxyBot()" style="margin-top:5px; background:#444; color:white; border:none; padding:5px; cursor:pointer;">Scan Mirror Backups</button>
                </div>
                <div class="setting-item"><label>Panic Key</label><input type="text" id="panic-key-input" maxlength="1" onchange="updateSetting('pKey', this.value)"></div>
                <div class="setting-item"><label>Panic URL</label><input type="text" id="panic-url-input" onchange="updateSetting('panicUrl', this.value)"></div>
                <button onclick="floodHistory()" style="padding:10px; background:#444; border:none; color:white; border-radius:4px;">Flood History (12 Steps)</button>
            </div>
        </div>
    </div>
</div>

<script>
    const presets = {
        canvas: { title: "Dashboard", fav: "https://instructure-uploads.s3.amazonaws.com" }
    };

    function crypt(str, key) { return btoa(str.split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))).join('')); }
    function decrypt(str, key) { try { return atob(str).split('').map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))).join(''); } catch(e) { return "[]"; } }

    function loadConfig() {
        const raw = localStorage.getItem("ex_data_v75");
        const defaultP = "http://proxy.ikunbeautiful.workers.dev";
        let data = raw ? JSON.parse(atob(raw)) : { apps: "W00=", pKey: "]", panicUrl: "https://forsyth.instructure.com", pin: "1234", activeProxy: defaultP, proxies: [defaultP], mask: 'canvas', jitter: 'off', ssPanic: 'off', ghostMode: 'off' };
        data.appList = JSON.parse(decrypt(data.apps, data.pin));
        return data;
    }

    let config = loadConfig();
    let childWindow = null;
    let ghostTimer;

    function save() {
        let saveObj = {...config};
        saveObj.apps = crypt(JSON.stringify(config.appList), config.pin);
        delete saveObj.appList;
        localStorage.setItem("ex_data_v75", btoa(JSON.stringify(saveObj)));
    }

    // GHOST MODE: Auto-close tab if inactive
    function resetGhostTimer() {
        clearTimeout(ghostTimer);
        if (config.ghostMode === 'on' && childWindow && !childWindow.closed) {
            ghostTimer = setTimeout(() => {
                childWindow.location.replace(config.panicUrl);
                setTimeout(() => childWindow.close(), 100);
            }, 120000); // 2 Minutes
        }
    }
    window.addEventListener('mousemove', resetGhostTimer);

    // TRAFFIC JITTER: Bypasses Linewize pattern detection
    setInterval(() => {
        if (config.jitter === 'on') {
            // Sends random dummy data to confuse traffic analysis AI
            fetch(config.activeProxy + '://google.com' + Math.random(), { mode: 'no-cors' }).catch(()=>{});
        }
    }, 40000);

    // SCREENSHOT PANIC: Detects manual PrintScreen attempts
    window.addEventListener('keyup', (e) => {
        if (config.ssPanic === 'on' && e.key === 'PrintScreen') triggerPanic();
    });

    function triggerPanic() {
        if (childWindow) childWindow.location.replace(config.panicUrl);
        window.location.replace(config.panicUrl);
    }

    async function launch(i) {
        const app = config.appList[i];
        childWindow = window.open("about:blank", "_blank");
        const docContent = `<!DOCTYPE html><html><head><title>Dashboard</title><link rel="icon" href="${presets.canvas.fav}"><style>body,html{margin:0;padding:0;height:100vh;overflow:hidden;background:#000;}iframe{width:100%;height:100%;border:none;}</style></head><body><iframe src="${config.activeProxy + app.url}"></iframe><script>window.onkeydown=(e)=>{if(e.key==="${config.pKey}"){window.parent.postMessage('panic','*');window.location.replace("${config.panicUrl}");}};<\/script></body></html>`;
        setTimeout(() => { childWindow.document.write(docContent); childWindow.document.close(); }, 100);
    }

    function addApp(isSecret) {
        const n = document.getElementById("new-name"), u = document.getElementById("new-url");
        if(n.value && u.value) { config.appList.push({name: n.value, url: u.value.trim().replace(/^https?:\/\//, ''), secret: isSecret}); save(); renderApps(); n.value = ""; u.value = ""; }
    }

    function renderApps() {
        const grid = document.getElementById("apps"); grid.innerHTML = "";
        config.appList.forEach((app, i) => { grid.innerHTML += `<div class="app-item"><b>${app.name}</b><button onclick="launch(${i})">Cloak</button></div>`; });
    }

    function updateSetting(k, v) { config[k] = v; save(); if(k === 'ghostMode') resetGhostTimer(); }
    function renderProxySelect() { const select = document.getElementById('proxy-mirror-select'); select.innerHTML = ""; config.proxies.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.innerText = p.includes('ikunbeautiful') ? "Default Proxy" : "Mirror"; if (p === config.activeProxy) opt.selected = true; select.appendChild(opt); }); }
    function showSection(id) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    renderProxySelect(); renderApps();
</script>
</body>
</html>
