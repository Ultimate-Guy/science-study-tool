<!DOCTYPE html>
<html lang="en-us">
<head>
<base href="https://cdn.jsdelivr.net/gh/faralong/all@main/extremerun/">

<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Extreme Run 3D</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    height: 100%;
    width: 100%;
  }

  #unity-container, #unity-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
  }

  #unity-canvas {
    background: black;
  }

  #loading-cover {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
  }
</style>

</head>
<body class="dark">

<div id="unity-container">
  <canvas id="unity-canvas"></canvas>
</div>

<div id="loading-cover">
  <div id="unity-loading-bar">
    <div id="unity-logo">
      <img src="logo.png">
      <br>
      <p id="loading-txt" style="text-align:center;font-family:'MuseoModerno',cursive;color:white;font-size:50px;margin:0;">
        Loading...
      </p>
    </div>

    <div id="unity-progress-bar-empty" style="display:none;">
      <div id="unity-progress-bar-full"></div>
    </div>

    <div class="spinner"></div>
  </div>
</div>

<script>
  const buildUrl = "Build";
  const loaderUrl = buildUrl + "/ExtremeRun3D_13May.loaderrrr.js";

  const config = {
    dataUrl: buildUrl + "/fc4125c5f6edc94f1926057556d3cd21.data.unityweb",
    frameworkUrl: buildUrl + "/e95a19b5525f8ed2c2acf8820ae45cc1.js.unityweb",
    codeUrl: buildUrl + "/bec53a90c17b21b72af689a95d70004b.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "GAMEHOX11",
    productName: "Extreme Run 3D",
    productVersion: "1.8",
  };

  const canvas = document.querySelector("#unity-canvas");
  const loadingCover = document.querySelector("#loading-cover");
  const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const spinner = document.querySelector(".spinner");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  const script = document.createElement("script");
  script.src = loaderUrl;

  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      spinner.style.display = "none";
      progressBarEmpty.style.display = "";
      progressBarFull.style.width = `${100 * progress}%`;
    }).then((unityInstance) => {
      loadingCover.style.display = "none";

      // Force fullscreen automatically
      setTimeout(() => {
        unityInstance.SetFullscreen(1);
      }, 300);

    }).catch((message) => {
      alert(message);
    });
  };

  document.body.appendChild(script);
</script>

</body>
</html>
