<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 2. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #050202; --sidebar-bg: #0a0a0a; --border: #1a1a1a; --text: #e0e0e0; --input-bg: #0d0d0d; }
        body.light-mode { --bg: #ffffff; --sidebar-bg: #f5f5f5; --border: #eee; --text: #111; --input-bg: #ffffff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
        
        #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        #app-container { display: flex; position: absolute; inset: 0; z-index: 1; }

        #sidebar { width: 260px; height: 100%; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        #chat-section { flex: 1; height: 100%; display: flex; flex-direction: column; background: transparent; position: relative; }
        
        #theme-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; border: 1px solid var(--p-red); color: var(--p-red); font-size: 11px; font-weight: 800; cursor: pointer; border-radius: 6px; z-index: 100; background: var(--bg); }
        #chat-container { flex: 1; overflow-y: auto; padding: 80px 20px 20px 20px; display: flex; flex-direction: column; }
        .message { width: 100%; max-width: 900px; margin: 0 auto 40px auto; }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 12px; color: var(--p-red); letter-spacing: 2px; }

        #input-wrapper { width: 100%; padding: 20px; background: linear-gradient(transparent, var(--bg) 40%); }
        #input-container { width: 100%; max-width: 900px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .ai-selector { background: transparent; border: none; color: var(--p-red); font-size: 10px; font-weight: 800; cursor: pointer; outline: none; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; resize: none; max-height: 200px; }

        .new-chat-btn { padding: 12px; border: 1px solid var(--p-red); color: var(--p-red); text-align: center; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 800; margin-bottom: 30px; }
        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #777; margin-bottom: 4px; }
        .chat-item.active { background: rgba(255,26,26,0.1); color: var(--text); border: 1px solid var(--p-red); }
        
        .thinking-dots { display: flex; gap: 4px; padding: 10px 0; }
        .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--p-red); animation: bounce 1.4s infinite ease-in-out; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="theme-btn" onclick="toggleTheme()">DARK MODE</div>
<div id="app-container">
    <div id="sidebar">
        <div class="new-chat-btn" onclick="createNewChat()">+ NEW CHAT</div>
        <div id="chat-list"></div>
        <div style="margin-top: auto; font-size: 9px; color: #444;">PHOENIX_ARCHITECT_OS</div>
    </div>
    <div id="chat-section">
        <div id="chat-container"></div>
        <div id="input-wrapper">
            <div id="input-container">
                <select id="model-select" class="ai-selector">
                    <option value="llama">Llama 3.1</option>
                    <option value="deepseek">DeepSeek R1</option>
                    <option value="gemma">Gemma 4</option>
                    <option value="flux">Flux (Image)</option>
                </select>
                <textarea id="user-input" placeholder="Architecting thoughts..." rows="1" autofocus></textarea>
                <div style="color:var(--p-red); cursor:pointer; font-weight: 900; font-size: 20px;" onclick="sendMessage()">➔</div>
            </div>
        </div>
    </div>
</div>
<script>
    const WORKER_URL = "https://phoenix-ai-proxy.prabhavd75.workers.dev/";
    let chats = JSON.parse(localStorage.getItem('phoenix_chats') || '{}');
    let activeChatId = null, isDarkMode = true;

    window.onload = () => { renderChatList(); const ids = Object.keys(chats); if(ids.length) loadChat(ids.sort().pop()); else createNewChat(); };
    function createNewChat() { activeChatId = Date.now().toString(); chats[activeChatId] = { title: "New Session", history: [{ role: "system", content: "You are Phoenix AI." }] }; save(); renderChatList(); loadChat(activeChatId); }
    function loadChat(id) { activeChatId = id; document.getElementById('chat-container').innerHTML = ''; chats[id].history.slice(1).forEach(m => appendMessage(m.role, m.content, false)); renderChatList(); }

    async function sendMessage() {
        const inputField = document.getElementById('user-input'), text = inputField.value.trim();
        if(!text) return;
        appendMessage('user', text);
        chats[activeChatId].history.push({role: "user", content: text});
        inputField.value = '';
        const model = document.getElementById('model-select').value;
        if(model === 'flux') await generateImage(text); else await getAIResponse(model);
    }

    async function getAIResponse(model) {
        const messageDiv = appendMessage('ai', '<div class="thinking-dots"><span></span><span></span><span></span></div>');
        const contentDiv = messageDiv.querySelector('.content');
        let fullResponse = "";
        try {
            const response = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: chats[activeChatId].history, model: model }) });
            const reader = response.body.getReader(), decoder = new TextDecoder();
            contentDiv.innerHTML = "";
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value).split("\n");
                for (const line of chunk) {
                    if (line.trim().startsWith("data: ")) {
                        try {
                            const raw = line.replace("data: ", "").trim();
                            const json = JSON.parse(raw);
                            const content = json.response || json.choices?.[0]?.delta?.content || "";
                            if (content) { fullResponse += content; contentDiv.innerHTML = marked.parse(fullResponse); document.getElementById('chat-container').scrollTop = 1e9; }
                        } catch (e) {}
                    }
                }
            }
            chats[activeChatId].history.push({ role: "assistant", content: fullResponse });
            save();
        } catch(e) { contentDiv.innerText = "SIGNAL_LOST: Proxy Error."; }
    }

    async function generateImage(prompt) {
        const messageDiv = appendMessage('ai', '<div class="thinking-dots"><span></span><span></span><span></span></div>'), contentDiv = messageDiv.querySelector('.content');
        try {
            const res = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: [{content: prompt}], model: 'flux' }) });
            const data = await res.json();
            if (data.image) contentDiv.innerHTML = `<img src="${data.image}" style="width:100%; border-radius:14px; border:1px solid var(--p-red); margin-top:10px;">`;
            chats[activeChatId].history.push({ role: "assistant", content: `[Image]` });
            save();
        } catch(e) { contentDiv.innerText = "Generation failed."; }
    }

    function appendMessage(role, text) {
        const div = document.createElement('div'); div.className = 'message';
        div.innerHTML = `<div class="label">>> ${role.toUpperCase()}</div><div class="content"></div>`;
        document.getElementById('chat-container').appendChild(div);
        const content = div.querySelector('.content');
        content.innerHTML = text.includes('thinking-dots') ? text : marked.parse(text);
        document.getElementById('chat-container').scrollTop = 1e9;
        return div;
    }

    function renderChatList() {
        const list = document.getElementById('chat-list'); list.innerHTML = '';
        Object.keys(chats).sort().reverse().forEach(id => {
            const div = document.createElement('div');
            div.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
            div.onclick = () => loadChat(id);
            div.innerHTML = `<span class="title">${chats[id].title}</span>`;
            list.appendChild(div);
        });
    }

    function save() { localStorage.setItem('phoenix_chats', JSON.stringify(chats)); }
    function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('light-mode'); document.getElementById('theme-btn').innerText = isDarkMode ? "DARK MODE" : "LIGHT MODE"; }

    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'); let particles = [];
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }; window.onresize();
    class P { constructor(x,y) { this.x=x; this.y=y; this.size=Math.random()*1.5; this.sx=(Math.random()-0.5)*0.8; this.sy=(Math.random()-0.5)*0.8; } u() { this.x+=this.sx; this.y+=this.sy; if(this.size>0.1) this.size-=0.01; } d() { ctx.fillStyle = 'rgba(255,26,26,0.3)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,6.28); ctx.fill(); } }
    window.addEventListener('mousemove', e => { for(let i=0; i<3; i++) particles.push(new P(e.x, e.y)); });
    function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p,i) => { p.u(); p.d(); if(p.size<=0.1) particles.splice(i,1); }); requestAnimationFrame(animate); }
    animate();
    document.getElementById('user-input').addEventListener("keypress", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
