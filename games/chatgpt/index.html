<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 2. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #050202; --sidebar-bg: rgba(10, 5, 5, 0.98); --border: #150505; --text: #e0e0e0; --input-bg: #0a0808; }
        body.light-mode { --bg: #ffffff; --sidebar-bg: #fdfdfd; --border: #eee; --text: #111; --input-bg: #ffffff; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; display: flex; }
        
        /* FULLSCREEN CANVAS FIX */
        #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }

        #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; z-index: 10; flex-shrink: 0; }
        
        /* FULLSCREEN CHAT SECTION FIX */
        #chat-section { 
            position: relative;
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            z-index: 5; 
            height: 100vh; 
            background: var(--bg); /* This fills the void you see in the image */
            transition: background 0.3s;
        }
        
        #theme-btn { position: absolute; top: 20px; right: 20px; padding: 8px 15px; border: 1px solid var(--p-red); color: var(--p-red); font-size: 10px; font-weight: 800; cursor: pointer; border-radius: 5px; z-index: 100; background: var(--bg); }

        #chat-container { flex: 1; overflow-y: auto; padding: 60px 0; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; max-width: 850px; margin: 0 auto 40px auto; padding: 0 30px; box-sizing: border-box; }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 12px; color: var(--p-red); letter-spacing: 2px; }
        .content { line-height: 1.8; font-size: 15px; }

        #input-wrapper { padding: 20px 0 40px 0; background: linear-gradient(transparent, var(--bg) 40%); }
        #input-container { width: 90%; max-width: 850px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        .ai-selector { background: transparent; border: none; color: var(--p-red); font-size: 10px; font-weight: 800; cursor: pointer; outline: none; text-transform: uppercase; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; resize: none; font-family: inherit; }

        .new-chat-btn { padding: 12px; border: 1px solid var(--p-red); color: var(--p-red); text-align: center; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 800; margin-bottom: 20px; }
        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: #888; margin-bottom: 4px; }
        .chat-item:hover, .chat-item.active { background: rgba(255,26,26,0.1); color: var(--text); }
        .dots { font-size: 18px; padding: 0 5px; }

        /* Thinking Animation */
        .thinking-dots { display: flex; gap: 4px; padding: 5px 0; }
        .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--p-red); animation: bounce 1.4s infinite ease-in-out both; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Modal & Context Menu */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal { background: #0a0a0a; border: 1px solid var(--p-red); padding: 25px; border-radius: 12px; width: 300px; }
        #context-menu { position: absolute; background: #111; border: 1px solid #333; border-radius: 6px; display: none; z-index: 100; width: 120px; }
        .menu-item { padding: 10px; font-size: 11px; cursor: pointer; }
        .menu-item:hover { background: #222; color: var(--p-red); }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="theme-btn" onclick="toggleTheme()">DARK MODE</div>

<div id="sidebar">
    <div class="new-chat-btn" onclick="createNewChat()">+ NEW CHAT</div>
    <div id="chat-list"></div>
    <div style="margin-top: auto; font-size: 9px; color: #444; opacity: 0.5;">PHOENIX_ARCHITECT_OS</div>
</div>

<div id="chat-section">
    <div id="chat-container"></div>
    <div id="input-wrapper">
        <div id="input-container">
            <select id="model-select" class="ai-selector">
                <option value="llama">Llama 3.3 70B</option>
                <option value="deepseek">DeepSeek R1</option>
                <option value="gemma">Gemma 3</option>
                <option value="flux">Flux (Images)</option>
            </select>
            <textarea id="user-input" placeholder="Message Phoenix..." rows="1" autofocus></textarea>
            <div style="color:var(--p-red); cursor:pointer; font-weight: 900;" onclick="sendMessage()">➔</div>
        </div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3 style="color:var(--p-red); font-size:12px; letter-spacing:1px;">RENAME CHAT</h3>
        <input type="text" id="modal-input" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:white; margin:15px 0; border-radius:5px;">
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="closeModal()" style="background:transparent; color:#888; border:none; cursor:pointer;">Cancel</button>
            <button onclick="confirmRename()" style="background:var(--p-red); color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Save</button>
        </div>
    </div>
</div>

<div id="context-menu">
    <div class="menu-item" onclick="openRenameModal()">Rename</div>
    <div class="menu-item" onclick="deleteChat()" style="color:#ff4444;">Delete</div>
</div>

<script>
    const WORKER_URL = "https://phoenix-ai-proxy.prabhavd75.workers.dev/";
    let chats = JSON.parse(localStorage.getItem('phoenix_chats') || '{}');
    let activeChatId = null, menuTargetId = null, isDarkMode = true;

    window.onload = () => { renderChatList(); const ids = Object.keys(chats); if(ids.length) loadChat(ids.sort().pop()); else createNewChat(); };

    function createNewChat() {
        activeChatId = Date.now().toString();
        chats[activeChatId] = { title: "New Session", history: [{ role: "system", content: "You are Phoenix AI." }] };
        save(); renderChatList(); loadChat(activeChatId);
    }

    function loadChat(id) {
        activeChatId = id;
        document.getElementById('chat-container').innerHTML = '';
        chats[id].history.slice(1).forEach(m => appendMessage(m.role, m.content, false));
        renderChatList();
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input'), text = inputField.value.trim();
        if(!text) return;
        if(chats[activeChatId].history.length === 1) chats[activeChatId].title = text.substring(0, 20);
        appendMessage('user', text);
        chats[activeChatId].history.push({role: "user", content: text});
        inputField.value = '';
        const model = document.getElementById('model-select').value;
        if(model === 'flux') await generateImage(text); else await getAIResponse(model);
    }

    async function getAIResponse(model) {
        const messageDiv = appendMessage('ai', '<div class="thinking-dots"><span></span><span></span><span></span></div>');
        const contentDiv = messageDiv.querySelector('.content');
        let fullResponse = "";
        try {
            const response = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: chats[activeChatId].history, model: model }) });
            const reader = response.body.getReader(), decoder = new TextDecoder();
            contentDiv.innerHTML = "";
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split("\n");
                for (const line of lines) {
                    if (line.trim().startsWith("data: ")) {
                        try {
                            const json = JSON.parse(line.replace("data: ", ""));
                            if (json.response) {
                                fullResponse += json.response;
                                contentDiv.innerHTML = marked.parse(fullResponse);
                                document.getElementById('chat-container').scrollTop = 1e9;
                            }
                        } catch (e) {}
                    }
                }
            }
            chats[activeChatId].history.push({ role: "assistant", content: fullResponse });
            save();
        } catch(e) { contentDiv.innerText = "SIGNAL_LOST: Proxy Error."; }
    }

    async function generateImage(prompt) {
        const messageDiv = appendMessage('ai', '<div class="thinking-dots"><span></span><span></span><span></span></div>'), contentDiv = messageDiv.querySelector('.content');
        try {
            const res = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: [{content: prompt}], model: 'flux' }) });
            const data = await res.json();
            contentDiv.innerHTML = `<img src="${data.image}" style="width:100%; border-radius:12px; border:1px solid var(--p-red); margin-top:10px;">`;
            chats[activeChatId].history.push({ role: "assistant", content: `[Image]` });
            save();
        } catch(e) { contentDiv.innerText = "Generation failed."; }
    }

    function deleteChat() {
        if (!menuTargetId) return;
        delete chats[menuTargetId];
        save();
        if (activeChatId === menuTargetId) createNewChat(); else renderChatList();
        document.getElementById('context-menu').style.display = 'none';
    }

    function renderChatList() {
        const list = document.getElementById('chat-list'); list.innerHTML = '';
        Object.keys(chats).sort().reverse().forEach(id => {
            const div = document.createElement('div');
            div.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
            div.onclick = () => loadChat(id);
            div.innerHTML = `<span class="title">${chats[id].title}</span><span class="dots" onclick="showMenu(event, '${id}')">⋮</span>`;
            list.appendChild(div);
        });
    }

    function appendMessage(role, text, anim = true) {
        const div = document.createElement('div'); div.className = 'message';
        div.innerHTML = `<div class="label">>> ${role.toUpperCase()}</div><div class="content">${text}</div>`;
        document.getElementById('chat-container').appendChild(div);
        if(role !== 'ai' || !text.includes('thinking-dots')) div.querySelector('.content').innerHTML = marked.parse(text);
        document.getElementById('chat-container').scrollTop = 1e9;
        return div;
    }

    function showMenu(e, id) { e.stopPropagation(); menuTargetId = id; const menu = document.getElementById('context-menu'); menu.style.display = 'block'; menu.style.top = `${e.pageY}px`; menu.style.left = `${e.pageX}px`; }
    function openRenameModal() { document.getElementById('modal-overlay').style.display = 'flex'; document.getElementById('modal-input').value = chats[menuTargetId].title; document.getElementById('context-menu').style.display = 'none'; }
    function confirmRename() { chats[menuTargetId].title = document.getElementById('modal-input').value; save(); renderChatList(); closeModal(); }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function save() { localStorage.setItem('phoenix_chats', JSON.stringify(chats)); }
    function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('light-mode'); document.getElementById('theme-btn').innerText = isDarkMode ? "DARK MODE" : "LIGHT MODE"; }
    window.onclick = () => document.getElementById('context-menu').style.display = 'none';

    // Particles
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'); let particles = [];
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }; window.onresize();
    class P { constructor(x,y) { this.x=x; this.y=y; this.size=Math.random()*1.5; this.sx=(Math.random()-0.5)*0.8; this.sy=(Math.random()-0.5)*0.8; } u() { this.x+=this.sx; this.y+=this.sy; if(this.size>0.1) this.size-=0.01; } d() { ctx.fillStyle = 'rgba(255,26,26,0.3)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,6.28); ctx.fill(); } }
    window.addEventListener('mousemove', e => { for(let i=0; i<3; i++) particles.push(new P(e.x, e.y)); });
    function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p,i) => { p.u(); p.d(); if(p.size<=0.1) particles.splice(i,1); }); requestAnimationFrame(animate); }
    animate();
    document.getElementById('user-input').addEventListener("keypress", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
