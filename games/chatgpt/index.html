<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 2. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { 
            --p-red: #ff1a1a; --bg: #ffffff; --sidebar-bg: #f9f9f9; --border: #e5e5e5; 
            --text: #000000; --input-bg: #f4f4f4; --bubble-ai: transparent; --bubble-user: #f4f4f4;
            --code-bg: #2d2d2d; 
        }
        body.dark-mode { 
            --bg: #0d0d0d; --sidebar-bg: #000000; --border: #262626; 
            --text: #ececec; --input-bg: #171717; --bubble-ai: transparent; --bubble-user: #212121;
            --code-bg: #1a1a1a;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; transition: 0.3s; }
        
        #app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        #sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; transition: all 0.4s ease; z-index: 200; }
        .sidebar-header { font-size: 10px; font-weight: 800; color: #888; margin: 20px 0 10px 10px; letter-spacing: 1px; text-transform: uppercase; }

        /* Neuron Gauge UI */
        #neuron-gauge-container { margin-top: 20px; padding: 15px; background: rgba(255, 26, 26, 0.05); border-radius: 12px; border: 1px solid rgba(255, 26, 26, 0.1); position: relative; }
        .gauge-header { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; color: var(--p-red); margin-bottom: 8px; text-transform: uppercase; }
        .gauge-bar-bg { width: 100%; height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; overflow: hidden; }
        .gauge-bar-fill { height: 100%; width: 0%; background: var(--p-red); transition: width 0.5s ease; }
        .reset-timer { font-size: 9px; opacity: 0.5; margin-top: 8px; text-align: center; }
        #status-tag { display: none; position: absolute; top: -8px; right: 10px; background: var(--p-red); color: white; font-size: 8px; padding: 2px 6px; border-radius: 10px; font-weight: 900; }

        /* Hard Stop State */
        .limit-reached #input-container { opacity: 0.3; pointer-events: none; }
        .limit-reached textarea::placeholder { color: var(--p-red); }

        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; height: 100%; }
        #chat-header-brand { position: absolute; top: 20px; left: 30px; font-size: 14px; font-weight: 900; color: var(--p-red); letter-spacing: 2px; z-index: 100; }
        #theme-btn { position: absolute; top: 20px; right: 30px; padding: 8px 12px; border: 1px solid var(--border); font-size: 10px; cursor: pointer; border-radius: 6px; z-index: 100; background: var(--bg); color: var(--text); font-weight: 700; }
        
        /* Landing View Logic */
        .landing-view #sidebar { transform: translateX(-100%); width: 0; padding: 0; opacity: 0; visibility: hidden; }
        .landing-view #landing-header { display: block; text-align: center; margin-bottom: 40px; width: 90%; animation: fadeIn 0.8s ease; }
        #landing-header { display: none; }
        #landing-header h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 700; }

        .landing-view #chat-container { display: none; }
        .landing-view #input-wrapper { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-bottom: 10vh; }
        
        /* Chat Area */
        #chat-container { flex: 1; overflow-y: auto; padding: 80px 20px 40px 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; max-width: 800px; margin: 0 auto 24px auto; display: flex; flex-direction: column; }
        .message .label { font-size: 9px; font-weight: 900; margin-bottom: 6px; color: var(--p-red); letter-spacing: 1px; padding-left: 12px; }
        .message .content { padding: 16px 20px; border-radius: 18px; line-height: 1.6; font-size: 16px; border: 1px solid var(--border); }
        .message.user .content { background: var(--bubble-user); border-bottom-right-radius: 4px; align-self: flex-end; }
        .message.ai .content { background: var(--bubble-ai); border: none; padding-left: 0; }

        /* Code Blocks */
        .code-wrapper { position: relative; margin: 15px 0; border-radius: 8px; background: var(--code-bg); overflow: hidden; border: 1px solid var(--border); }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: rgba(255,255,255,0.05); font-size: 11px; color: #b4b4b4; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .copy-btn { background: transparent; border: none; color: #b4b4b4; cursor: pointer; font-size: 11px; }
        pre { padding: 16px; margin: 0; overflow-x: auto; font-family: 'Fira Code', monospace; font-size: 14px; }

        /* Input Area */
        #input-wrapper { width: 100%; padding: 20px; transition: 0.5s ease; }
        #input-container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 20px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; position: relative; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 16px; outline: none; resize: none; max-height: 200px; padding: 10px 0; line-height: 1.5; letter-spacing: normal; }
        
        .ai-selector { background: transparent; border: none; color: var(--p-red); font-size: 10px; font-weight: 900; cursor: pointer; outline: none; text-transform: uppercase; }
        .p-img { height: 60px; border-radius: 8px; border: 1px solid var(--p-red); }

        /* Buttons */
        .sidebar-btn { padding: 14px; border: 1px solid var(--p-red); color: var(--p-red); text-align: center; border-radius: 10px; cursor: pointer; font-size: 11px; font-weight: 800; margin-bottom: 10px; transition: 0.2s; }
        .sidebar-btn:hover { background: var(--p-red); color: white; }
        .chat-item { padding: 12px; border-radius: 10px; cursor: pointer; font-size: 13px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .chat-item.active { background: rgba(255,26,26,0.06); color: var(--text); border: 1px solid rgba(255,26,26,0.1); }

        .thinking-txt { font-size: 14px; color: var(--text); opacity: 0.6; padding: 10px 0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="light-mode">
<div id="theme-btn" onclick="toggleTheme()">LIGHT MODE</div>
<div id="app-container" class="landing-view">
    <div id="sidebar">
        <div class="sidebar-btn" onclick="createNewChat()">+ NEW CHAT</div>
        <div class="sidebar-btn" style="border-color: #555; color: #555;" onclick="clearHistory()">CLEAR HISTORY</div>
        <div class="sidebar-header">Recent</div>
        <div id="chat-list"></div>

        <div id="neuron-gauge-container">
            <div id="status-tag">SAFE</div>
            <div class="gauge-header">
                <span>Neurons</span>
                <span id="neuron-value">0 / 10k</span>
            </div>
            <div class="gauge-bar-bg"><div id="gauge-fill" class="gauge-bar-fill"></div></div>
            <div id="reset-clock" class="reset-timer">Reset in: --:--:--</div>
        </div>

        <div style="margin-top:auto; font-size:9px; opacity:0.3; padding-left: 10px;">PHOENIX_ARCHITECT_OS</div>
    </div>
    <div id="chat-section">
        <div id="chat-header-brand">PHOENIX AI</div>
        <div id="chat-container"></div>
        <div id="input-wrapper">
            <div id="landing-header"><h1>Where should we begin?</h1></div>
            <div id="preview-bar" style="display:none; padding: 10px; gap: 10px; max-width: 800px; margin: 0 auto; align-items: center;"></div>
            <div id="input-container">
                <div class="plus-btn" onclick="document.getElementById('file-in').click()" style="cursor:pointer; font-size: 22px;">+</div>
                <input type="file" id="file-in" hidden accept="image/*" onchange="handleFile(event)">
                <select id="model-select" class="ai-selector">
                    <option value="glm">GLM-4.7</option>
                    <option value="kimi">Kimi-K2</option>
                    <option value="gemma">Gemma 4</option>
                    <option value="llama">Llama-3.2 Vision</option>
                </select>
                <textarea id="user-input" placeholder="Message Phoenix..." rows="1"></textarea>
                <div id="send-btn" style="color:var(--p-red); cursor:pointer; font-weight:900; font-size:24px;" onclick="sendMessage()">➔</div>
            </div>
        </div>
    </div>
</div>
<script>
    const WORKER_URL = "https://phoenix-ai-proxy.prabhavd75.workers.dev/";
    let chats = JSON.parse(localStorage.getItem('phoenix_chats') || '{}'), activeChatId = null, attachedImg = null, isDarkMode = false;
    let neuronStats = JSON.parse(localStorage.getItem('phoenix_neurons') || '{"count": 0, "day": 0}');

    function checkReset() {
        const today = new Date().getUTCDate();
        if (neuronStats.day !== today) { 
            neuronStats = { count: 0, day: today }; 
            document.body.classList.remove('limit-reached');
            updateGauge(); 
        }
    }

    function updateGauge() {
        const percent = Math.min((neuronStats.count / 10000) * 100, 100);
        document.getElementById('gauge-fill').style.width = percent + '%';
        document.getElementById('neuron-value').innerText = `${Math.round(neuronStats.count)} / 10k`;
        
        const statusTag = document.getElementById('status-tag');
        const selector = document.getElementById('model-select');
        const input = document.getElementById('user-input');

        if (percent >= 99) {
            statusTag.innerText = "HARD STOP";
            statusTag.style.display = 'block';
            document.body.classList.add('limit-reached');
            input.placeholder = "Daily limit reached.";
        } else if (percent >= 80) {
            statusTag.innerText = "ECO MODE";
            statusTag.style.display = 'block';
            if (selector.value !== 'llama') selector.value = 'llama';
        } else {
            statusTag.style.display = 'none';
        }
        localStorage.setItem('phoenix_neurons', JSON.stringify(neuronStats));
    }

    function updateClock() {
        const now = new Date();
        const reset = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
        const diff = reset - now;
        const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
        document.getElementById('reset-clock').innerText = `Reset in: ${h}h ${m}m ${s}s`;
    }

    setInterval(() => { checkReset(); updateClock(); }, 1000);
    function cleanMath(t) { return t.replace(/\$/g, ''); }
    window.onload = () => { renderList(); checkReset(); updateGauge(); const ids = Object.keys(chats); if(ids.length) loadChat(ids.sort().pop()); else createNewChat(); };
    function save() { localStorage.setItem('phoenix_chats', JSON.stringify(chats)); }
    
    function createNewChat() { 
        activeChatId = Date.now().toString(); 
        chats[activeChatId] = { title: "New Session", history: [{ role: "system", content: "You are Phoenix AI. Never use dollar signs." }] }; 
        save(); renderList(); loadChat(activeChatId); 
    }
    
    function loadChat(id) { 
        activeChatId = id; 
        const app = document.getElementById('app-container');
        document.getElementById('chat-container').innerHTML = '';
        if (chats[id].history.length <= 1) app.classList.add('landing-view');
        else { app.classList.remove('landing-view'); chats[id].history.slice(1).forEach(m => appendMessage(m.role, m.content)); }
        renderList(); 
    }

    function clearHistory() {
        if (!activeChatId || !confirm("Clear all messages in this session to save neurons?")) return;
        chats[activeChatId].history = [chats[activeChatId].history[0]];
        save(); loadChat(activeChatId);
    }

    async function sendMessage() {
        if (document.body.classList.contains('limit-reached')) return;
        const f = document.getElementById('user-input'), text = f.value.trim();
        if(!text && !attachedImg) return;
        
        document.getElementById('app-container').classList.remove('landing-view');
        let content = attachedImg ? [{ type: "text", text: text || "Analyze this image." }, { type: "image_url", image_url: { url: attachedImg } }] : text;
        appendMessage('user', content);
        chats[activeChatId].history.push({ role: "user", content: content });
        if (chats[activeChatId].title === "New Session") chats[activeChatId].title = (text || "Image Query").substring(0, 30);
        f.value = ''; clearImg(); f.style.height = 'auto';
        await getAIResponse(document.getElementById('model-select').value);
    }

    async function getAIResponse(model) {
        const div = appendMessage('ai', '<div class="thinking-txt">Thinking...</div>');
        const contentDiv = div.querySelector('.content');
        const statusDiv = div.querySelector('.thinking-txt');
        document.getElementById('app-container').classList.remove('landing-view');

        let seconds = 0;
        const timer = setInterval(() => {
            seconds++;
            if (seconds === 10 && statusDiv) statusDiv.innerText = "One moment...";
        }, 1000);

        try {
            const res = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: chats[activeChatId].history, model: model }) });
            
            if (res.status !== 200) {
                const errData = await res.json();
                if (errData.error && errData.error.includes("4006")) {
                    clearInterval(timer); statusDiv.remove();
                    contentDiv.innerHTML = `<b style="color:var(--p-red)">⚠️ LIMIT REACHED (4006)</b><p>Account is out of free neurons.</p>`;
                    neuronStats.count = 10000; updateGauge(); return;
                }
            }

            const reader = res.body.getReader(), decoder = new TextDecoder();
            let full = "", firstWord = true;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (firstWord) { clearInterval(timer); if(statusDiv) statusDiv.remove(); firstWord = false; }
                const chunk = decoder.decode(value);
                full += chunk;
                neuronStats.count += (chunk.length * 0.45); updateGauge();
                if (neuronStats.count >= 9950) break;
                contentDiv.innerHTML = marked.parse(cleanMath(full));
                addCopyButtons(contentDiv);
                document.getElementById('chat-container').scrollTop = 1e9;
            }
            chats[activeChatId].history.push({ role: "assistant", content: cleanMath(full) }); save(); renderList();
        } catch(e) { clearInterval(timer); if(statusDiv) statusDiv.innerText = "System Busy."; }
    }

    function appendMessage(role, content) {
        const div = document.createElement('div'); div.className = `message ${role}`;
        div.innerHTML = `<div class="label">${role.toUpperCase()}</div><div class="content"></div>`;
        document.getElementById('chat-container').appendChild(div);
        const cDiv = div.querySelector('.content');
        if (typeof content === 'string') { 
            if (content.includes('Thinking...')) div.insertAdjacentHTML('beforeend', content); 
            else { cDiv.innerHTML = marked.parse(cleanMath(content)); addCopyButtons(cDiv); } 
        } else { content.forEach(p => { 
            if (p.type === 'text') { cDiv.innerHTML += marked.parse(cleanMath(p.text)); addCopyButtons(cDiv); } 
            if (p.type === 'image_url') cDiv.innerHTML += `<img src="${p.image_url.url}" class="chat-img">`; 
        }); }
        document.getElementById('chat-container').scrollTop = 1e9;
        return div;
    }

    function addCopyButtons(container) {
        container.querySelectorAll('pre').forEach(pre => {
            if (pre.parentElement.classList.contains('code-wrapper')) return;
            const lang = pre.querySelector('code')?.className.replace('language-', '') || 'code';
            const wrapper = document.createElement('div'); wrapper.className = 'code-wrapper';
            const header = document.createElement('div'); header.className = 'code-header';
            header.innerHTML = `<span>${lang}</span><button class="copy-btn">Copy code</button>`;
            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(header); wrapper.appendChild(pre);
            const btn = header.querySelector('.copy-btn');
            btn.onclick = () => {
                navigator.clipboard.writeText(pre.innerText);
                btn.innerText = 'Copied!'; setTimeout(() => btn.innerText = 'Copy code', 2000);
            };
        });
        Prism.highlightAllUnder(container);
    }

    function handleFile(e) { if (e.target.files && e.target.files.length > 0) compressImage(e.target.files[0]); }
    document.getElementById('user-input').onpaste = (e) => { for (let i of e.clipboardData.items) if (i.type.indexOf("image") !== -1) compressImage(i.getAsFile()); };
    function compressImage(file) {
        const reader = new FileReader(); reader.onload = (event) => {
            const img = new Image(); img.onload = () => {
                const canvas = document.createElement('canvas'); const scale = Math.min(1, 450 / Math.max(img.width, img.height));
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                attachedImg = canvas.toDataURL('image/jpeg', 0.4);
                neuronStats.count += 500; updateGauge();
                const pb = document.getElementById('preview-bar'); pb.style.display = 'flex';
                pb.innerHTML = `<img src="${attachedImg}" class="p-img"><span onclick="clearImg()" style="color:red;cursor:pointer;margin-left:10px;font-weight:900;">✕</span>`;
            }; img.src = event.target.result;
        }; reader.readAsDataURL(file);
    }
    function renderList() {
        const l = document.getElementById('chat-list'); l.innerHTML = '';
        Object.keys(chats).sort().reverse().forEach(id => {
            const d = document.createElement('div'); d.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
            d.onclick = () => loadChat(id); d.innerHTML = `<span>${chats[id].title}</span><span class="chat-options" onclick="openChatOptions(event, '${id}')">⋮</span>`;
            l.appendChild(d);
        });
    }
    function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode'); document.getElementById('theme-btn').innerText = isDarkMode ? "DARK MODE" : "LIGHT MODE"; }
    function openChatOptions(e, id) { e.stopPropagation(); const a = prompt("'rename' or 'delete'?", "rename"); if (a === 'rename') { const t = prompt("Title?", chats[id].title); if (t) { chats[id].title = t; save(); renderList(); } } else if (a === 'delete') { delete chats[id]; save(); const r = Object.keys(chats); if (r.length) loadChat(r.pop()); else createNewChat(); } }
    function clearImg() { attachedImg = null; document.getElementById('preview-bar').style.display = 'none'; document.getElementById('file-in').value = ""; }
    const ui = document.getElementById('user-input');
    ui.oninput = () => { ui.style.height = 'auto'; ui.style.height = ui.scrollHeight + 'px'; };
    ui.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
</script>
</body>
</html>
