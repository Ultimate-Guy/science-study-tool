<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Puter.js (Verified) -->
<script src="https://js.puter.com/v2/"></script>

<!-- 2. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 3. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #050202; --glass: rgba(10, 5, 5, 0.9); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow: hidden; display: flex; }
        #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        #sidebar { width: 240px; background: var(--glass); backdrop-filter: blur(15px); border-right: 1px solid #150505; display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        .nav-item { padding: 12px; margin: 5px 0; border-radius: 5px; cursor: pointer; font-size: 11px; color: #444; border: 1px solid transparent; transition: 0.3s; letter-spacing: 1px; }
        .nav-item:hover { color: var(--p-red); border-color: var(--p-red); }
        #workspace { flex: 1; display: flex; position: relative; z-index: 5; overflow: hidden; }
        #chat-section { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #150505; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 10%; display: flex; flex-direction: column; scroll-behavior: smooth; }
        #pin-panel { width: 0; background: #080808; overflow-y: auto; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 0; border-left: 0px solid #150505; }
        #pin-panel.active { width: 45%; border-left-width: 1px; padding: 30px; }
        #pin-header { color: var(--p-red); font-size: 10px; letter-spacing: 2px; margin-bottom: 20px; font-weight: 800; display: flex; justify-content: space-between; }
        .message { width: 100%; margin-bottom: 40px; animation: msgIn 0.5s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px; }
        .user-label { color: var(--p-red); }
        .ai-label { color: #555; }
        .content { line-height: 1.8; font-size: 15px; color: #e0e0e0; }
        pre { background: #000 !important; border: 1px solid #222; padding: 15px; border-radius: 8px; position: relative; }
        .pin-btn { position: absolute; top: 10px; right: 10px; background: #111; color: #555; border: 1px solid #333; font-size: 9px; padding: 4px 8px; cursor: pointer; border-radius: 4px; z-index: 10; opacity: 0.6; transition: 0.2s; }
        .pin-btn:hover { opacity: 1; color: var(--p-red); border-color: var(--p-red); }
        #input-wrapper { padding: 20px 10% 40px 10%; background: linear-gradient(transparent, var(--bg)); }
        #input-container { background: #0a0808; border: 1px solid #211; border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; resize: none; font-family: inherit; }
        .send-btn { color: var(--p-red); cursor: pointer; font-size: 20px; transition: 0.2s; }
        .send-btn:hover { transform: scale(1.1); }
        .upload-btn { font-size: 18px; color: #333; cursor: pointer; transition: 0.2s; }
        .upload-btn:hover { color: var(--p-red); }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="sidebar">
    <div class="nav-item" style="color: #fff; border-color: #333;" onclick="clearSession()">NEW_SESSION</div>
    <div style="margin-top: auto; font-size: 9px; color: #150505;">PHOENIX_ARCHITECT_OS</div>
</div>

<div id="workspace">
    <div id="chat-section">
        <div id="chat-container"></div>
        <div id="input-wrapper">
            <div id="input-container">
                <div class="upload-btn" onclick="handleFileUpload()">⊕</div>
                <textarea id="user-input" placeholder="Request code or academic analysis..." rows="1" autofocus></textarea>
                <div class="send-btn" onclick="sendMessage()">➔</div>
            </div>
        </div>
    </div>

    <div id="pin-panel">
        <div id="pin-header">
            <span>REFERENCE_VIEW</span>
            <span style="cursor:pointer" onclick="closePin()">[ CLOSE ]</span>
        </div>
        <div id="pin-content"></div>
    </div>
</div>

<script>
    const input = document.getElementById('user-input');
    const container = document.getElementById('chat-container');
    const pinPanel = document.getElementById('pin-panel');
    const pinContent = document.getElementById('pin-content');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let history = [{ 
        role: "system", 
        content: "Your name is Phoenix AI. You are an elite academic assistant and senior engineer. Provide professional, structured answers." 
    }];

    // 1. PERSISTENCE: Load from cloud on start
    (async () => {
        const saved = await puter.kv.get('phoenix_history');
        if(saved) {
            history = JSON.parse(saved);
            history.slice(1).forEach(msg => appendMessage(msg.role, msg.content, false));
        }
    })();

    async function saveHistory() {
        await puter.kv.set('phoenix_history', JSON.stringify(history));
    }

    async function clearSession() {
        await puter.kv.del('phoenix_history');
        location.reload();
    }

    // 2. FILE UPLOAD: Puter Cloud Picker
    async function handleFileUpload() {
        const files = await puter.fs.upload();
        const file = files[0];
        const text = `Analyzing uploaded file: ${file.name}`;
        appendMessage('user', text);
        history.push({role: "user", content: text});
        sendMessage(true); // Trigger AI with file context
    }

    // Canvas Background logic...
    let particles = [];
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.onresize();
    class Particle {
        constructor(x,y) { this.x=x; this.y=y; this.size=Math.random()*1.2; this.sx=(Math.random()-0.5)*0.5; this.sy=(Math.random()-0.5)*0.5; }
        update() { this.x+=this.sx; this.y+=this.sy; if(this.size>0.1) this.size-=0.01; }
        draw() { ctx.fillStyle='rgba(255,26,26,0.15)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
    }
    window.addEventListener('mousemove', (e) => { for(let i=0; i<2; i++) particles.push(new Particle(e.x, e.y)); });
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p,i) => { p.update(); p.draw(); if(p.size<=0.1) particles.splice(i,1); });
        requestAnimationFrame(animate);
    }
    animate();

    input.addEventListener("keypress", (e) => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    async function sendMessage(isAuto = false) {
        const text = isAuto ? "Please analyze the file provided." : input.value.trim();
        if(!text && !isAuto) return;

        if(!isAuto) {
            appendMessage('user', text);
            history.push({role: "user", content: text});
            input.value = '';
        }

        const loading = appendMessage('ai', '...');
        try {
            const response = await puter.ai.chat(history, {model: 'gpt-4o'});
            const contentDiv = loading.querySelector('.content');
            contentDiv.innerHTML = '';
            
            let i = 0; const words = response.split(' ');
            function type() {
                if(i < words.length) {
                    contentDiv.innerHTML = marked.parse(words.slice(0, i + 1).join(' '));
                    i++; container.scrollTop = container.scrollHeight;
                    setTimeout(type, 10);
                } else {
                    // Highlight after typing completes
                    Prism.highlightAllUnder(contentDiv);
                    addPinButtons(contentDiv);
                    history.push({role: "assistant", content: response});
                    saveHistory();
                }
            }
            type();
        } catch(e) { loading.querySelector('.content').innerText = "SIGNAL_LOST: RE-AUTHENTICATE"; }
    }

    function appendMessage(role, text, shouldScroll = true) {
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<div class="label ${role}-label">>> ${role.toUpperCase()}</div><div class="content">${marked.parse(text)}</div>`;
        container.appendChild(div);
        if(shouldScroll) container.scrollTop = container.scrollHeight;
        if(!shouldScroll) Prism.highlightAllUnder(div);
        return div;
    }

    function addPinButtons(div) {
        div.querySelectorAll('pre').forEach(block => {
            const btn = document.createElement('button');
            btn.className = 'pin-btn'; btn.innerText = 'PIN_REFERENCE';
            btn.onclick = () => {
                pinContent.innerHTML = block.innerHTML;
                pinPanel.classList.add('active');
                Prism.highlightAllUnder(pinContent);
            };
            block.appendChild(btn);
        });
    }
    function closePin() { pinPanel.classList.remove('active'); }
</script>
</body>
</html>
