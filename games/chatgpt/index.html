<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 2. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #050202; --sidebar-bg: rgba(10, 5, 5, 0.95); --border: #150505; --text: #e0e0e0; --input-bg: #0a0808; --hover: #1a0a0a; }
        body.light-mode { --bg: #ffffff; --sidebar-bg: #f8f8f8; --border: #eee; --text: #111; --input-bg: #ffffff; --hover: #f0f0f0; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; display: flex; transition: 0.3s; }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        #sidebar { width: 260px; background: var(--sidebar-bg); backdrop-filter: blur(15px); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; z-index: 10; flex-shrink: 0; }
        
        #theme-btn { position: absolute; top: 20px; right: 20px; padding: 8px 15px; border: 1px solid var(--p-red); color: var(--p-red); font-size: 10px; font-weight: 800; cursor: pointer; border-radius: 5px; background: var(--sidebar-bg); z-index: 100; letter-spacing: 1px; }

        .new-chat-btn { padding: 12px; border: 1px solid var(--p-red); color: var(--p-red); text-align: center; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 800; margin-bottom: 20px; transition: 0.2s; }
        .new-chat-btn:hover { background: var(--p-red); color: #fff; }

        #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .chat-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: space-between; color: #888; transition: 0.2s; position: relative; }
        .chat-item:hover, .chat-item.active { background: var(--hover); color: var(--text); }
        .chat-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 10px; }
        .dots { opacity: 0; padding: 5px; cursor: pointer; font-size: 16px; line-height: 1; }
        .chat-item:hover .dots { opacity: 1; }

        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 5; height: 100%; width: 100%; }
        #chat-container { flex: 1; overflow-y: auto; padding: 40px 0; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; max-width: 850px; margin: 0 auto 40px auto; padding: 0 30px; box-sizing: border-box; animation: msgIn 0.3s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 12px; color: var(--p-red); letter-spacing: 2px; }
        .content { line-height: 1.8; font-size: 15px; }
        pre { background: #000 !important; border: 1px solid #222; padding: 20px; border-radius: 12px; overflow-x: auto; }

        #input-wrapper { padding: 20px 0 40px 0; background: linear-gradient(transparent, var(--bg) 30%); }
        #input-container { width: 90%; max-width: 850px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .ai-selector { background: transparent; border: 1px solid var(--p-red); color: var(--p-red); font-size: 10px; padding: 5px; border-radius: 4px; outline: none; cursor: pointer; text-transform: uppercase; font-weight: 800; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; resize: none; font-family: inherit; }

        .thinking-dots { display: flex; gap: 4px; padding: 10px 0; }
        .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--p-red); animation: bounce 1.4s infinite ease-in-out both; }
        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

        /* Pop-up Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: #0a0a0a; border: 1px solid var(--p-red); padding: 30px; border-radius: 15px; width: 350px; box-shadow: 0 0 50px rgba(255,26,26,0.1); }
        .modal h3 { margin-top: 0; font-size: 14px; letter-spacing: 2px; color: var(--p-red); }
        .modal input { width: 100%; background: #151515; border: 1px solid #333; padding: 12px; color: #fff; border-radius: 6px; margin: 15px 0; outline: none; box-sizing: border-box; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 15px; }
        .m-btn { cursor: pointer; font-size: 11px; font-weight: 800; padding: 8px 15px; border-radius: 4px; }
        .save-btn { background: var(--p-red); color: white; border: none; }
        
        #context-menu { position: absolute; background: #111; border: 1px solid #333; border-radius: 6px; display: none; z-index: 100; width: 120px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .menu-item { padding: 10px; font-size: 11px; cursor: pointer; color: #ccc; }
        .menu-item:hover { background: #222; color: var(--p-red); }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="theme-btn" onclick="toggleTheme()">DARK MODE</div>

<div id="sidebar">
    <div class="new-chat-btn" onclick="createNewChat()">+ NEW CHAT</div>
    <div id="chat-list"></div>
    <div style="margin-top: auto; font-size: 9px; color: #444; letter-spacing: 1px;">PHOENIX_ARCHITECT_OS</div>
</div>

<div id="chat-section">
    <div id="chat-container"></div>
    <div id="input-wrapper">
        <div id="input-container">
            <select id="model-select" class="ai-selector">
                <option value="llama">Meta Llama 3.3 70B</option>
                <option value="deepseek">DeepSeek R1</option>
                <option value="gemma">Google Gemma 3</option>
                <option value="flux">Black Forest Labs (Image Gen Only)</option>
            </select>
            <textarea id="user-input" placeholder="Message Phoenix..." rows="1" autofocus></textarea>
            <div style="color:var(--p-red); cursor:pointer; font-weight: 800;" onclick="sendMessage()">➔</div>
        </div>
    </div>
</div>

<!-- Rename Modal -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal">
        <h3>RENAME CHAT</h3>
        <input type="text" id="modal-input">
        <div class="modal-btns">
            <div class="m-btn" onclick="closeModal()">CANCEL</div>
            <div class="m-btn save-btn" onclick="confirmRename()">SAVE</div>
        </div>
    </div>
</div>

<!-- Three Dots Menu -->
<div id="context-menu">
    <div class="menu-item" onclick="openRenameModal()">Rename</div>
    <div class="menu-item" onclick="deleteChat()" style="color:#ff4444;">Delete</div>
</div>

<script>
    const WORKER_URL = "https://workers.dev";
    let chats = JSON.parse(localStorage.getItem('phoenix_chats') || '{}');
    let activeChatId = null, menuTargetId = null, isDarkMode = true;

    window.onload = () => {
        renderChatList();
        const ids = Object.keys(chats);
        if(ids.length) loadChat(ids.sort().pop());
        else createNewChat();
    };

    function toggleTheme() {
        isDarkMode = !isDarkMode; document.body.classList.toggle('light-mode');
        document.getElementById('theme-btn').innerText = isDarkMode ? "DARK MODE" : "LIGHT MODE";
        document.getElementById('prism-theme').href = isDarkMode ? "https://cloudflare.com" : "https://cloudflare.com";
    }

    function createNewChat() {
        activeChatId = Date.now().toString();
        chats[activeChatId] = { title: "New Session", history: [{ role: "system", content: "You are Phoenix AI. Respond in professional Markdown." }] };
        save(); renderChatList(); loadChat(activeChatId);
    }

    function loadChat(id) {
        activeChatId = id;
        document.getElementById('chat-container').innerHTML = '';
        chats[id].history.slice(1).forEach(m => appendMessage(m.role, m.content, false));
        renderChatList();
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input'), text = inputField.value.trim(), model = document.getElementById('model-select').value;
        if(!text) return;
        
        if(chats[activeChatId].history.length === 1) {
            chats[activeChatId].title = text.substring(0, 22) + "...";
            renderChatList();
        }

        appendMessage('user', text);
        chats[activeChatId].history.push({role: "user", content: text});
        inputField.value = '';
        if(model === 'flux') await generateImage(text);
        else await getAIResponse(model);
    }

    async function getAIResponse(model) {
        const messageDiv = appendMessage('ai', '<div class="thinking-dots"><span></span><span></span><span></span></div>');
        const contentDiv = messageDiv.querySelector('.content');
        let fullResponse = "";

        try {
            const response = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: chats[activeChatId].history, model: model }) });
            const reader = response.body.getReader(), decoder = new TextDecoder();
            contentDiv.innerHTML = ""; 

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const lines = decoder.decode(value).split("\n");
                for (const line of lines) {
                    if (line.trim().startsWith("data: ")) {
                        try {
                            const json = JSON.parse(line.replace("data: ", ""));
                            if (json.response) {
                                fullResponse += json.response;
                                contentDiv.innerHTML = marked.parse(fullResponse);
                                document.getElementById('chat-container').scrollTop = 1e9;
                            }
                        } catch (e) {}
                    }
                }
            }
            Prism.highlightAllUnder(contentDiv);
            chats[activeChatId].history.push({ role: "assistant", content: fullResponse });
            save();
        } catch(e) { contentDiv.innerText = "SIGNAL_LOST: Proxy Error."; }
    }

    async function generateImage(prompt) {
        const messageDiv = appendMessage('ai', '<div class="thinking-dots"><span></span><span></span><span></span></div>'), contentDiv = messageDiv.querySelector('.content');
        try {
            const res = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: [{content: prompt}], model: 'flux' }) });
            const data = await res.json();
            contentDiv.innerHTML = `<img src="${data.image}" style="width:100%; border-radius:12px; border:1px solid var(--p-red); margin-top:10px;">`;
            chats[activeChatId].history.push({ role: "assistant", content: `[Image Generated]` });
            save();
        } catch(e) { contentDiv.innerText = "Generation failed."; }
    }

    function appendMessage(role, text, anim = true) {
        const div = document.createElement('div'); div.className = 'message';
        div.innerHTML = `<div class="label">>> ${role.toUpperCase()}</div><div class="content">${text}</div>`;
        document.getElementById('chat-container').appendChild(div);
        if(role !== 'ai' || !text.includes('thinking-dots')) div.querySelector('.content').innerHTML = marked.parse(text);
        document.getElementById('chat-container').scrollTop = 1e9;
        return div;
    }

    function renderChatList() {
        const list = document.getElementById('chat-list'); list.innerHTML = '';
        Object.keys(chats).sort().reverse().forEach(id => {
            const div = document.createElement('div');
            div.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
            div.onclick = () => loadChat(id);
            div.innerHTML = `<span class="title">${chats[id].title}</span><span class="dots" onclick="showMenu(event, '${id}')">⋮</span>`;
            list.appendChild(div);
        });
    }

    function showMenu(e, id) { 
        e.stopPropagation(); 
        menuTargetId = id; 
        const menu = document.getElementById('context-menu'); 
        menu.style.display = 'block'; 
        menu.style.top = `${e.pageY}px`; 
        menu.style.left = `${e.pageX}px`; 
    }
    
    function openRenameModal() { document.getElementById('modal-overlay').style.display = 'flex'; document.getElementById('modal-input').value = chats[menuTargetId].title; document.getElementById('context-menu').style.display = 'none'; }
    function confirmRename() { chats[menuTargetId].title = document.getElementById('modal-input').value; save(); renderChatList(); closeModal(); }
    function deleteChat() { delete chats[menuTargetId]; save(); if(activeChatId === menuTargetId) createNewChat(); else renderChatList(); document.getElementById('context-menu').style.display = 'none'; }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function save() { localStorage.setItem('phoenix_chats', JSON.stringify(chats)); }
    window.onclick = () => document.getElementById('context-menu').style.display = 'none';

    // Particle Visuals
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'); let particles = [];
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }; window.onresize();
    class P { constructor(x,y) { this.x=x; this.y=y; this.size=Math.random()*1.5; this.sx=(Math.random()-0.5)*0.8; this.sy=(Math.random()-0.5)*0.8; } u() { this.x+=this.sx; this.y+=this.sy; if(this.size>0.1) this.size-=0.01; } d() { ctx.fillStyle = 'rgba(255,26,26,0.3)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,6.28); ctx.fill(); } }
    window.addEventListener('mousemove', e => { for(let i=0; i<3; i++) particles.push(new P(e.x, e.y)); });
    function animate() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p,i) => { p.u(); p.d(); if(p.size<=0.1) particles.splice(i,1); }); requestAnimationFrame(animate); }
    animate();
    document.getElementById('user-input').addEventListener("keypress", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
