<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>
    <script src="https://puter.com"></script>
    <style>
        :root {
            --sidebar-bg: #0f0a0a;
            --main-bg: #1a0f0f; /* Slight red tint to the dark background */
            --text-main: #ececec;
            --phoenix-red: #d32f2f;
            --input-bg: #2d1b1b;
            --border-color: #3d2626;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Sone', -apple-system, sans-serif; background: var(--main-bg); color: var(--text-main); display: flex; overflow: hidden; }

        /* Sidebar - Matches Left Nav in Image */
        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 1px solid var(--border-color);
        }

        .nav-item {
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover { background: #2d1b1b; }
        .new-chat { border: 1px solid var(--border-color); margin-bottom: 20px; }

        /* Main Chat Area */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header */
        #header {
            padding: 15px 20px;
            font-weight: 600;
            font-size: 18px;
            color: var(--phoenix-red);
            display: flex;
            align-items: center;
        }

        /* Message Display */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15%; /* Large margins like ChatGPT */
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .welcome-text {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-top: 15vh;
        }

        .message { max-width: 800px; margin: 0 auto; width: 100%; line-height: 1.6; }
        .user-msg { font-weight: 500; }
        .ai-msg { color: #d1d1d1; border-left: 2px solid var(--phoenix-red); padding-left: 20px; }

        /* The "Ask Anything" Box - Matches Image Exactly */
        #input-wrapper {
            padding: 20px 15% 40px 15%;
            background: linear-gradient(transparent, var(--main-bg) 20%);
        }

        #input-container {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 26px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            padding-left: 10px;
        }

        .icon-btn {
            color: #888;
            cursor: pointer;
            padding: 5px;
            font-size: 20px;
        }

        .icon-btn:hover { color: var(--phoenix-red); }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="nav-item new-chat"><span>+</span> New Chat</div>
    <div class="nav-item">Search History</div>
    <div class="nav-item">Settings</div>
    <div style="margin-top: auto;" class="nav-item">Phoenix AI Pro</div>
</div>

<div id="main-content">
    <div id="header">Phoenix AI 1.0</div>

    <div id="chat-container">
        <div id="welcome" class="welcome-text">What are you working on?</div>
    </div>

    <div id="input-wrapper">
        <div id="input-container">
            <span class="icon-btn">+</span>
            <input type="text" id="user-input" placeholder="Ask anything..." autocomplete="off">
            <span class="icon-btn" onclick="sendMessage()">➔</span>
        </div>
    </div>
</div>

<script>
    const inputField = document.getElementById('user-input');
    const container = document.getElementById('chat-container');
    const welcome = document.getElementById('welcome');

    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    async function sendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        // Clean up UI on first message
        if(welcome) welcome.style.display = 'none';

        // Append User Message
        appendMessage('user-msg', `<b>You:</b><br>${text}`);
        inputField.value = '';

        // Typing indicator
        const loading = appendMessage('ai-msg', '<i>Phoenix is thinking...</i>');

        try {
            // Using Puter.js for the AI logic
            const response = await puter.ai.chat(text, { model: 'gpt-4o' });
            loading.innerHTML = `<b>Phoenix AI:</b><br>${response.replace(/\n/g, '<br>')}`;
        } catch (e) {
            loading.innerHTML = "Connection error. Please try again.";
        }
        container.scrollTop = container.scrollHeight;
    }

    function appendMessage(className, content) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = content;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }
</script>

</body>
</html>
