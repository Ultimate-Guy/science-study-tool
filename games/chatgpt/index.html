<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 2. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #fff; --sidebar-bg: #f9f9f9; --border: #e5e5e5; --text: #000; --input-bg: #f4f4f4; --bubble-user: #f4f4f4; --code-bg: #222222; }
        body.dark-mode { --bg: #0d0d0d; --sidebar-bg: #000; --border: #262626; --text: #ececec; --input-bg: #171717; --bubble-user: #212121; --code-bg: #111111; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; }
        #app-container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 200; }
        .chat-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 13px; margin-bottom: 4px; color: var(--text); }
        .chat-item.active { background: rgba(255,26,26,0.08); font-weight: 700; color: var(--p-red); }
        #neuron-gauge-container { margin-top: auto; padding: 15px; background: rgba(255, 26, 26, 0.05); border-radius: 12px; border: 1px solid rgba(255, 26, 26, 0.1); }
        .gauge-bar-fill { height: 6px; width: 0%; background: var(--p-red); border-radius: 3px; transition: 0.5s; margin: 8px 0; }
        .landing-view #sidebar { transform: translateX(-100%); width: 0; padding: 0; visibility: hidden; }
        #landing-header { display: none; text-align: center; margin-bottom: 40px; }
        .landing-view #landing-header { display: block; }
        .landing-view #chat-container { display: none; }
        .landing-view #input-wrapper { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        #chat-header-brand { position: absolute; top: 20px; left: 30px; font-size: 14px; font-weight: 900; color: var(--p-red); }
        #chat-container { flex: 1; overflow-y: auto; padding: 80px 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; max-width: 800px; margin: 0 auto 24px auto; display: flex; flex-direction: column; }
        .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; padding: 0 12px; }
        .model-badge { font-size: 8px; font-weight: 900; background: rgba(0,0,0,0.05); color: #888; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-left: 8px; }
        .message .content { padding: 16px 20px; border-radius: 18px; line-height: 1.6; border: 1px solid var(--border); font-size: 16px; }
        .message.user .content { background: var(--bubble-user); align-self: flex-end; }
        .code-wrapper { margin: 15px 0; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
        .code-header { display: flex; justify-content: space-between; padding: 8px 16px; background: rgba(255,255,255,0.05); font-size: 11px; color: #b4b4b4; }
        .line-numbers { padding: 16px 12px; color: #666; font-family: monospace; font-size: 13px; text-align: right; background: rgba(0,0,0,0.1); min-width: 40px; }
        #input-container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 20px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
        textarea { flex: 1; background: transparent; border: none; font-size: 16px; outline: none; resize: none; max-height: 250px; color: var(--text); }
        .thinking-txt { font-size: 14px; opacity: 0.6; padding: 10px 0; animation: pulse 1.5s infinite; color: var(--p-red); font-weight: 900; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="light-mode">
<div id="theme-btn" style="position:absolute; top:20px; right:30px; cursor:pointer; font-size:10px; font-weight:700" onclick="toggleTheme()">LIGHT MODE</div>
<div id="app-container" class="landing-view">
    <div id="sidebar">
        <div class="sidebar-btn" style="padding:12px; border:1px solid var(--p-red); color:var(--p-red); text-align:center; border-radius:10px; cursor:pointer; font-size:11px; font-weight:800; margin-bottom:8px" onclick="createNewChat()">+ NEW CHAT</div>
        <div class="sidebar-btn" style="padding:12px; border:1px solid #555; color:#555; text-align:center; border-radius:10px; cursor:pointer; font-size:11px; font-weight:800; margin-bottom:8px" onclick="clearHistory()">CLEAR HISTORY</div>
        <div id="chat-list" style="flex:1; overflow-y:auto"></div>
        <div id="neuron-gauge-container">
            <div class="gauge-header"><span>Neurons</span><span id="neuron-value">0 / 10k</span></div>
            <div style="background:rgba(0,0,0,0.1); border-radius:3px"><div id="gauge-fill" class="gauge-bar-fill"></div></div>
            <div id="reset-clock" style="font-size:9px; opacity:0.5; text-align:center">Reset in: --:--</div>
        </div>
    </div>
    <div id="chat-section">
        <div id="chat-header-brand">PHOENIX AI</div>
        <div id="chat-container"></div>
        <div id="input-wrapper" style="padding:20px; width:100%">
            <div id="landing-header"><h1>Where should we begin?</h1></div>
            <div id="preview-bar" style="display:none; padding:10px; gap:10px; max-width:800px; margin:0 auto; align-items:center;"></div>
            <div id="input-container">
                <div style="cursor:pointer; font-size:22px" onclick="document.getElementById('file-in').click()">+</div>
                <input type="file" id="file-in" hidden onchange="handleFile(event)">
                <select id="model-select" style="background:transparent; border:none; color:var(--p-red); font-size:10px; font-weight:900; outline:none; text-transform:uppercase; cursor:pointer">
                    <option value="gpt-oss" selected>GPT-OSS 20B (Groq)</option>
                    <option value="llama-versatile">Llama 3 8B Versatile</option>
                    <option value="llama-instant">Llama 3 8B Instant</option>
                    <option value="llama">Llama 3.2 Vision</option>
                    <option value="glm">GLM-4.7 Flash</option>
                    <option value="kimi">Kimi-K2.5</option>
                    <option value="gemma">Gemma 4</option>
                </select>
                <textarea id="user-input" placeholder="Message Phoenix..." rows="1"></textarea>
                <div id="send-btn" style="color:var(--p-red); cursor:pointer; font-size:24px; font-weight:900" onclick="sendMessage()">➔</div>
            </div>
        </div>
    </div>
</div>
<script>
    const WORKER_URL = "https://phoenix-ai-proxy.prabhavd75.workers.dev/";
    let chats = JSON.parse(localStorage.getItem('phoenix_chats') || '{}'), activeChatId = null, attachedImg = null;
    let neuronStats = JSON.parse(localStorage.getItem('phoenix_neurons') || '{"count":0, "day":' + new Date().getUTCDate() + '}');

    function updateGauge() {
        const p = Math.min((neuronStats.count / 10000) * 100, 100);
        document.getElementById('gauge-fill').style.width = p + '%';
        document.getElementById('neuron-value').innerText = `${Math.round(neuronStats.count)} / 10k`;
        localStorage.setItem('phoenix_neurons', JSON.stringify(neuronStats));
    }

    function updateClock() {
        const now = new Date(), reset = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1, 0, 0, 0));
        const diff = reset - now;
        document.getElementById('reset-clock').innerText = `Reset in: ${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}m`;
    }

    function sendMessage() {
        const f = document.getElementById('user-input'), text = f.value.trim();
        if(!text && !attachedImg) return;
        document.getElementById('app-container').classList.remove('landing-view');
        let content = attachedImg ? [{ type: "text", text: text || "Analyze" }, { type: "image_url", image_url: { url: attachedImg } }] : text;
        appendMessage('user', content, null, chats[activeChatId].history.length);
        chats[activeChatId].history.push({ role: "user", content: content });
        if (chats[activeChatId].title === "New Session") { chats[activeChatId].title = text.substring(0, 25); renderList(); }
        f.value = ''; f.style.height = 'auto'; clearImg(); getAIResponse(document.getElementById('model-select').value);
    }

    async function getAIResponse(model) {
        const idx = chats[activeChatId].history.length;
        const div = appendMessage('ai', '<div id="think" class="thinking-txt">Thinking...</div>', model, idx);
        const contentDiv = div.querySelector('.content');
        let full = "", firstWord = true, seconds = 0;
        const timer = setInterval(() => { seconds++; const t = div.querySelector('#think'); if(t && seconds === 10) t.innerText = "One moment..."; }, 1000);
        try {
            const res = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: chats[activeChatId].history, model }) });
            const reader = res.body.getReader(), decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read(); if (done) break;
                const chunk = decoder.decode(value);
                if (firstWord && chunk.trim()) { clearInterval(timer); div.querySelector('#think')?.remove(); firstWord = false; }
                full += chunk;
                if (!['gpt-oss', 'llama-versatile', 'llama-instant'].includes(model)) { neuronStats.count += (chunk.length * 0.45); updateGauge(); }
                contentDiv.innerHTML = marked.parse(full.replace(/\$/g, ''));
                addCodeFeatures(contentDiv); document.getElementById('chat-container').scrollTop = 1e9;
            }
            chats[activeChatId].history.push({ role: "assistant", content: full, modelUsed: model }); save();
        } catch(e) { clearInterval(timer); contentDiv.innerHTML = "System Busy. Please retry."; }
    }

    function addCodeFeatures(container) {
        container.querySelectorAll('pre').forEach(pre => {
            if (pre.parentElement.classList.contains('code-body')) return;
            const wrapper = document.createElement('div'); wrapper.className = 'code-wrapper';
            const header = document.createElement('div'); header.className = 'code-header';
            header.innerHTML = `<span>Code</span><span onclick="navigator.clipboard.writeText(this.closest('.code-wrapper').querySelector('pre').innerText); this.innerText='COPIED'" style="cursor:pointer">Copy</span>`;
            const body = document.createElement('div'); body.className = 'code-body';
            const nums = document.createElement('div'); nums.className = 'line-numbers';
            pre.parentNode.insertBefore(wrapper, pre); wrapper.appendChild(header); wrapper.appendChild(body); body.appendChild(nums); body.appendChild(pre);
            nums.innerHTML = Array.from({length: pre.innerText.split('\n').length}, (_, i) => i + 1).join('<br>');
        }); Prism.highlightAllUnder(container);
    }

    function appendMessage(role, content, model, historyIdx) {
        const div = document.createElement('div'); div.className = `message ${role}`;
        let badge = (role === 'ai' && model) ? `<span class="model-badge">${model.toUpperCase()}</span>` : '';
        div.innerHTML = `<div class="label-row"><div><span style="font-size:9px;font-weight:900;color:var(--p-red)">${role.toUpperCase()}</span>${badge}</div>
            <div style="opacity:0; transition:0.2s" class="msg-actions"><span onclick="navigator.clipboard.writeText(this.closest('.message').querySelector('.content').innerText)" style="cursor:pointer;font-size:10px;margin-right:10px">COPY</span><span onclick="chats['${activeChatId}'].history.splice(${historyIdx}, 1); save(); loadChat('${activeChatId}')" style="cursor:pointer;font-size:10px">✕</span></div></div><div class="content"></div>`;
        document.getElementById('chat-container').appendChild(div);
        const cDiv = div.querySelector('.content');
        if (typeof content === 'string') cDiv.innerHTML = marked.parse(content);
        else content.forEach(p => { if (p.type === 'text') cDiv.innerHTML += marked.parse(p.text); if (p.type === 'image_url') cDiv.innerHTML += `<img src="${p.image_url.url}" style="max-width:100%; border-radius:12px; margin-top:10px">`; });
        return div;
    }

    document.getElementById('user-input').onpaste = (e) => {
        const items = e.clipboardData.items;
        for (const item of items) if (item.type.indexOf("image") !== -1) compressImage(item.getAsFile());
    };

    function handleFile(e) { if (e.target.files.length) compressImage(e.target.files[0]); }

    function compressImage(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, 600 / Math.max(img.width, img.height));
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                attachedImg = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('preview-bar').style.display = 'flex';
                document.getElementById('preview-bar').innerHTML = `<img src="${attachedImg}" style="height:60px; border-radius:8px"><span onclick="clearImg()" style="color:red;cursor:pointer;margin-left:10px">✕</span>`;
            }; img.src = ev.target.result;
        }; reader.readAsDataURL(file);
    }

    function createNewChat() { activeChatId = Date.now().toString(); chats[activeChatId] = { title: "New Session", history: [{ role: "system", content: "Phoenix" }] }; save(); loadChat(activeChatId); }
    function loadChat(id) { activeChatId = id; document.getElementById('chat-container').innerHTML = ''; if (chats[id].history.length <= 1) document.getElementById('app-container').classList.add('landing-view'); else { document.getElementById('app-container').classList.remove('landing-view'); chats[id].history.slice(1).forEach((m, i) => appendMessage(m.role, m.content, m.modelUsed, i+1)); } renderList(); }
    function save() { localStorage.setItem('phoenix_chats', JSON.stringify(chats)); }
    function renderList() { 
        const l = document.getElementById('chat-list'); l.innerHTML = ''; 
        Object.keys(chats).reverse().forEach(id => { 
            const d = document.createElement('div'); d.className = `chat-item ${id === activeChatId ? 'active' : ''}`; 
            d.onclick = () => loadChat(id); 
            d.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${chats[id].title}</span><span onclick="event.stopPropagation();if(confirm('Delete?')){delete chats['${id}'];save();location.reload()}">⋮</span>`;
            l.appendChild(d); 
        }); 
    }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); document.getElementById('theme-btn').innerText = document.body.classList.contains('dark-mode') ? "LIGHT MODE" : "DARK MODE"; }
    function clearImg() { attachedImg = null; document.getElementById('preview-bar').style.display = 'none'; }
    function clearHistory() { if (confirm("Clear?")) { chats[activeChatId].history = [chats[activeChatId].history[0]]; save(); loadChat(activeChatId); } }
    
    document.getElementById('user-input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    document.getElementById('user-input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    window.onload = () => { updateGauge(); updateClock(); renderList(); const ids = Object.keys(chats); if(ids.length) loadChat(ids.sort().pop()); else createNewChat(); };
    setInterval(updateClock, 1000);
</script>
</body>
</html>
