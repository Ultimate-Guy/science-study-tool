<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Puter.js (Verified) -->
<script src="https://js.puter.com/v2/"></script>

<!-- 2. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 3. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #050202; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow: hidden; display: flex; }
        #canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        #sidebar { width: 240px; background: rgba(10, 5, 5, 0.9); backdrop-filter: blur(15px); border-right: 1px solid #150505; display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        .nav-item { padding: 12px; margin: 5px 0; border-radius: 5px; cursor: pointer; font-size: 11px; color: #444; border: 1px solid transparent; transition: 0.3s; letter-spacing: 1px; }
        .nav-item:hover { color: var(--p-red); border-color: var(--p-red); }
        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 5; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; margin-bottom: 40px; animation: msgIn 0.5s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px; }
        .user-label { color: var(--p-red); }
        .ai-label { color: #555; }
        .content { line-height: 1.8; font-size: 15px; color: #e0e0e0; }
        pre { background: #000 !important; border: 1px solid #222; padding: 15px; border-radius: 8px; }
        #input-wrapper { padding: 20px 15% 40px 15%; background: linear-gradient(transparent, var(--bg)); }
        #input-container { background: #0a0808; border: 1px solid #211; border-radius: 8px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; resize: none; font-family: inherit; }
        .btn { color: var(--p-red); cursor: pointer; transition: 0.2s; font-size: 18px; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="sidebar">
    <div class="nav-item" style="color: #fff; border-color: #333;" onclick="clearSession()">NEW_SESSION</div>
    <div style="margin-top: auto; font-size: 9px; color: #150505;">PHOENIX_ARCHITECT_OS</div>
</div>

<div id="chat-section">
    <div id="chat-container"></div>
    <div id="input-wrapper">
        <div id="input-container">
            <div class="btn" onclick="handleFileUpload()">⊕</div>
            <textarea id="user-input" placeholder="Request analysis..." rows="1" autofocus></textarea>
            <div class="btn" onclick="sendMessage()">➔</div>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('user-input');
    const container = document.getElementById('chat-container');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let history = [{ role: "system", content: "You are Phoenix AI, an elite engineer. Be concise." }];

    // Persistence & Init
    (async () => {
        const saved = await puter.kv.get('phoenix_chat');
        if(saved) {
            history = JSON.parse(saved);
            history.slice(1).forEach(m => appendMessage(m.role, m.content));
        }
    })();

    async function handleFileUpload() {
        const file = await puter.fs.upload();
        const msg = `Analyzing file: ${file.name}`;
        appendMessage('user', msg);
        history.push({role: "user", content: msg});
        await getAIResponse();
    }

    async function sendMessage() {
        const text = input.value.trim();
        if(!text) return;
        appendMessage('user', text);
        history.push({role: "user", content: text});
        input.value = '';
        await getAIResponse();
    }

    async function getAIResponse() {
        const loading = appendMessage('ai', '...');
        const contentDiv = loading.querySelector('.content');
        
        try {
            // FIXED: Using string response to avoid "3 dots" streaming hang
            const response = await puter.ai.chat(history, {model: 'gpt-4o'});
            contentDiv.innerHTML = marked.parse(response);
            Prism.highlightAllUnder(contentDiv);
            history.push({role: "assistant", content: response});
            await puter.kv.set('phoenix_chat', JSON.stringify(history));
        } catch(e) {
            contentDiv.innerText = "SIGNAL_LOST: RE-AUTHENTICATE";
        }
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<div class="label ${role}-label">>> ${role.toUpperCase()}</div><div class="content">${marked.parse(text)}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function clearSession() { puter.kv.del('phoenix_chat'); location.reload(); }

    // Particle Background
    let particles = [];
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.onresize();
    class P {
        constructor(x,y) { this.x=x; this.y=y; this.size=Math.random()*1.2; this.sx=(Math.random()-0.5)*0.5; this.sy=(Math.random()-0.5)*0.5; }
        u() { this.x+=this.sx; this.y+=this.sy; if(this.size>0.1) this.size-=0.01; }
        d() { ctx.fillStyle='rgba(255,26,26,0.1)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,6.28); ctx.fill(); }
    }
    window.addEventListener('mousemove', e => { for(let i=0; i<2; i++) particles.push(new P(e.x, e.y)); });
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p,i) => { p.u(); p.d(); if(p.size<=0.1) particles.splice(i,1); });
        requestAnimationFrame(animate);
    }
    animate();
    input.addEventListener("keypress", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
