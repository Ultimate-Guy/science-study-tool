<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 2. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 3. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #050202; --sidebar-bg: rgba(10, 5, 5, 0.9); --border: #150505; --text: #e0e0e0; --input-bg: #0a0808; --label-ai: #555; }
        body.light-mode { --bg: #fdfdfd; --sidebar-bg: rgba(245, 245, 245, 0.9); --border: #eee; --text: #111; --input-bg: #ffffff; --label-ai: #bbb; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; display: flex; }
        
        /* FIX 1: Ensure Canvas stays behind everything */
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        
        #sidebar { width: 240px; background: var(--sidebar-bg); backdrop-filter: blur(15px); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 10; flex-shrink: 0; }
        
        /* FIX 2: Full-Width Chat Section */
        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 5; background: transparent; width: 100%; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 40px 10%; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; max-width: 900px; margin: 0 auto 40px auto; animation: msgIn 0.4s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(5px); } }
        .label { font-size: 10px; font-weight: 800; margin-bottom: 12px; letter-spacing: 2px; }
        .user-label { color: var(--p-red); }
        .ai-label { color: var(--label-ai); }
        .content { line-height: 1.8; font-size: 15px; }
        pre { background: #000 !important; border: 1px solid #222; padding: 18px; border-radius: 8px; overflow-x: auto; }
        body.light-mode pre { background: #f8f8f8 !important; border-color: #eee; }
        
        #input-wrapper { padding: 20px 10% 40px 10%; background: linear-gradient(transparent, var(--bg) 20%); }
        #input-container { max-width: 900px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; outline: none; resize: none; font-family: inherit; max-height: 200px; }
        .btn { color: var(--p-red); cursor: pointer; font-size: 20px; transition: 0.2s; }
        .btn:hover { transform: scale(1.1); }
        .nav-item { padding: 12px; margin: 5px 0; border-radius: 5px; cursor: pointer; font-size: 10px; color: #888; border: 1px solid transparent; transition: 0.3s; letter-spacing: 1px; font-weight: 600; }
        .nav-item:hover { color: var(--p-red); border-color: var(--p-red); }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="sidebar">
    <div class="nav-item" style="color: var(--text); border-color: var(--border);" onclick="clearSession()">NEW_SESSION</div>
    <div class="nav-item" id="theme-toggle" onclick="toggleTheme()">MODE: DARK</div>
    <div style="margin-top: auto; font-size: 9px; color: #888; letter-spacing: 1px; opacity: 0.5;">PHOENIX_ARCHITECT_OS</div>
</div>

<div id="chat-section">
    <div id="chat-container"></div>
    <div id="input-wrapper">
        <div id="input-container">
            <textarea id="user-input" placeholder="Ask Phoenix AI..." rows="1" autofocus></textarea>
            <div class="btn" onclick="sendMessage()">➔</div>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('user-input');
    const container = document.getElementById('chat-container');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const WORKER_URL = "https://workers.dev"; 

    let history = [{ role: "system", content: "You are Phoenix AI. Respond in professional Markdown." }];
    let isDarkMode = true;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('light-mode');
        document.getElementById('theme-toggle').innerText = isDarkMode ? "MODE: DARK" : "MODE: LIGHT";
        const prismLink = document.getElementById('prism-theme');
        prismLink.href = isDarkMode ? "https://cloudflare.com" : "https://cloudflare.com";
    }

    (function init() {
        const saved = localStorage.getItem('phoenix_history');
        if(saved) {
            history = JSON.parse(saved);
            history.slice(1).forEach(m => appendMessage(m.role, m.content, false));
        }
    })();

    async function sendMessage() {
        const text = input.value.trim();
        if(!text) return;
        appendMessage('user', text);
        history.push({role: "user", content: text});
        input.value = '';
        await getAIResponse();
    }

    async function getAIResponse() {
        const messageDiv = appendMessage('ai', '...');
        const contentDiv = messageDiv.querySelector('.content');
        let fullResponse = "";

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: history })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            contentDiv.innerHTML = ""; 

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split("\n");

                for (const line of lines) {
                    if (line.trim().startsWith("data: ")) {
                        const dataStr = line.replace("data: ", "").trim();
                        if (dataStr === "[DONE]") break;
                        try {
                            const json = JSON.parse(dataStr);
                            // FIX 3: Handling GPT-5.4 Thinking + Content Deltas
                            const delta = json.choices[0].delta;
                            const content = delta.reasoning_content || delta.content || "";
                            
                            fullResponse += content;
                            contentDiv.innerHTML = marked.parse(fullResponse);
                            container.scrollTop = container.scrollHeight;
                        } catch (e) {}
                    }
                }
            }
            Prism.highlightAllUnder(contentDiv);
            history.push({ role: "assistant", content: fullResponse });
            localStorage.setItem('phoenix_history', JSON.stringify(history));
        } catch(e) {
            contentDiv.innerText = "SIGNAL_LOST: Proxy Error.";
        }
    }

    function appendMessage(role, text, anim = true) {
        const div = document.createElement('div');
        div.className = 'message';
        if(!anim) div.style.animation = 'none';
        div.innerHTML = `<div class="label ${role}-label">>> ${role.toUpperCase()}</div><div class="content">${marked.parse(text)}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function clearSession() { localStorage.removeItem('phoenix_history'); location.reload(); }

    let particles = [];
    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.onresize();
    class P {
        constructor(x,y) { this.x=x; this.y=y; this.size=Math.random()*1.5; this.sx=(Math.random()-0.5)*0.8; this.sy=(Math.random()-0.5)*0.8; }
        u() { this.x+=this.sx; this.y+=this.sy; if(this.size>0.1) this.size-=0.01; }
        d() { ctx.fillStyle = isDarkMode ? 'rgba(255,26,26,0.25)' : 'rgba(255,26,26,0.45)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,6.28); ctx.fill(); }
    }
    window.addEventListener('mousemove', e => { for(let i=0; i<3; i++) particles.push(new P(e.x, e.y)); });
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p,i) => { p.u(); p.d(); if(p.size<=0.1) particles.splice(i,1); });
        requestAnimationFrame(animate);
    }
    animate();
    input.addEventListener("keypress", e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
</script>
</body>
</html>
