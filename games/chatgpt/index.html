<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <!-- 1. Include Puter.js library -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .ai { background: #e9e9eb; color: #333; }
        #input-area { display: flex; padding: 20px; background: white; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="msg ai">Hello! How can I help you with your studies today?</div>
</div>

<div id="input-area">
    <input type="text" id="user-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        const text = input.value.trim();
        
        if (!text) return;

        // Add user message to UI
        container.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';
        container.scrollTop = container.scrollHeight;

        try {
            // 2. Call the AI directly
            // Models available: 'gpt-4o', 'gpt-3.5-turbo', 'claude-3-5-sonnet'
            const response = await puter.ai.chat(text, { model: 'gpt-4o' });

            // Add AI response to UI
            container.innerHTML += `<div class="msg ai">${response}</div>`;
            container.scrollTop = container.scrollHeight;
        } catch (error) {
            console.error(error);
            container.innerHTML += `<div class="msg ai" style="color:red;">Error: AI is currently unavailable.</div>`;
        }
    }
</script>

</body>
</html>
