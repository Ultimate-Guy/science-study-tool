<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI</title>

<!-- 1. Marked.js (Verified) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>

<!-- 2. FIXED PRISM LINKS -->
<!-- Core Theme (Tomorrow Night) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<!-- Core Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<!-- Language Components -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <style>
        :root { --p-red: #ff1a1a; --bg: #ffffff; --sidebar-bg: #f9f9f9; --border: #eee; --text: #111; --input-bg: #f0f0f0; --bubble-ai: #f5f5f5; --bubble-user: #eeeeee; }
        body.dark-mode { --bg: #050202; --sidebar-bg: #0a0a0a; --border: #1a1a1a; --text: #e0e0e0; --input-bg: #0d0d0d; --bubble-ai: #121212; --bubble-user: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
        
        #app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        #sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 200; }
        .sidebar-header { font-size: 10px; font-weight: 800; color: #888; margin: 20px 0 10px 10px; letter-spacing: 1px; text-transform: uppercase; }

        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; height: 100%; }
        
        /* Header Brand - Top Left */
        #chat-header-brand { position: absolute; top: 20px; left: 30px; font-size: 14px; font-weight: 900; color: var(--p-red); letter-spacing: 2px; z-index: 100; transition: 0.3s; }
        #theme-btn { position: absolute; top: 20px; right: 30px; padding: 8px 12px; border: 1px solid var(--border); font-size: 10px; cursor: pointer; border-radius: 6px; z-index: 100; background: var(--bg); color: var(--text); font-weight: 700; }
        
        /* Landing View States */
        #landing-header { display: none; text-align: center; margin-bottom: 40px; animation: fadeIn 0.8s ease; width: 90%; }
        #landing-header h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 700; color: var(--text); }

        .landing-view #sidebar { transform: translateX(-100%); width: 0; padding: 0; opacity: 0; visibility: hidden; }
        .landing-view #chat-header-brand { left: 20px; }
        .landing-view #landing-header { display: block; }
        .landing-view #chat-container { display: none; }
        .landing-view #input-wrapper { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-bottom: 10vh; }
        
        /* Chat & Bubbles */
        #chat-container { flex: 1; overflow-y: auto; padding: 80px 20px 40px 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message { width: 100%; max-width: 800px; margin: 0 auto 24px auto; display: flex; flex-direction: column; }
        .message .label { font-size: 9px; font-weight: 900; margin-bottom: 6px; color: var(--p-red); letter-spacing: 1px; padding-left: 12px; }
        .message .content { padding: 16px 20px; border-radius: 18px; line-height: 1.6; font-size: 15px; border: 1px solid var(--border); }
        
        .message.user { align-self: flex-end; }
        .message.user .content { background: var(--bubble-user); border-bottom-right-radius: 4px; }
        .message.ai .content { background: var(--bubble-ai); border-bottom-left-radius: 4px; }

        .chat-img { max-width: 100%; max-height: 400px; border-radius: 12px; margin-top: 10px; display: block; }
        
        /* Input */
        #input-wrapper { width: 100%; padding: 20px; transition: all 0.5s ease; }
        #input-container { width: 100%; max-width: 800px; margin: 0 auto; background: var(--input-bg); border: 1px solid var(--border); border-radius: 20px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .plus-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: var(--text); background: rgba(0,0,0,0.05); border-radius: 50%; cursor: pointer; font-size: 22px; border: 1px solid var(--border); }
        textarea { flex: 1; background: transparent; border: none; color: var(--text); font-size: 16px; outline: none; resize: none; max-height: 150px; padding: 10px 0; line-height: 1.5; }
        .ai-selector { background: transparent; border: none; color: var(--p-red); font-size: 10px; font-weight: 900; cursor: pointer; outline: none; text-transform: uppercase; }
        
        .new-chat-btn { padding: 14px; border: 1px solid var(--p-red); color: var(--p-red); text-align: center; border-radius: 10px; cursor: pointer; font-size: 11px; font-weight: 800; margin-bottom: 10px; }
        .chat-item { padding: 12px; border-radius: 10px; cursor: pointer; font-size: 13px; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .chat-item.active { background: rgba(255,26,26,0.06); color: var(--text); border: 1px solid rgba(255,26,26,0.1); }
        
        @media (max-width: 768px) {
            #sidebar { position: absolute; left: 0; height: 100%; width: 280px; }
            #chat-header-brand { font-size: 12px; left: 15px; top: 15px; }
            #theme-btn { right: 15px; top: 15px; }
        }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.98); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .thinking-txt { font-size: 11px; color: var(--p-red); font-weight: 900; letter-spacing: 1px; animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="light-mode"> <!-- Defaulted to light-mode -->
<div id="theme-btn" onclick="toggleTheme()">LIGHT MODE</div>
<div id="app-container" class="landing-view">
    <div id="sidebar">
        <div class="new-chat-btn" onclick="createNewChat()">+ NEW CHAT</div>
        <div class="sidebar-header">Recent</div>
        <div id="chat-list"></div>
        <div style="margin-top:auto; font-size:9px; opacity:0.3; padding-left: 10px;">PHOENIX_ARCHITECT_OS</div>
    </div>
    <div id="chat-section">
        <div id="chat-header-brand">PHOENIX AI</div>
        <div id="chat-container"></div>
        <div id="input-wrapper">
            <div id="landing-header"><h1>Where should we begin?</h1></div>
            <div id="preview-bar"></div>
            <div id="input-container">
                <div class="plus-btn" onclick="document.getElementById('file-in').click()">+</div>
                <input type="file" id="file-in" hidden accept="image/*" onchange="handleFile(event)">
                <select id="model-select" class="ai-selector">
                    <option value="glm">GLM-4.7</option>
                    <option value="kimi">Kimi-K2</option>
                    <option value="gemma">Gemma 4</option>
                    <option value="flux">Flux-2</option>
                </select>
                <textarea id="user-input" placeholder="Message Phoenix..." rows="1"></textarea>
                <div style="color:var(--p-red); cursor:pointer; font-weight:900; font-size:24px;" onclick="sendMessage()">➔</div>
            </div>
        </div>
    </div>
</div>
<script>
    const WORKER_URL = "https://phoenix-ai-proxy.prabhavd75.workers.dev/";
    // isDarkMode starts false for Light Mode default
    let chats = JSON.parse(localStorage.getItem('phoenix_chats') || '{}'), activeChatId = null, attachedImg = null, isDarkMode = false;
    
    function cleanMath(t) { return t.replace(/\$/g, ''); }
    window.onload = () => { renderList(); const ids = Object.keys(chats); if(ids.length) loadChat(ids.sort().pop()); else createNewChat(); };
    function save() { localStorage.setItem('phoenix_chats', JSON.stringify(chats)); }
    
    function createNewChat() { 
        activeChatId = Date.now().toString(); 
        chats[activeChatId] = { title: "New Session", history: [{ role: "system", content: "You are Phoenix AI. Never use dollar signs." }] }; 
        save(); renderList(); loadChat(activeChatId); 
    }
    
    function loadChat(id) { 
        activeChatId = id; 
        const app = document.getElementById('app-container');
        document.getElementById('chat-container').innerHTML = '';
        if (chats[id].history.length <= 1) app.classList.add('landing-view');
        else { app.classList.remove('landing-view'); chats[id].history.slice(1).forEach(m => appendMessage(m.role, m.content)); }
        renderList(); 
    }

    async function sendMessage() {
        const f = document.getElementById('user-input'), text = f.value.trim();
        if(!text && !attachedImg) return;
        document.getElementById('app-container').classList.remove('landing-view');
        let content = attachedImg ? [{ type: "text", text: text || "Analyze this image." }, { type: "image_url", image_url: { url: attachedImg } }] : text;
        appendMessage('user', content);
        chats[activeChatId].history.push({ role: "user", content: content });
        if (chats[activeChatId].title === "New Session") chats[activeChatId].title = (text || "Image Query").substring(0, 24);
        f.value = ''; clearImg();
        await getAIResponse(document.getElementById('model-select').value);
    }

    async function getAIResponse(model) {
        const div = appendMessage('ai', '<div class="thinking-txt">Thinking...</div>');
        const contentDiv = div.querySelector('.content');
        const cleanHistory = chats[activeChatId].history.map((m) => {
            if (typeof m.content === 'string') return m;
            return { role: m.role, content: m.content.find(c => c.type === 'text')?.text || "[Image]" };
        });
        try {
            const res = await fetch(WORKER_URL, { method: "POST", body: JSON.stringify({ messages: cleanHistory, model: model }) });
            if (model === 'flux') { 
                const d = await res.json(); 
                contentDiv.innerHTML = `<img src="${d.image}" class="chat-img">`;
                div.querySelector('.thinking-txt')?.remove();
                chats[activeChatId].history.push({ role: "assistant", content: `[Generated Image]` }); save(); return; 
            }
            const reader = res.body.getReader(), decoder = new TextDecoder();
            let full = "", firstWord = true;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (firstWord) { div.querySelector('.thinking-txt')?.remove(); firstWord = false; }
                full += decoder.decode(value);
                contentDiv.innerHTML = marked.parse(cleanMath(full));
                document.getElementById('chat-container').scrollTop = 1e9;
            }
            chats[activeChatId].history.push({ role: "assistant", content: cleanMath(full) }); save();
        } catch(e) { if(div.querySelector('.thinking-txt')) div.querySelector('.thinking-txt').innerText = "System busy."; }
    }

    function appendMessage(role, content) {
        const div = document.createElement('div'); div.className = `message ${role}`;
        div.innerHTML = `<div class="label">${role.toUpperCase()}</div><div class="content"></div>`;
        document.getElementById('chat-container').appendChild(div);
        const cDiv = div.querySelector('.content');
        if (typeof content === 'string') { if (content.includes('Thinking...')) cDiv.innerHTML = content; else cDiv.innerHTML = marked.parse(cleanMath(content)); }
        else { content.forEach(p => { if (p.type === 'text') cDiv.innerHTML += marked.parse(cleanMath(p.text)); if (p.type === 'image_url') cDiv.innerHTML += `<img src="${p.image_url.url}" class="chat-img">`; }); }
        document.getElementById('chat-container').scrollTop = 1e9;
        return div;
    }

    function handleFile(e) { if (e.target.files) compressImage(e.target.files); }
    document.getElementById('user-input').onpaste = (e) => { for (let i of e.clipboardData.items) if (i.type.indexOf("image") !== -1) compressImage(i.getAsFile()); };
    function compressImage(file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, 450 / Math.max(img.width, img.height));
                canvas.width = img.width * scale; canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                attachedImg = canvas.toDataURL('image/jpeg', 0.4);
                document.getElementById('preview-bar').style.display = 'flex';
                document.getElementById('preview-bar').innerHTML = `<img src="${attachedImg}" class="p-img"><span onclick="clearImg()" style="color:red;cursor:pointer;margin-left:10px;font-weight:900;">✕</span>`;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
    function renderList() {
        const l = document.getElementById('chat-list'); l.innerHTML = '';
        Object.keys(chats).sort().reverse().forEach(id => {
            const d = document.createElement('div'); d.className = `chat-item ${id === activeChatId ? 'active' : ''}`;
            d.onclick = () => loadChat(id); d.innerHTML = `<span>${chats[id].title}</span><span class="chat-options" onclick="openChatOptions(event, '${id}')">⋮</span>`;
            l.appendChild(d);
        });
    }
    function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode'); document.getElementById('theme-btn').innerText = isDarkMode ? "DARK MODE" : "LIGHT MODE"; }
    function openChatOptions(e, id) { e.stopPropagation(); const a = prompt("'rename' or 'delete'?", "rename"); if (a === 'rename') { const t = prompt("Title?", chats[id].title); if (t) { chats[id].title = t; save(); renderList(); } } else if (a === 'delete') { delete chats[id]; save(); const r = Object.keys(chats); if (r.length) loadChat(r.pop()); else createNewChat(); } }
    function clearImg() { attachedImg = null; document.getElementById('preview-bar').style.display = 'none'; }
    document.getElementById('user-input').onkeypress = (e) => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
</script>
</body>
</html>
