<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineby</title>
    <style>
        /* Vapor v3 Aesthetic: Dark, minimal, and semi-transparent */
        :root {
            --bg: #0b0d0f;
            --surface: #16191d;
            --border: #2d333b;
            --accent: #58a6ff;
            --text: #adbac7;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Top Search Bar (Disguised) */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: rgba(11, 13, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        #search-input {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        /* Main Content Layout */
        .main-layout {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* Left Side: Server/Season Selector */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 15px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #768390;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .nav-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item:hover { background: #22272e; color: var(--accent); }
        .nav-item.active { background: #2d333b; color: white; }

        /* Right Side: Player Area */
        .viewer {
            flex-grow: 1;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Source Selector Dropdown (From your Image) */
        .source-bar {
            padding: 8px 15px;
            background: #1c2128;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            background: #22272e;
            color: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
        }

        #player-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* The Poster Grid (Shown when not playing) */
        #grid-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .poster-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .poster-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .poster-card img { width: 100%; height: 230px; object-fit: cover; }
        .poster-title { padding: 8px; font-size: 12px; text-align: center; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="search-input" placeholder="Search Scientific Case Studies (One Piece, The Boys...)" onkeypress="handleSearch(event)">
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="section-label">Data Sources</div>
            <div id="season-list">
                <!-- Disguised as 'Data Phases' for the teacher -->
                <div class="nav-item active" onclick="loadEpisodes(1)">Phase 1 (Season 1)</div>
                <div class="nav-item" onclick="loadEpisodes(2)">Phase 2 (Season 2)</div>
                <div class="nav-item" onclick="loadEpisodes(3)">Phase 3 (Season 3)</div>
            </div>
            
            <div class="section-label">Segments</div>
            <div id="episode-list">
                <!-- Episodes populated here -->
            </div>
        </div>

        <div class="viewer">
            <div class="source-bar">
                <select id="server-select" onchange="updatePlayer()">
                    <option value="vidfast">VidFast (4K)</option>
                    <option value="vidsrcxyz">VidSrcXyz</option>
                    <option value="twoembed">2Embed</option>
                    <option value="vidsrc">VidSrc Pro</option>
                </select>
                <button onclick="closePlayer()" style="margin-left:auto; background:none; border:none; color:grey; cursor:pointer;">✕ Close</button>
            </div>
            
            <iframe id="player-frame" src="" allowfullscreen></iframe>

            <div id="grid-view">
                <!-- Disguised Poster Grid -->
                <div class="poster-card" onclick="selectShow('37854')">
                    <img src="https://media-amazon.com">
                    <div class="poster-title">Oceanography: One Piece</div>
                </div>
                <div class="poster-card" onclick="selectShow('76479')">
                    <img src="https://media-amazon.com">
                    <div class="poster-title">Sociology: The Boys</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Encoded URLs to stay hidden from Linewize text scanners
        const API_MAP = {
            vidfast: atob("aHR0cHM6Ly92aWRmYXN0LmNvL2VtYmVkL3R2Lw=="),
            vidsrcxyz: atob("aHR0cHM6Ly92aWRzcmMueHl6L2VtYmVkL3R2Lw=="),
            twoembed: atob("aHR0cHM6Ly93d3cuMmVtYmVkLmNjL2VtYmVkLw=="),
            vidsrc: atob("aHR0cHM6Ly92aWRzcmMubWUvZW1iZWQvdHYv")
        };

        let activeShow = "";
        let activeSeason = 1;
        let activeEpisode = 1;

        function selectShow(id) {
            activeShow = id;
            document.getElementById('grid-view').classList.add('hidden');
            loadEpisodes(1);
        }

        function loadEpisodes(season) {
            activeSeason = season;
            const list = document.getElementById('episode-list');
            list.innerHTML = "";
            
            // Loop for episodes (Customizable based on show)
            for(let i=1; i<=12; i++) {
                let div = document.createElement('div');
                div.className = "nav-item";
                div.innerText = `Segment ${i}: Data Log`; 
                div.onclick = () => {
                    activeEpisode = i;
                    updatePlayer();
                };
                list.appendChild(div);
            }
        }

        function updatePlayer() {
            if(!activeShow) return;
            const server = document.getElementById('server-select').value;
            const baseUrl = API_MAP[server];
            // Format: Base + ID + Season + Episode
            document.getElementById('player-frame').src = `${baseUrl}${activeShow}/${activeSeason}/${activeEpisode}`;
        }

        function closePlayer() {
            document.getElementById('player-frame').src = "";
            document.getElementById('grid-view').classList.remove('hidden');
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                // Simple disguise: Search clears the player to look like a "reset"
                closePlayer();
                alert("Database search is restricted. Please use pre-loaded modules.");
            }
        }
    </script>
</body>
</html>
