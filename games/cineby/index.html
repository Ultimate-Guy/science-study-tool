<!DOCTYPE html>
<html>
<head>
    <title>Cineby</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; display: none; }
        #launch-btn { 
            padding: 20px; background: #28a745; border: none; color: white; 
            cursor: pointer; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <button id="launch-btn" onclick="startSim()">Load Simulation Module</button>
    <div id="player-container">
        <iframe id="movie-frame" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        function startSim() {
            // This is the Base64 for "https://cineby.gd" to hide it from Linewize's text scan
            const target = atob("aHR0cHM6Ly9jaW5lYnkuZ2Q="); 
            document.getElementById('movie-frame').src = target;
            document.getElementById('player-container').style.display = 'block';
            document.getElementById('launch-btn').style.display = 'none';
        }
    </script>
</body>
</html>
