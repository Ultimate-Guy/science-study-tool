<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapor v3</title>
    <style>
        :root {
            --bg: #080808;
            --side: #111111;
            --accent: #3d5afe;
            --border: #1f1f1f;
            --text: #efefef;
            --dim: #777;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden;
        }

        .sidebar {
            width: 280px; background: var(--side); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }

        .search-container { padding: 20px; }
        #search-bar {
            width: 100%; background: #000; border: 1px solid var(--border);
            padding: 12px; border-radius: 8px; color: #fff; outline: none;
            font-size: 13px; transition: border 0.3s;
        }
        #search-bar:focus { border-color: var(--accent); }

        .scroller { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .head { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 10px; }

        .nav-item {
            padding: 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
            margin-bottom: 2px; color: #aaa; transition: 0.2s;
        }
        .nav-item:hover { background: #1a1a1a; color: #fff; }
        .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }

        #resume-pill {
            background: rgba(61, 90, 254, 0.1); color: var(--accent); border: 1px solid var(--accent);
            margin: 0 20px 10px; padding: 8px; border-radius: 6px; font-size: 11px;
            text-align: center; cursor: pointer; display: none;
        }

        .viewport { flex-grow: 1; position: relative; display: flex; flex-direction: column; background: #000; }
        
        .top-bar {
            height: 50px; padding: 0 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; background: var(--bg);
        }

        iframe { width: 100%; height: 100%; border: none; }

        #grid {
            position: absolute; inset: 0; background: var(--bg); padding: 30px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px; overflow-y: auto; z-index: 10;
        }

        .card { 
            background: #121212; border-radius: 10px; overflow: hidden; cursor: pointer;
            border: 1px solid var(--border); transition: transform 0.3s, border 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .card img { width: 100%; height: 260px; object-fit: cover; opacity: 0.9; }
        .card-name { padding: 12px; font-size: 12px; text-align: center; font-weight: 500; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search..." oninput="debounceSearch(event)">
    </div>
    <div id="resume-pill" onclick="resumeWatching()">Resume Last Session</div>
    <div class="scroller">
        <div id="season-wrap"><div class="head">Seasons</div><div id="seasons"></div></div>
        <div id="episode-wrap"><div class="head">Episodes</div><div id="episodes"></div></div>
    </div>
</div>

<div class="viewport">
    <div class="top-bar">
        <span id="now-playing" style="font-size: 11px; color: var(--dim); letter-spacing: 1px;">VAPOR V3 ONLINE</span>
        <div onclick="showHome()" style="cursor:pointer; color:var(--dim); font-size:18px;">&times;</div>
    </div>

    <iframe id="player" src="" allowfullscreen></iframe>

    <div id="grid"></div>
</div>

<script>
    const KEY = 'TMDB_REPLACE_ME'; 
    const SRC = atob("aHR0cHM6Ly92aWRzcmMubWUvZW1iZWQv"); 

    let activeID = "", activeType = "", searchTimer;

    window.onload = async () => {
        if(localStorage.getItem('last_watched')) document.getElementById('resume-pill').style.display = 'block';
        fetchTrending();
    };

    async function fetchTrending() {
        const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${KEY}`);
        const data = await res.json();
        renderGrid(data.results);
    }

    function debounceSearch(e) {
        clearTimeout(searchTimer);
        const q = e.target.value;
        if (!q) return fetchTrending();
        searchTimer = setTimeout(() => performSearch(q), 400); 
    }

    async function performSearch(q) {
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderGrid(data.results);
    }

    function renderGrid(results) {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        grid.classList.remove('hidden');
        results.forEach(item => {
            if(!item.poster_path) return;
            const div = document.createElement('div');
            div.className = "card";
            div.onclick = () => selectMedia(item.id, item.media_type);
            div.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div class="card-name">${item.title || item.name}</div>`;
            grid.appendChild(div);
        });
    }

    async function selectMedia(id, type, resume = null) {
        activeID = id; activeType = type;
        document.getElementById('grid').classList.add('hidden');
        if(type === 'tv') {
            const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${KEY}`);
            const data = await res.json();
            renderSeasons(data.seasons, resume);
        } else {
            document.getElementById('player').src = `${SRC}movie/${id}`;
            document.getElementById('seasons').innerHTML = "";
            document.getElementById('episodes').innerHTML = "<div class='nav-item active'>Play Movie</div>";
            saveSession(id, type, `${SRC}movie/${id}`);
        }
    }

    async function fetchEpisodes(sNum, resume) {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${activeID}/season/${sNum}?api_key=${KEY}`);
        const data = await res.json();
        const box = document.getElementById('episodes'); box.innerHTML = "";
        data.episodes.forEach(ep => {
            const div = document.createElement('div');
            div.className = "nav-item";
            div.innerText = `E${ep.episode_number}: ${ep.name}`;
            div.onclick = () => {
                document.querySelectorAll('#episodes .nav-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                const url = `${SRC}tv/${activeID}/${sNum}/${ep.episode_number}`;
                document.getElementById('player').src = url;
                document.getElementById('now-playing').innerText = ep.name.toUpperCase();
                saveSession(activeID, 'tv', url, sNum, ep.episode_number);
            };
            box.appendChild(div);
            if(resume && ep.episode_number == resume.e) div.click();
        });
    }

    function saveSession(id, type, url, s=null, e=null) {
        localStorage.setItem('last_watched', JSON.stringify({id, type, url, s, e}));
        document.getElementById('resume-pill').style.display = 'block';
    }

    function resumeWatching() {
        const data = JSON.parse(localStorage.getItem('last_watched'));
        if(data) selectMedia(data.id, data.type, data);
    }

    function showHome() {
        document.getElementById('grid').classList.remove('hidden');
        document.getElementById('player').src = "";
        document.getElementById('now-playing').innerText = "VAPOR V3 ONLINE";
    }
</script>
</body>
</html>
