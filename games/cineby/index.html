<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineby</title>
    <style>
        /* Vapor v3 Aesthetic: Dark, minimal, and semi-transparent */
        :root {
            --bg: #0b0d0f;
            --surface: #16191d;
            --border: #2d333b;
            --accent: #58a6ff;
            --text: #adbac7;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Top Search Bar */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: rgba(11, 13, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        #search-input {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        /* Main Content Layout */
        .main-layout {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* Left Side: Sidebar */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 15px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #768390;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .nav-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-item:hover { background: #22272e; color: var(--accent); }
        .nav-item.active { background: var(--accent); color: white; }

        /* Right Side: Player Area */
        .viewer {
            flex-grow: 1;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .source-bar {
            padding: 8px 15px;
            background: #1c2128;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            background: #22272e;
            color: white;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            font-size: 12px;
        }

        #player-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Poster Grid */
        #grid-view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .poster-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .poster-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .poster-card img { width: 100%; height: 230px; object-fit: cover; }
        .poster-title { padding: 8px; font-size: 12px; text-align: center; }

        .hidden { display: none !important; }

        #resume-btn {
            background: #1a1a1a; border: 1px solid var(--accent); color: var(--accent);
            padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px;
            text-align: center; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <input type="text" id="search-input" placeholder="Search Movies or TV Shows..." oninput="debounceSearch(event)">
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div id="resume-btn" onclick="resumeWatching()">↻ Resume Last Watch</div>
            
            <div class="section-label">Seasons</div>
            <div id="season-list"></div>
            
            <div class="section-label">Episodes</div>
            <div id="episode-list"></div>
        </div>

        <div class="viewer">
            <div class="source-bar">
                <select id="server-select" onchange="updatePlayer()">
                    <option value="vidsrc">VidSrc Pro</option>
                    <option value="vidfast">VidFast (4K)</option>
                    <option value="vidsrcxyz">VidSrcXyz</option>
                    <option value="twoembed">2Embed</option>
                </select>
                <button onclick="closePlayer()" style="margin-left:auto; background:none; border:none; color:grey; cursor:pointer;">✕ Close</button>
            </div>
            
            <iframe id="player-frame" src="" allowfullscreen></iframe>

            <div id="grid-view"></div>
        </div>
    </div>

    <script>
        const KEY = 'TMDB_REPLACE_ME';
        const API_MAP = {
            vidsrc: atob("aHR0cHM6Ly92aWRzcmMubWUvZW1iZWQv"),
            vidfast: atob("aHR0cHM6Ly92aWRmYXN0LmNvL2VtYmVkLw=="),
            vidsrcxyz: atob("aHR0cHM6Ly92aWRzcmMueHl6L2VtYmVkLw=="),
            twoembed: atob("aHR0cHM6Ly93d3cuMmVtYmVkLmNjL2VtYmVkLw==")
        };

        let activeShow = "";
        let activeType = "";
        let activeSeason = 1;
        let activeEpisode = 1;
        let searchTimer;

        window.onload = () => {
            if(localStorage.getItem('last_watched')) {
                document.getElementById('resume-btn').style.display = 'block';
            }
            fetchTrending();
        };

        async function fetchTrending() {
            const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${KEY}`);
            const data = await res.json();
            renderGrid(data.results);
        }

        function debounceSearch(e) {
            clearTimeout(searchTimer);
            const query = e.target.value;
            if (!query) return fetchTrending();
            searchTimer = setTimeout(() => performSearch(query), 400);
        }

        async function performSearch(query) {
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${KEY}&query=${encodeURIComponent(query)}`);
            const data = await res.json();
            renderGrid(data.results);
        }

        function renderGrid(results) {
            const grid = document.getElementById('grid-view');
            grid.innerHTML = "";
            grid.classList.remove('hidden');
            results.forEach(item => {
                if(!item.poster_path) return;
                const div = document.createElement('div');
                div.className = "poster-card";
                div.onclick = () => selectShow(item.id, item.media_type);
                div.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}">
                    <div class="poster-title">${item.title || item.name}</div>
                `;
                grid.appendChild(div);
            });
        }

        async function selectShow(id, type, resumeData = null) {
            activeShow = id;
            activeType = type;
            document.getElementById('grid-view').classList.add('hidden');
            
            if(type === 'tv') {
                const res = await fetch(`https://api.themoviedb.org/3/tv/${id}?api_key=${KEY}`);
                const data = await res.json();
                renderSeasons(data.seasons, resumeData);
            } else {
                // Clear sidebars for movies
                document.getElementById('season-list').innerHTML = "";
                document.getElementById('episode-list').innerHTML = "";
                updatePlayer('movie');
            }
        }

        function renderSeasons(seasons, resumeData) {
            const list = document.getElementById('season-list');
            list.innerHTML = "";
            seasons.filter(s => s.season_number > 0).forEach(s => {
                let div = document.createElement('div');
                div.className = "nav-item";
                div.innerText = `Season ${s.season_number}`;
                div.onclick = () => {
                    document.querySelectorAll('#season-list .nav-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    loadEpisodes(s.season_number, resumeData);
                };
                list.appendChild(div);
            });
            if(resumeData) {
                const target = Array.from(list.children).find(el => el.innerText.includes(`Season ${resumeData.s}`));
                if(target) target.click();
            } else if(list.firstChild) list.firstChild.click();
        }

        async function loadEpisodes(season, resumeData) {
            activeSeason = season;
            const res = await fetch(`https://api.themoviedb.org/3/tv/${activeShow}/season/${season}?api_key=${KEY}`);
            const data = await res.json();
            const list = document.getElementById('episode-list');
            list.innerHTML = "";
            
            data.episodes.forEach(ep => {
                let div = document.createElement('div');
                div.className = "nav-item";
                div.innerText = `E${ep.episode_number}: ${ep.name}`;
                div.onclick = () => {
                    document.querySelectorAll('#episode-list .nav-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    activeEpisode = ep.episode_number;
                    updatePlayer('tv');
                };
                list.appendChild(div);
                if(resumeData && ep.episode_number == resumeData.e) div.click();
            });
        }

        function updatePlayer(type = activeType) {
            if(!activeShow) return;
            const server = document.getElementById('server-select').value;
            let baseUrl = API_MAP[server];
            
            if(type === 'movie') {
                document.getElementById('player-frame').src = `${baseUrl}movie/${activeShow}`;
                saveSession(activeShow, 'movie', null, null);
            } else {
                document.getElementById('player-frame').src = `${baseUrl}tv/${activeShow}/${activeSeason}/${activeEpisode}`;
                saveSession(activeShow, 'tv', activeSeason, activeEpisode);
            }
        }

        function saveSession(id, type, s, e) {
            localStorage.setItem('last_watched', JSON.stringify({id, type, s, e}));
            document.getElementById('resume-btn').style.display = 'block';
        }

        function resumeWatching() {
            const data = JSON.parse(localStorage.getItem('last_watched'));
            if(data) selectShow(data.id, data.type, data);
        }

        function closePlayer() {
            document.getElementById('player-frame').src = "";
            document.getElementById('grid-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
