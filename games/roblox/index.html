<!DOCTYPE html>
<html>
<head>
    <title>Roblox</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: #000; color: #fff; overflow: hidden; }
        #gatekeeper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        #content-frame { display: none; width: 100%; height: 100vh; border: none; }
        input { padding: 12px; margin: 10px; border-radius: 5px; border: 1px solid #333; background: #111; color: white; width: 220px; }
        button { padding: 12px 24px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="gatekeeper">
    <h2>Access Required</h2>
    <input type="password" id="passInput" placeholder="Password">
    <button onclick="unlock()">Enter</button>
</div>

<iframe id="content-frame"></iframe>

<script>
    // This is the hashed version of "I-like-testing". 
    // The actual password is NOT in this code.
    const _0xSECRET_HASH = -1181283995; 
    
    // Encoded URL (Hides the site from Linewize keyword scanners)
    const _0xURL = "aHR0cHM6Ly9pbG92ZXRlYWNoZXJzLmdyYXBoaWNvbi5vcmcvNDA4MTB4Lmh0bWw=";

    // One-way hashing function: Turns input into a unique number
    const generateHash = s => s.split("").reduce((a, b) => { 
        a = (a << 5) - a + b.charCodeAt(0); 
        return a & a; 
    }, 0);

    function unlock() {
        const input = document.getElementById('passInput').value;
        
        // Checks if the entered password matches the secret signature
        if (generateHash(input) === _0xSECRET_HASH) {
            const frame = document.getElementById('content-frame');
            frame.src = atob(_0xURL);
            document.getElementById('gatekeeper').style.display = 'none';
            frame.style.display = 'block';
        } else {
            alert("Connection Error: 403");
        }
    }

    // PANIC KEY: Press "-" once to instantly bail to Google
    document.addEventListener('keydown', (e) => {
        if (e.key === "-") window.location.href = "https://google.com";
        // Block Inspect Element shortcuts
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
            e.preventDefault();
            return false;
        }
    });

    // Disable Right-Click
    document.oncontextmenu = (e) => e.preventDefault();

    // Infinite Debugger: Freezes DevTools if they force it open
    setInterval(function() {
        const start = new Date();
        debugger; 
        if (new Date() - start > 100) window.location.reload(); 
    }, 100);

    document.getElementById("passInput").onkeydown = (e) => { if (e.key === "Enter") unlock(); };
</script>

</body>
</html>
