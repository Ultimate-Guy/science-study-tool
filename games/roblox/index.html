<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Portal</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #eee; overflow: hidden; }
        #gatekeeper { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; transition: opacity 0.5s; }
        #content-frame { display: none; width: 100%; height: 100vh; border: none; }
        
        .input-container { position: relative; margin: 20px; }
        input { 
            padding: 14px 45px 14px 15px; border-radius: 8px; border: 1px solid #333; 
            background: #1a1a1a; color: #fff; width: 260px; outline: none; font-size: 16px;
            transition: border 0.3s;
        }
        input:focus { border-color: #555; }
        
        #togglePass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; font-size: 20px; }
        
        button { 
            padding: 12px 30px; background: #222; color: #bbb; border: 1px solid #333; 
            border-radius: 8px; cursor: pointer; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; transition: all 0.3s;
        }
        button:hover { background: #333; color: #fff; border-color: #444; }
        
        #status-text { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #444; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="gatekeeper">
    <h2 id="status-text">System Authentication</h2>
    <div class="input-container">
        <input type="password" id="passInput" placeholder="Security Token" autocomplete="off">
        <span id="togglePass" onclick="toggleVisibility()">👁️</span>
    </div>
    <button onclick="verifyAccess()">Verify Access</button>
</div>

<iframe id="content-frame" src="about:blank"></iframe>

<script>
    /* Security Config */
    const AUTH_HASH = 2106093417; // Hash for Super75@
    const TARGET_URL = "aHR0cHM6Ly9pbG92ZXRlYWNoZXJzLmdyYXBoaWNvbi5vcmcvNDA4MTB4Lmh0bWw="; // Base64 URL

    // Simple hashing function
    const hashString = s => s.split("").reduce((a, b) => { 
        a = (a << 5) - a + b.charCodeAt(0); 
        return a & a; 
    }, 0);

    function toggleVisibility() {
        const p = document.getElementById('passInput');
        const s = document.getElementById('togglePass');
        p.type = (p.type === "password") ? "text" : "password";
        s.innerText = (p.type === "password") ? "👁️" : "🔒";
    }

    function verifyAccess() {
        const val = document.getElementById('passInput').value;
        const status = document.getElementById('status-text');
        
        if (hashString(val) === AUTH_HASH) {
            status.innerText = "Access Granted";
            status.style.color = "#0f0";
            
            setTimeout(() => {
                const frame = document.getElementById('content-frame');
                frame.src = atob(TARGET_URL);
                document.getElementById('gatekeeper').style.display = 'none';
                frame.style.display = 'block';
            }, 600);
        } else {
            document.getElementById('passInput').value = "";
            status.innerText = "Invalid Token";
            status.style.color = "#f00";
            setTimeout(() => { 
                status.innerText = "System Authentication";
                status.style.color = "#444";
            }, 2000);
        }
    }

    /* Input Listener */
    document.getElementById("passInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") verifyAccess();
    });

    /* Anti-Inspection & Protection */
    document.addEventListener('keydown', (e) => {
        if (e.key === "-") window.location.replace("https://google.com");
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
            e.preventDefault();
        }
    });
    document.oncontextmenu = (e) => e.preventDefault();
</script>

</body>
</html>
