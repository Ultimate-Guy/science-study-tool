<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars FR</title>
<script>
/* =========================================================
   BRAWL ENGINE PRODUCTION CORE (REFACORED BASE)
   PART 1/5
   ========================================================= */

const BrawlEngine = {
    version: "3.0-production",
    
    instance: null,
    canvas: null,
    config: null,

    state: {
        ready: false,
        paused: false,
        visible: true,
        initialized: false
    },

    sdk: {
        ysdk: null,
        initialized: false
    },

    boot: function (config) {
        this.config = config;
        this.canvas = document.getElementById("unity-canvas") || document.getElementById("game");

        this._log("Booting engine...");
        this._bindSystemEvents();
        this._initLoadingScreen();
        this._startBootSequence();
    },

    /* =========================
       SYSTEM EVENTS
       ========================= */

    _bindSystemEvents: function () {
        document.addEventListener("visibilitychange", () => {
            this.state.visible = !document.hidden;
            this._onVisibilityChange(this.state.visible);
        });

        window.addEventListener("blur", () => {
            this.state.visible = false;
            this._onVisibilityChange(false);
        });

        window.addEventListener("focus", () => {
            this.state.visible = true;
            this._onVisibilityChange(true);
        });

        window.addEventListener("contextmenu", e => e.preventDefault());
    },

    _onVisibilityChange: function (visible) {
        this._log("Visibility:", visible);
        this.sendToGame("SetFocus", visible);
    },

    /* =========================
       GAME COMMUNICATION
       ========================= */

    sendToGame: function (method, data) {
        if (!this.instance) return;

        try {
            this.instance.SendMessage(
                "BrawlSDK",
                method,
                typeof data === "string" ? data : JSON.stringify(data)
            );
        } catch (e) {
            console.warn("SendMessage failed:", e);
        }
    },

    setInstance: function (unityInstance) {
        this.instance = unityInstance;
        this._log("Unity instance attached");
    },

    /* =========================
       LOADING SYSTEM
       ========================= */

    _initLoadingScreen: function () {
        this.loader = {
            element: document.getElementById("loading-text"),
            progress: 0
        };
    },

    _startBootSequence: function () {
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;

            if (this.loader?.element) {
                this.loader.element.innerText = LOADING ENGINE... ${progress}%;
            }

            if (progress >= 100) {
                clearInterval(interval);
                this._onBootComplete();
            }
        }, 40);
    },

    _onBootComplete: function () {
        this.state.ready = true;
        this._log("Engine boot complete");

        const loader = document.getElementById("loading-text");
        if (loader) loader.remove();
    },

    /* =========================
       UTILITY
       ========================= */

    _log: function (...args) {
        console.log("[BrawlEngine]", ...args);
    }
};

/* =========================================================
   GLOBAL SAFE API (for Unity calls)
   ========================================================= */

window.BrawlEngine = BrawlEngine;

/* Called by Unity when ready */
window.OnUnityReady = function (unityInstance) {
    BrawlEngine.setInstance(unityInstance);
};

/* External bootstrap */
window.InitBrawlEngine = function (config) {
    BrawlEngine.boot(config);
};
</script>
<script>
/* =========================================================
   BRAWL ENGINE SDK LAYER (PRODUCTION)
   PART 2/5
   ========================================================= */

BrawlEngine.sdk = {
    ysdk: null,
    initialized: false,
    mode: "unknown", // "yandex" | "offline"

    queue: [],
    player: null
};

/* =========================
   SDK INITIALIZATION
   ========================= */

BrawlEngine.initSDK = async function () {
    this._log("Initializing SDK...");

    try {
        if (!window.ysdk) {
            this._log("No YSDK found → switching to offline mode");
            this.sdk.mode = "offline";
            this.sdk.initialized = true;
            this._flushSDKQueue();
            return;
        }

        this.sdk.ysdk = window.ysdk;
        this.sdk.mode = "yandex";

        await this._initPlayer();
        await this._initEnvironment();

        this.sdk.initialized = true;
        this._log("SDK initialized successfully");

        this._flushSDKQueue();

    } catch (e) {
        console.error("[BrawlEngine] SDK init failed:", e);

        this.sdk.mode = "offline";
        this.sdk.initialized = true;
        this._flushSDKQueue();
    }
};

/* =========================
   PLAYER SYSTEM
   ========================= */

BrawlEngine._initPlayer = async function () {
    if (!this.sdk.ysdk) return;

    try {
        this.sdk.player = await this.sdk.ysdk.getPlayer();

        this._log("Player loaded");

    } catch (e) {
        console.warn("[BrawlEngine] Player init failed:", e);
        this.sdk.player = null;
    }
};

/* =========================
   ENVIRONMENT DATA
   ========================= */

BrawlEngine._initEnvironment = async function () {
    try {
        const env = {
            language: navigator.language || "en",
            platform: navigator.platform,
            mobile: /Android|iPhone/i.test(navigator.userAgent)
        };

        this.sendToGame("SetEnvironment", env);

    } catch (e) {
        console.warn("[BrawlEngine] Environment init failed:", e);
    }
};

/* =========================
   SAFE SDK CALL SYSTEM
   ========================= */

BrawlEngine.sdkCall = function (fn) {
    return new Promise((resolve) => {

        const execute = () => {
            try {
                if (this.sdk.mode === "offline") {
                    resolve(null);
                    return;
                }

                const result = fn(this.sdk.ysdk, this.sdk.player);
                resolve(result);

            } catch (e) {
                console.error("[BrawlEngine] SDK call error:", e);
                resolve(null);
            }
        };

        if (!this.sdk.initialized) {
            this.sdk.queue.push(execute);
        } else {
            execute();
        }
    });
};

/* =========================
   QUEUE SYSTEM
   ========================= */

BrawlEngine._flushSDKQueue = function () {
    this._log("Flushing SDK queue:", this.sdk.queue.length);

    for (const fn of this.sdk.queue) {
        try { fn(); } catch (e) {}
    }

    this.sdk.queue = [];
};

/* =========================
   PUBLIC SDK WRAPPERS
   ========================= */

/* Get Player Info */
BrawlEngine.getPlayerInfo = function () {
    return this.sdkCall((ysdk, player) => {
        if (!player) return null;

        return {
            id: player.getUniqueID?.() || "guest",
            name: player.getName?.() || "Player"
        };
    });
};

/* Show Interstitial Ad */
BrawlEngine.showInterstitial = function () {
    return this.sdkCall((ysdk) => {
        if (!ysdk?.adv) return;

        ysdk.adv.showFullscreenAdv({
            callbacks: {
                onOpen: () => this._log("Ad opened"),
                onClose: () => this._log("Ad closed"),
                onError: (e) => console.warn("Ad error:", e)
            }
        });
    });
};

/* Show Rewarded Ad */
BrawlEngine.showRewarded = function (id) {
    return this.sdkCall((ysdk) => {
        if (!ysdk?.adv) return;

        ysdk.adv.showRewardedVideo({
            callbacks: {
                onRewarded: () => {
                    this._log("Reward granted:", id);
                    this.sendToGame("OnReward", id);
                },
                onClose: () => this._log("Reward ad closed"),
                onError: (e) => console.warn("Reward ad error:", e)
            }
        });
    });
};

/* Save Cloud (stub safe) */
BrawlEngine.saveCloud = function (data) {
    return this.sdkCall((ysdk, player) => {
        if (!player?.setData) return;

        return player.setData({ saves: [data] });
    });
};

/* Load Cloud */
BrawlEngine.loadCloud = function () {
    return this.sdkCall(async (ysdk, player) => {
        if (!player?.getData) return null;

        const data = await player.getData(["saves"]);
        return data?.saves || null;
    });
};
</script>
<script>
/* =========================================================
   BRAWL ENGINE SAVE + ACCOUNT SYSTEM (PRODUCTION)
   PART 3/5
   ========================================================= */

/* =========================
   SAVE CONFIG
   ========================= */

BrawlEngine.save = {
    version: "1.0.0",
    prefix: "brawl_save_",
    activeSlot: 0,

    schema: {
        player: null,
        progress: {},
        settings: {},
        timestamp: 0,
        version: "1.0.0"
    }
};

/* =========================
   ACCOUNT SYSTEM (FIXED)
   ========================= */

BrawlEngine.account = {
    name: null,

    getName: function () {
        if (this.name) return this.name;

        let stored = localStorage.getItem("brawl_player_name");

        if (!stored) {
            stored = prompt("Enter username:") || "Player";
            localStorage.setItem("brawl_player_name", stored);
        }

        this.name = stored;
        return stored;
    },

    setName: function (name) {
        this.name = name;
        localStorage.setItem("brawl_player_name", name);
    },

    switchAccount: function () {
        const newName = prompt("Enter new username:");
        if (!newName) return;

        this.setName(newName);
        location.reload();
    }
};

/* =========================
   SAFE SERIALIZATION
   ========================= */

BrawlEngine._encode = function (obj) {
    try {
        const json = JSON.stringify(obj);
        return btoa(unescape(encodeURIComponent(json)));
    } catch (e) {
        console.error("[Save Encode Error]", e);
        return null;
    }
};

BrawlEngine._decode = function (data) {
    try {
        const json = decodeURIComponent(escape(atob(data)));
        return JSON.parse(json);
    } catch (e) {
        console.warn("[Save Decode Failed] Corrupted save detected");
        return null;
    }
};

/* =========================
   SAVE SYSTEM (LOCAL + CLOUD SAFE MERGE)
   ========================= */

BrawlEngine.saveGame = function (data) {
    const player = this.account.getName();

    const payload = {
        ...this.save.schema,
        player,
        progress: data || {},
        timestamp: Date.now(),
        version: this.save.version
    };

    const encoded = this._encode(payload);

    if (!encoded) return;

    localStorage.setItem(this.save.prefix + player, encoded);

    this._log("Game saved for:", player);

    // optional cloud sync
    this.saveCloud?.(encoded);
};

/* =========================
   LOAD SYSTEM (WITH RECOVERY)
   ========================= */

BrawlEngine.loadGame = function () {
    const player = this.account.getName();

    const raw = localStorage.getItem(this.save.prefix + player);

    if (!raw) {
        this._log("No save found → creating new");
        return null;
    }

    const decoded = this._decode(raw);

    if (!decoded) {
        this._log("Corrupted save → resetting");
        return this._createNewSave();
    }

    return decoded;
};

/* =========================
   NEW SAVE GENERATOR
   ========================= */

BrawlEngine._createNewSave = function () {
    return {
        ...this.save.schema,
        player: this.account.getName(),
        progress: {},
        timestamp: Date.now(),
        version: this.save.version
    };
};

/* =========================
   EXPORT SAVE (DOWNLOAD FILE)
   ========================= */

BrawlEngine.exportSave = function () {
    const data = this.loadGame();

    if (!data) {
        alert("No save found!");
        return;
    }

    const blob = new Blob([JSON.stringify(data, null, 2)], {
        type: "application/json"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = brawl_save_${this.account.getName()}.json;
    a.click();
};

/* =========================
   IMPORT SAVE (SAFE VALIDATION)
   ========================= */

BrawlEngine.importSave = function () {
    const input = document.createElement("input");
    input.type = "file";

    input.onchange = (e) => {
        const file = e.target.files[0];

        const reader = new FileReader();

        reader.onload = (ev) => {
            try {
                const parsed = JSON.parse(ev.target.result);

                if (!parsed || typeof parsed !== "object") {
                    alert("Invalid save file");
                    return;
                }

                localStorage.setItem(
                    this.save.prefix + this.account.getName(),
                    this._encode(parsed)
                );

                alert("Save imported successfully");
                location.reload();

            } catch (err) {
                console.error("Import failed:", err);
                alert("Corrupted file");
            }
        };

        reader.readAsText(file);
    };

    input.click();
};

/* =========================
   UI SYSTEM (FIXED)
   ========================= */

BrawlEngine.initSaveUI = function () {
    if (document.getElementById("brawl-ui")) return;

    const box = document.createElement("div");
    box.id = "brawl-ui";
    box.style.position = "fixed";
    box.style.top = "10px";
    box.style.right = "10px";
    box.style.zIndex = 99999;

    const btn = (text, fn) => {
        const b = document.createElement("button");
        b.innerText = text;
        b.onclick = fn;
        b.style.margin = "4px";
        b.style.padding = "6px";
        return b;
    };

    box.appendChild(btn("Switch Account", () => this.account.switchAccount()));
    box.appendChild(btn("Export Save", () => this.exportSave()));
    box.appendChild(btn("Import Save", () => this.importSave()));

    document.body.appendChild(box);
};

/* =========================
   AUTO SYNC HOOK (UNITY)
   ========================= */

BrawlEngine.pushSaveToGame = function () {
    const save = this.loadGame();

    this.sendToGame("LoadSave", save || {});
};

/* =========================
   AUTO INIT HOOK
   ========================= */

BrawlEngine.initSaveSystem = function () {
    this.initSaveUI();

    const save = this.loadGame();

    this._log("Save system ready");

    return save;
};
</script>
<script>
/* =========================================================
   BRAWL ENGINE ADS + PAYMENTS + LEADERBOARD
   PRODUCTION FIX LAYER
   PART 4/5
   ========================================================= */

/* =========================
   ADS STATE MACHINE
   ========================= */

BrawlEngine.ads = {
    interstitialReady: true,
    rewardedReady: true,
    cooldown: 30000, // 30 sec anti-spam
    lastAdTime: 0,

    state: {
        interstitialOpen: false,
        rewardedOpen: false
    }
};

/* =========================
   SAFE INTERSTITIAL ADS
   ========================= */

BrawlEngine.showInterstitialAd = function () {
    const now = Date.now();

    if (now - this.ads.lastAdTime < this.ads.cooldown) {
        this._log("Ad blocked (cooldown)");
        return;
    }

    return this.sdkCall((ysdk) => {
        if (!ysdk?.adv) return;

        this.ads.state.interstitialOpen = true;
        this.ads.lastAdTime = now;

        ysdk.adv.showFullscreenAdv({
            callbacks: {
                onOpen: () => {
                    this._log("Interstitial opened");
                    this.sendToGame("AdOpen", "interstitial");
                },

                onClose: (shown) => {
                    this._log("Interstitial closed:", shown);

                    this.ads.state.interstitialOpen = false;

                    this.sendToGame("AdClose", {
                        type: "interstitial",
                        shown: shown
                    });
                },

                onError: (e) => {
                    console.warn("Interstitial error:", e);
                    this.ads.state.interstitialOpen = false;
                }
            }
        });
    });
};

/* =========================
   REWARDED ADS (SAFE REWARD FLOW)
   ========================= */

BrawlEngine.showRewardedAd = function (rewardId) {
    return this.sdkCall((ysdk) => {
        if (!ysdk?.adv) return;

        if (this.ads.state.rewardedOpen) return;

        this.ads.state.rewardedOpen = true;

        ysdk.adv.showRewardedVideo({
            callbacks: {
                onOpen: () => {
                    this._log("Rewarded ad opened");
                    this.sendToGame("RewardAdOpen", rewardId);
                },

                onRewarded: () => {
                    this._log("Reward granted:", rewardId);

                    // IMPORTANT: only reward here (anti exploit safe point)
                    this.sendToGame("RewardGranted", {
                        id: rewardId,
                        timestamp: Date.now()
                    });
                },

                onClose: () => {
                    this._log("Rewarded ad closed");
                    this.ads.state.rewardedOpen = false;

                    this.sendToGame("RewardAdClose", rewardId);
                },

                onError: (e) => {
                    console.warn("Rewarded ad error:", e);
                    this.ads.state.rewardedOpen = false;

                    this.sendToGame("RewardFailed", rewardId);
                }
            }
        });
    });
};

/* =========================
   PAYMENTS SYSTEM (SAFE + NON-BREAKING)
   ========================= */

BrawlEngine.payments = {
    catalog: null,
    purchases: null
};

BrawlEngine.initPayments = function () {
    return this.sdkCall(async (ysdk) => {
        if (!ysdk?.getPayments) return null;

        try {
            const payments = await ysdk.getPayments();

            this.payments.catalog = await payments.getCatalog();
            this.payments.purchases = await payments.getPurchases();

            const safeCatalog = this.payments.catalog.map(p => ({
                id: p.id,
                title: p.title,
                price: p.price
            }));

            this._log("Payments ready");

            return safeCatalog;

        } catch (e) {
            console.warn("Payments init failed:", e);
            return null;
        }
    });
};

/* =========================
   PURCHASE HANDLER (FIXED FLOW)
   ========================= */

BrawlEngine.buyProduct = function (productId) {
    return this.sdkCall(async (ysdk) => {
        if (!ysdk?.getPayments) return;

        try {
            const payments = await ysdk.getPayments();

            await payments.purchase(productId);

            this._log("Purchase success:", productId);

            this.sendToGame("PurchaseSuccess", productId);

        } catch (e) {
            console.warn("Purchase failed:", e);

            this.sendToGame("PurchaseFailed", productId);
        }
    });
};

/* =========================
   LEADERBOARD SYSTEM (SAFE)
   ========================= */

BrawlEngine.leaderboard = {
    ready: false
};

/* SUBMIT SCORE */
BrawlEngine.submitScore = function (table, score) {
    return this.sdkCall((ysdk) => {
        if (!ysdk?.leaderboards) return;

        try {
            ysdk.leaderboards.setScore(table, score);

            this._log("Score submitted:", table, score);

        } catch (e) {
            console.warn("Leaderboard submit error:", e);
        }
    });
};

/* GET LEADERBOARD */
BrawlEngine.getLeaderboard = function (table, top = 10) {
    return this.sdkCall(async (ysdk) => {
        if (!ysdk?.leaderboards) return null;

        try {
            const data = await ysdk.leaderboards.getEntries(table, {
                quantityTop: top
            });

            const parsed = data.entries.map(e => ({
                rank: e.rank,
                name: e.player.publicName || "Anonymous",
                score: e.score
            }));

            this.sendToGame("LeaderboardData", parsed);

            return parsed;

        } catch (e) {
            console.warn("Leaderboard error:", e);
            return null;
        }
    });
};

/* =========================
   SAFE INIT HOOK
   ========================= */

BrawlEngine.initMonetization = function () {
    this._log("Initializing monetization systems...");

    this.initPayments();

    this._log("Monetization ready");
};
</script>
<script>
/* =========================================================
   BRAWL ENGINE FINAL LAYER
   UNITY BRIDGE + BOOT STRAP
   PART 5/5
   ========================================================= */

/* =========================
   UNITY BRIDGE FIX (CRITICAL)
   ========================= */

BrawlEngine.queue = {
    messages: [],
    ready: false
};

/* SAFE SEND MESSAGE (FIXES RACE CONDITIONS) */
BrawlEngine.sendToGameSafe = function (method, data) {
    const payload = typeof data === "string" ? data : JSON.stringify(data);

    if (!this.instance || !this.state.ready) {
        this.queue.messages.push({ method, payload });
        return;
    }

    try {
        this.instance.SendMessage("BrawlSDK", method, payload);
    } catch (e) {
        console.warn("[Bridge Error]", e);
    }
};

/* FLUSH QUEUE WHEN UNITY IS READY */
BrawlEngine.flushQueue = function () {
    this._log("Flushing message queue:", this.queue.messages.length);

    for (const msg of this.queue.messages) {
        try {
            this.instance.SendMessage("BrawlSDK", msg.method, msg.payload);
        } catch (e) {
            console.warn("Queue send failed:", e);
        }
    }

    this.queue.messages = [];
};

/* =========================
   UNITY INITIALIZATION ENTRY
   ========================= */

window.OnUnityLoaded = function (unityInstance) {
    BrawlEngine.setInstance(unityInstance);

    BrawlEngine.state.ready = true;

    BrawlEngine.flushQueue();

    BrawlEngine._log("Unity fully connected");

    BrawlEngine.sendToGameSafe("EngineReady", {
        version: BrawlEngine.version,
        sdk: BrawlEngine.sdk.mode
    });
};

/* =========================
   BOOT SEQUENCE CONTROLLER
   ========================= */

BrawlEngine.start = async function () {
    this._log("Starting full engine bootstrap...");

    /* STEP 1: SDK */
    await this.initSDK();

    /* STEP 2: SAVE SYSTEM */
    this.initSaveSystem();

    /* STEP 3: MONETIZATION */
    this.initMonetization();

    /* STEP 4: FINAL GAME INIT HOOK */
    this._finalizeBoot();

    this._log("BOOT COMPLETE");
};

/* =========================
   FINAL BOOT HANDLER
   ========================= */

BrawlEngine._finalizeBoot = function () {
    this.sendToGameSafe("BootComplete", {
        time: Date.now(),
        mode: this.sdk.mode
    });

    this.state.initialized = true;
};

/* =========================
   GLOBAL API CLEAN EXPORT
   ========================= */

window.Brawl = {
    init: (cfg) => BrawlEngine.boot(cfg),
    start: () => BrawlEngine.start(),

    save: (d) => BrawlEngine.saveGame(d),
    load: () => BrawlEngine.loadGame(),

    ad: {
        interstitial: () => BrawlEngine.showInterstitialAd(),
        rewarded: (id) => BrawlEngine.showRewardedAd(id)
    },

    leaderboard: {
        submit: (t, s) => BrawlEngine.submitScore(t, s),
        get: (t) => BrawlEngine.getLeaderboard(t)
    }
};

/* =========================
   AUTO START (SAFE)
   ========================= */

window.addEventListener("load", async () => {
    BrawlEngine._log("Window loaded → starting engine");

    try {
        await BrawlEngine.start();
    } catch (e) {
        console.error("[BOOT FAILED]", e);
    }
});

/* =========================
   DEBUG PANEL (OPTIONAL)
   ========================= */

BrawlEngine.debug = function () {
    console.table({
        version: this.version,
        sdk: this.sdk.mode,
        ready: this.state.ready,
        initialized: this.state.initialized
    });
};

/* =========================
   FINAL LOG
   ========================= */

BrawlEngine._log("Engine core fully loaded (PART 5 complete)");
</script>
