<script>
/* =========================================================
   BRAWL ENGINE STUDIO v4
   CORE + EVENT SYSTEM
   PART 1/5
   ========================================================= */

const Brawl = window.Brawl = {};

/* =========================
   ENGINE CORE STATE
   ========================= */

Brawl.core = {
    version: "4.0-studio",
    mode: "production", // dev | production

    ready: false,
    started: false,

    unity: null,
    canvas: null
};

/* =========================
   EVENT BUS (NEW STUDIO FEATURE)
   ========================= */

Brawl.events = {
    listeners: {},

    on(event, fn) {
        if (!this.listeners[event]) this.listeners[event] = [];
        this.listeners[event].push(fn);
    },

    off(event, fn) {
        if (!this.listeners[event]) return;
        this.listeners[event] = this.listeners[event].filter(f => f !== fn);
    },

    emit(event, data) {
        const list = this.listeners[event];
        if (!list) return;

        for (const fn of list) {
            try { fn(data); } catch (e) {
                console.warn("[Event Error]", event, e);
            }
        }
    }
};

/* =========================
   UNITY BRIDGE (DECOUPLED)
   ========================= */

Brawl.bridge = {
    send(method, data) {
        if (!Brawl.core.unity) return;

        const payload = typeof data === "string"
            ? data
            : JSON.stringify(data);

        try {
            Brawl.core.unity.SendMessage("BrawlSDK", method, payload);
        } catch (e) {
            console.warn("[Bridge Error]", e);
        }
    }
};

/* =========================
   ENGINE BOOT
   ========================= */

Brawl.init = function(config) {
    this.config = config;

    this.core.canvas =
        document.getElementById("unity-canvas") ||
        document.getElementById("game");

    this._log("Studio v4 initializing...");

    this._bindSystem();
    this._startLoading();
};

/* =========================
   SYSTEM EVENTS
   ========================= */

Brawl._bindSystem = function() {
    document.addEventListener("visibilitychange", () => {
        this.events.emit("visibility", !document.hidden);
    });

    window.addEventListener("blur", () => {
        this.events.emit("focus", false);
    });

    window.addEventListener("focus", () => {
        this.events.emit("focus", true);
    });

    window.addEventListener("contextmenu", e => e.preventDefault());
};

/* =========================
   LOADING SIMULATION
   ========================= */

Brawl._startLoading = function() {
    let p = 0;

    const t = setInterval(() => {
        p += 10;

        this._log("Loading:", p + "%");

        if (p >= 100) {
            clearInterval(t);
            this._onReady();
        }
    }, 50);
};

/* =========================
   READY STATE
   ========================= */

Brawl._onReady = function() {
    this.core.ready = true;
    this.events.emit("engine_ready", true);

    this._log("Engine ready");
};

/* =========================
   UNITY ATTACH
   ========================= */

Brawl.attachUnity = function(instance) {
    this.core.unity = instance;

    this._log("Unity attached");

    this.events.emit("unity_ready", true);
};

/* =========================
   LOG SYSTEM
   ========================= */

Brawl._log = function(...args) {
    console.log("[Brawl v4]", ...args);
};

/* =========================
   GLOBAL HOOKS
   ========================= */

window.OnUnityReady = function(instance) {
    Brawl.attachUnity(instance);
};
</script>
<script>
/* =========================================================
   SDK LAYER v4
   PART 2/5
   ========================================================= */

Brawl.sdk = {
    ysdk: null,
    player: null,
    mode: "offline",
    ready: false,

    queue: []
};

/* =========================
   INIT SDK
   ========================= */

Brawl.initSDK = async function() {
    this._log("Initializing SDK...");

    try {
        if (!window.ysdk) {
            this._log("Offline mode enabled");
            this.sdk.mode = "offline";
            this.sdk.ready = true;
            this._flushQueue();
            return;
        }

        this.sdk.ysdk = window.ysdk;
        this.sdk.mode = "yandex";

        await this._initPlayer();

        this.sdk.ready = true;

        this._flushQueue();

        this.events.emit("sdk_ready", this.sdk.mode);

        this._log("SDK ready:", this.sdk.mode);

    } catch (e) {
        console.error("[SDK ERROR]", e);
        this.sdk.mode = "offline";
        this.sdk.ready = true;
    }
};

/* =========================
   PLAYER
   ========================= */

Brawl._initPlayer = async function() {
    try {
        this.sdk.player = await this.sdk.ysdk.getPlayer();
    } catch (e) {
        this.sdk.player = null;
    }
};

/* =========================
   QUEUE SYSTEM
   ========================= */

Brawl._queue = function(fn) {
    if (!this.sdk.ready) {
        this.sdk.queue.push(fn);
        return;
    }
    fn();
};

Brawl._flushQueue = function() {
    for (const fn of this.sdk.queue) {
        try { fn(); } catch (e) {}
    }
    this.sdk.queue = [];
};

/* =========================
   SAFE CALL WRAPPER
   ========================= */

Brawl.callSDK = function(fn) {
    return new Promise(resolve => {
        const exec = () => {
            if (this.sdk.mode === "offline") {
                resolve(null);
                return;
            }

            try {
                resolve(fn(this.sdk.ysdk, this.sdk.player));
            } catch (e) {
                console.warn("[SDK CALL FAIL]", e);
                resolve(null);
            }
        };

        if (!this.sdk.ready) this.sdk.queue.push(exec);
        else exec();
    });
};

/* =========================
   ADS (BASIC STUBS)
   ========================= */

Brawl.ads = {
    interstitial() {
        return Brawl.callSDK(ysdk => {
            ysdk?.adv?.showFullscreenAdv();
        });
    },

    rewarded(id) {
        return Brawl.callSDK(ysdk => {
            ysdk?.adv?.showRewardedVideo({
                callbacks: {
                    onRewarded: () => {
                        Brawl.bridge.send("Reward", id);
                    }
                }
            });
        });
    }
};
</script>
<script>
/* =========================================================
   SAVE SYSTEM v4 (SECURE BASE)
   PART 3/5
   ========================================================= */

Brawl.save = {
    prefix: "brawl_v4_",
    version: "4.0"
};

/* =========================
   ACCOUNT SYSTEM
   ========================= */

Brawl.account = {
    get() {
        let n = localStorage.getItem("brawl_user");
        if (!n) {
            n = prompt("Username:") || "Player";
            localStorage.setItem("brawl_user", n);
        }
        return n;
    },

    set(name) {
        localStorage.setItem("brawl_user", name);
    }
};

/* =========================
   BASIC ENCODING (UPGRADED)
   ========================= */

Brawl.encode = function(data) {
    try {
        return btoa(JSON.stringify(data));
    } catch (e) {
        return null;
    }
};

Brawl.decode = function(data) {
    try {
        return JSON.parse(atob(data));
    } catch (e) {
        return null;
    }
};

/* =========================
   SAVE GAME
   ========================= */

Brawl.saveGame = function(data) {
    const user = this.account.get();

    const payload = {
        user,
        data,
        time: Date.now(),
        version: this.save.version
    };

    const encoded = this.encode(payload);

    localStorage.setItem(this.save.prefix + user, encoded);

    this.bridge.send("Save", payload);
};

/* =========================
   LOAD GAME
   ========================= */

Brawl.loadGame = function() {
    const user = this.account.get();

    const raw = localStorage.getItem(this.save.prefix + user);

    if (!raw) return null;

    return this.decode(raw);
};

/* =========================
   UI SAVE BUTTONS
   ========================= */

Brawl.initUI = function() {
    const box = document.createElement("div");
    box.style.position = "fixed";
    box.style.right = "10px";
    box.style.top = "10px";
    box.style.zIndex = 9999;

    const btn = (t, f) => {
        const b = document.createElement("button");
        b.innerText = t;
        b.onclick = f;
        b.style.display = "block";
        return b;
    };

    box.appendChild(btn("Switch", () => location.reload()));
    box.appendChild(btn("Export", () => this.exportSave()));

    document.body.appendChild(box);
};

/* =========================
   EXPORT
   ========================= */

Brawl.exportSave = function() {
    const data = this.loadGame();

    const blob = new Blob([JSON.stringify(data)], {
        type: "application/json"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "brawl_save.json";
    a.click();
};
</script>
<script>
/* =========================================================
   MONETIZATION v4
   PART 4/5
   ========================================================= */

Brawl.monetization = {};

/* =========================
   INTERSTITIAL ADS
   ========================= */

Brawl.monetization.interstitial = function() {
    return Brawl.callSDK(ysdk => {
        ysdk?.adv?.showFullscreenAdv();
    });
};

/* =========================
   REWARDED ADS SAFE
   ========================= */

Brawl.monetization.rewarded = function(id) {
    return Brawl.callSDK(ysdk => {
        ysdk?.adv?.showRewardedVideo({
            callbacks: {
                onRewarded: () => {
                    Brawl.bridge.send("Reward", id);
                }
            }
        });
    });
};

/* =========================
   LEADERBOARD
   ========================= */

Brawl.leaderboard = {};

Brawl.leaderboard.submit = function(table, score) {
    return Brawl.callSDK(ysdk => {
        ysdk?.leaderboards?.setScore(table, score);
    });
};

Brawl.leaderboard.get = function(table) {
    return Brawl.callSDK(async ysdk => {
        const res = await ysdk.leaderboards.getEntries(table, {
            quantityTop: 10
        });

        const parsed = res.entries.map(e => ({
            name: e.player.publicName || "anon",
            score: e.score
        }));

        Brawl.bridge.send("Leaderboard", parsed);

        return parsed;
    });
};
</script>
<script>
/* =========================================================
   FINAL BOOT v4
   PART 5/5
   ========================================================= */

Brawl.start = async function() {
    this._log("Starting full system...");

    await this.initSDK();

    this.initUI();

    this._log("Studio v4 fully loaded");

    this.events.emit("boot_complete", true);

    this.bridge.send("BootComplete", {
        version: this.core.version,
        mode: this.sdk.mode
    });
};

/* =========================
   PUBLIC API
   ========================= */

window.BrawlAPI = {
    init: cfg => Brawl.init(cfg),
    start: () => Brawl.start(),

    save: d => Brawl.saveGame(d),
    load: () => Brawl.loadGame(),

    ad: {
        interstitial: () => Brawl.monetization.interstitial(),
        rewarded: id => Brawl.monetization.rewarded(id)
    },

    leaderboard: {
        submit: (t, s) => Brawl.leaderboard.submit(t, s),
        get: t => Brawl.leaderboard.get(t)
    }
};

/* =========================
   AUTO START
   ========================= */

window.addEventListener("load", () => {
    Brawl._log("Auto booting v4...");

    Brawl.start();
});
</script>
