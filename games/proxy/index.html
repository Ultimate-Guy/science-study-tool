<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<title>Proxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: black;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Optional loading screen */
    #loader {
        position: absolute;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 20px;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="loader">Loading Game...</div>

<iframe id="gameFrame" allowfullscreen referrerpolicy="no-referrer"></iframe>

<script>
    // 🔵 CHANGE THIS URL TO EMBED ANY WEBSITE
    const websiteURL = "https://terbiumon.top/";

    const frame = document.getElementById("gameFrame");
    frame.src = websiteURL;

    // Hide loader when iframe is fully loaded
    frame.onload = function() {
        document.getElementById("loader").style.display = "none";
    };
</script>

</body>
</html>
