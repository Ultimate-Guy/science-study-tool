<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Proxy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: black;
        overflow: hidden;
    }

    #gameFrame {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Optional loading screen */
    #loader {
        position: absolute;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 20px;
        z-index: 10;
    }
</style>
</head>

<body>

<div id="loader">Loading Game...</div>

<iframe 
    id="gameFrame"
    allowfullscreen
    referrerpolicy="no-referrer">
</iframe>

<script>
    // 🔵 PUT YOUR GAME WEBSITE HERE
    const gameURL = "https://existence-proxy.dprabhav75.workers.dev/vcsefghfhreesgfdf.dfgrdcfhfgfds.bonded-game.com";

    const frame = document.getElementById("gameFrame");
    frame.src = gameURL;

    // Hide loading screen when loaded
    frame.onload = function() {
        document.getElementById("loader").style.display = "none";
    };
</script>

</body>
</html>
