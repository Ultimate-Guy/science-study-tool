name: Sequential Deploy Static Site

on:
  push:
    branches:
      - main  # change if your default branch is different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  step1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./   # root folder since it's static

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  step2:
    runs-on: ubuntu-latest
    needs: step1   # ensures step2 runs after step1 finishes successfully
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./  

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  step3:
    runs-on: ubuntu-latest
    needs: step2   # ensures step3 runs after step2 finishes successfully
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./  

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
