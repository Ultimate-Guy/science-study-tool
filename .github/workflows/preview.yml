name: PR Preview

on:
  pull_request:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "preview-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # -----------------------------
      # Setup Node
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # -----------------------------
      # Prepare build
      # -----------------------------
      - run: mkdir -p dist

      # -----------------------------
      # Build JS (simple, NO hashing)
      # -----------------------------
      - name: Build JS
        run: |
          for file in js/*.js; do
            mkdir -p dist/js
            esbuild "$file" --minify --outfile="dist/$file"
          done

      # -----------------------------
      # Build CSS
      # -----------------------------
      - name: Build CSS
        run: |
          for file in css/*.css; do
            mkdir -p dist/css
            esbuild "$file" --minify --outfile="dist/$file"
          done

      # -----------------------------
      # HTML
      # -----------------------------
      - name: Build HTML
        run: |
          for file in *.html; do
            cp "$file" "dist/$file"
          done

      # -----------------------------
      # Assets
      # -----------------------------
      - run: rsync -a imgs/ dist/imgs/
      - run: rsync -a fonts/ dist/fonts/

      # -----------------------------
      # Root files
      # -----------------------------
      - run: |
          cp favicon.ico dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - run: touch dist/.nojekyll

      # -----------------------------
      # Upload
      # -----------------------------
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # -----------------------------
      # Deploy preview
      # -----------------------------
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      # -----------------------------
      # Comment PR link
      # -----------------------------
      - uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deployment.outputs.page_url }}";
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview ready:\n${url}`
            });
