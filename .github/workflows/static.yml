name: Deploy static site

on:
  push:
    branches: ["main2"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # Setup Node
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------
      # Install esbuild
      # -----------------------------
      - run: npm install -g esbuild

      # -----------------------------
      # Prepare dist
      # -----------------------------
      - run: mkdir -p dist/assets

      # =========================================================
      # ⚡ BUILD JS + CSS WITH HASHING (IDENTICAL TO PREVIEW)
      # =========================================================
      - name: Build assets (hashed)
        run: |
          rm -f manifest.txt

          # JS
          for file in js/*.js; do
            name=$(basename "$file" .js)
            hash=$(sha1sum "$file" | cut -c1-8)
            out="dist/assets/${name}.${hash}.js"

            esbuild "$file" --minify --outfile="$out"

            echo "$file=$out" >> manifest.txt
          done

          # CSS
          for file in css/*.css; do
            name=$(basename "$file" .css)
            hash=$(sha1sum "$file" | cut -c1-8)
            out="dist/assets/${name}.${hash}.css"

            esbuild "$file" --minify --outfile="$out"

            echo "$file=$out" >> manifest.txt
          done

      # =========================================================
      # 🧠 HTML REWRITE (IDENTICAL TO PREVIEW)
      # =========================================================
      - name: Build HTML
        run: |
          for file in *.html; do
            out="dist/$file"
            cp "$file" "$out"

            while IFS="=" read -r src dest; do
              clean=$(echo "$dest" | sed 's|dist/||')
              sed -i "s|$src|$clean|g" "$out"
            done < manifest.txt

            # Remove comments
            sed -i '/<!--.*-->/d' "$out"

            # Compress
            tr -d '\n' < "$out" > tmp && mv tmp "$out"

            # HTML = NO CACHE
            sed -i 's|<head>|<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">|' "$out"
          done

      # -----------------------------
      # Static assets
      # -----------------------------
      - run: rsync -a imgs/ dist/imgs/
      - run: rsync -a fonts/ dist/fonts/

      # -----------------------------
      # Root files
      # -----------------------------
      - run: |
          cp 404.html dist/ 2>/dev/null || true
          cp favicon.ico dist/ 2>/dev/null || true

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - run: touch dist/.nojekyll

      # -----------------------------
      # Sitemap
      # -----------------------------
      - name: Sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > dist/sitemap.xml
          echo '<urlset>' >> dist/sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> dist/sitemap.xml
          done

          echo '</urlset>' >> dist/sitemap.xml

      # -----------------------------
      # Upload
      # -----------------------------
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # -----------------------------
      # Deploy
      # -----------------------------
      - uses: actions/deploy-pages@v4
