name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # =========================================================
      # ⚡ NODE TOOLING
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ CHANGE DETECTION
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          set +e
          git diff --name-only HEAD^ HEAD > changes.txt

          if [ $? -ne 0 ]; then
            echo "full=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -qE '^games/' changes.txt; then
            echo "games=true" >> $GITHUB_OUTPUT
          else
            echo "games=false" >> $GITHUB_OUTPUT
          fi

          if grep -qE '^css/|^js/|^index.html|^.*\.html$' changes.txt; then
            echo "core=true" >> $GITHUB_OUTPUT
          else
            echo "core=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ CLEAN BUILD
      # =========================================================
      - run: rm -rf dist && mkdir -p dist

      # =========================================================
      # 🧱 FULL FALLBACK
      # =========================================================
      - name: Full build fallback
        if: steps.changes.outputs.full == 'true'
        run: |
          echo "FULL BUILD (safe fallback)"

          mkdir -p dist/js dist/css dist/games dist/imgs dist/fonts

          esbuild js/*.js --minify --outdir=dist/js || true
          esbuild css/*.css --minify --outdir=dist/css || true

          cp *.html dist/ || true
          rsync -a games/ dist/games/ || true
          rsync -a imgs/ dist/imgs/ || true
          rsync -a fonts/ dist/fonts/ || true

      # =========================================================
      # ⚡ CORE ONLY
      # =========================================================
      - name: Core build
        if: steps.changes.outputs.full != 'true'
        run: |
          mkdir -p dist

          if [ "${{ steps.changes.outputs.core }}" = "true" ]; then
            echo "CORE UPDATED"
            esbuild js/*.js --minify --outdir=dist/js || true
            esbuild css/*.css --minify --outdir=dist/css || true
            cp *.html dist/ || true
          fi

      # =========================================================
      # 🎮 GAMES
      # =========================================================
      - name: Games sync
        if: steps.changes.outputs.games == 'true' && steps.changes.outputs.full != 'true'
        run: |
          echo "GAMES UPDATED ONLY"
          mkdir -p dist/games
          rsync -a games/ dist/games/

      # =========================================================
      # ⚡ ALWAYS REQUIRED FILES
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # ⚠️ HARD VALIDATION
      # =========================================================
      - name: Validate build
        run: |
          test -f dist/index.html || (echo "BROKEN BUILD: missing index.html" && exit 1)

      # =========================================================
      # ⚡ SINGLE ARTIFACT ONLY
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
