name: Deploy Static Site Incrementally

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout full repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Determine changed games
      - name: Determine changed games
        id: changes
        run: |
          GAMES_CHANGED=false
          CHANGED_GAMES=""

          # Only try git diff if HEAD has a parent
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_GAMES=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
            if [ -n "$CHANGED_GAMES" ]; then
              GAMES_CHANGED=true
            fi
          else
            # First commit → all games changed
            GAMES_CHANGED=true
            CHANGED_GAMES=$(ls games || true)
          fi

          echo "games_changed=$GAMES_CHANGED" >> $GITHUB_OUTPUT
          echo "changed_games=$CHANGED_GAMES" >> $GITHUB_OUTPUT

      # 3️⃣ Prepare public folder
      - name: Prepare public folder
        run: |
          mkdir -p public

          # Always copy top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            if [ -e "$asset" ]; then
              rsync -a "$asset" public/
            fi
          done

          # Copy games
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            for folder in ${{ steps.changes.outputs.changed_games }}; do
              mkdir -p public/games/$folder
              rsync -a "games/$folder/" "public/games/$folder/"
            done
          fi

      # 4️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 5️⃣ Deploy to GitHub Pages
      - name: Deploy
        uses: actions/deploy-pages@v4
