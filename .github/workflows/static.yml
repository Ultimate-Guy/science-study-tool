name: Deploy static website

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚡ Detect changed files (ULTRA FAST MODE)
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -E "\.html|\.css|\.js|content" changes.txt; then
            echo "run_ai=true" >> $GITHUB_OUTPUT
          else
            echo "run_ai=false" >> $GITHUB_OUTPUT
          fi

      # ⚡ Skip EVERYTHING if irrelevant changes
      - name: Skip if no AI-needed changes
        if: steps.changes.outputs.run_ai != 'true'
        run: echo "Skipping AI pipeline (no content changes)"

      # 📦 Node setup
      - name: Setup Node
        if: steps.changes.outputs.run_ai == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI
        if: steps.changes.outputs.run_ai == 'true'
        run: npm install openai fs

      # 📈 REAL SEO RANKING TRACKER (API HOOK)
      - name: SEO Ranking Tracker
        if: steps.changes.outputs.run_ai == 'true'
        env:
          SEO_API_KEY: ${{ secrets.SEO_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');

          // Replace with real API (SerpAPI / DataForSEO)
          const rankings = [
            { keyword: 'ai tools', position: Math.floor(Math.random()*10)+1 },
            { keyword: 'seo automation', position: Math.floor(Math.random()*10)+1 },
            { keyword: 'fast websites', position: Math.floor(Math.random()*10)+1 }
          ];

          fs.writeFileSync('seo-rankings.json', JSON.stringify(rankings,null,2));
          "
      
      # 🧠 AI STRATEGY ENGINE
      - name: AI Strategy Engine
        if: steps.changes.outputs.run_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          async function run() {
            const rankings = JSON.parse(fs.readFileSync('seo-rankings.json','utf8'));

            const prompt =
              'You are an SEO expert. Based on rankings: ' +
              JSON.stringify(rankings) +
              ' generate: 5 keywords, 3 blog topics, and 3 page titles.';

            const res = await client.chat.completions.create({
              model: 'gpt-4o-mini',
              messages: [{ role: 'user', content: prompt }]
            });

            fs.writeFileSync('strategy.json', res.choices[0].message.content);
          }

          run();
          "

      # ✍️ MULTI-PAGE BUILDER (CORE FEATURE)
      - name: Multi-page AI Builder
        if: steps.changes.outputs.run_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          async function run() {
            const strategy = fs.readFileSync('strategy.json','utf8');

            const pages = [
              'homepage',
              'blog',
              'tools',
              'seo-guide'
            ];

            for (const page of pages) {
              const res = await client.chat.completions.create({
                model: 'gpt-4o-mini',
                messages: [{
                  role: 'user',
                  content:
                    'Create a FULL SEO HTML page for: ' + page +
                    ' using this strategy: ' + strategy +
                    ' Return ONLY valid HTML.'
                }]
              });

              fs.writeFileSync('pages/' + page + '.html', res.choices[0].message.content);
            }
          }

          run();
          "

      # ⚡ SMART SEO PATCH (lightweight)
      - name: SEO Fixer
        run: |
          node -e "
          const fs = require('fs');
          const files = fs.existsSync('pages') ? fs.readdirSync('pages') : [];

          for (const f of files) {
            let html = fs.readFileSync('pages/' + f,'utf8');

            if (!html.includes('meta name=\"description\"')) {
              html = html.replace('<head>',
                '<head><meta name=\"description\" content=\"AI generated SEO page\">');
            }

            fs.writeFileSync('pages/' + f, html);
          }
          "

      # ⚡ ULTRA FAST DEPLOY OPTIMIZATION
      - name: Prepare output
        run: |
          mkdir -p dist
          cp -r pages/* dist/ || true
          cp index.html dist/ || true
          cp sitemap.xml dist/ || true

      # 🌍 SITEMAP GENERATOR (MULTI PAGE)
      - name: Sitemap generator
        run: |
          SITE="https://your-username.github.io/your-repo"

          echo '<?xml version="1.0"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          for file in $(find dist -name "*.html"); do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      # 📁 Required
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # 📦 Upload ONLY dist (ultra fast mode)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 🚀 Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
