name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Optimized Checkout
        uses: actions/checkout@v4
        with:
          # Blobless clone avoids downloading 3.7GB of history
          filter: 'blob:none'
          # Explicitly include lockfiles so "Setup Node" doesn't crash
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            package.json
            package-lock.json
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        # Installs esbuild and your prompts fast from the lockfile
        run: npm ci 

      - name: Fast Build and Sync
        run: |
          mkdir -p staging/js
          
          # Bundle JS using the lightning-fast esbuild
          npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error
          
          # Hard Linking: Instantly links 3.7GB of files into staging without 
          # duplicating data on disk. Skips node_modules and config files.
          find . -maxdepth 1 -not -path '*/.*' -not -path './staging' -not -path './js' -not -path './node_modules' -not -path './package*' -exec cp -rl {} staging/ \;

      - name: Safety Check
        run: |
          # Blocks deploy if index.html is missing or corrupted
          if [ ! -s staging/index.html ] || ! grep -q "</body>" staging/index.html; then
            echo "Critical Error: index.html missing or corrupted."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
