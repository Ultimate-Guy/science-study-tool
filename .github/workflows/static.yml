name: Deploy Static Site Ultra-Fast Cached

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Restore cache for public folder
      - name: Restore public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-cache-${{ github.sha }}
          restore-keys: |
            public-cache-

      # 3️⃣ Determine changed files
      - name: Get changed files
        id: changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED_FILES=$(git ls-files)
          fi
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      # 4️⃣ Prepare public folder incrementally
      - name: Prepare public folder
        run: |
          mkdir -p public

          # Top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "^$asset"; then
              rsync -au "$asset" public/
            fi
          done

          # Incremental game files
          mkdir -p public/games
          for file in ${{ steps.changes.outputs.changed_files }}; do
            if [[ $file == games/* ]]; then
              rsync -R "$file" public/
            fi
          done

          # Ensure new games exist
          for folder in games/*; do
            NAME=$(basename "$folder")
            if [ ! -d "public/games/$NAME" ]; then
              rsync -a "$folder/" "public/games/$NAME/"
            fi
          done

      # 5️⃣ Save cache for next build
      - name: Save public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-cache-${{ github.sha }}

      # 6️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 7️⃣ Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
