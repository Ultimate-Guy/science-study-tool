name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 'treeless' clone is often faster than 'blobless' for massive static file counts
          filter: 'tree:0'
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # CRITICAL: Compression level 0 is mandatory for 2GB+ to prevent runner timeout
          compression-level: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
