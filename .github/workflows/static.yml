name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout full repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Compute top-level asset changes
      - name: Determine changed top-level assets
        id: top_changes
        run: |
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          CHANGED_ASSETS=""
          for asset in $ASSETS; do
            if git diff --name-only HEAD^ HEAD | grep -q "^$asset"; then
              CHANGED_ASSETS="$CHANGED_ASSETS $asset"
            fi
          done
          echo "changed_assets=$CHANGED_ASSETS" >> $GITHUB_OUTPUT

      # 3️⃣ Prepare public folder
      - name: Prepare public folder
        run: |
          mkdir -p public

          # 3a. Copy only changed top-level assets
          for asset in ${{ steps.top_changes.outputs.changed_assets }}; do
            rsync -au "$asset" public/
          done

          # 3b. Deploy games incrementally using hashes
          mkdir -p public/games
          mkdir -p .game_hashes

          for folder in games/*; do
            NAME=$(basename "$folder")
            HASH=$(find "$folder" -type f -exec sha1sum {} \; | sha1sum | awk '{print $1}')
            HASH_FILE=".game_hashes/$NAME.hash"

            # If hash changed or new game, deploy
            if [ ! -f "$HASH_FILE" ] || [ "$(cat $HASH_FILE)" != "$HASH" ]; then
              rsync -a "$folder/" "public/games/$NAME/"
              echo "$HASH" > "$HASH_FILE"
            fi
          done

      # 4️⃣ Upload artifact (always present)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 5️⃣ Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
