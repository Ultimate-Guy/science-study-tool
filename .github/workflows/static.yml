name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Determine changed files
      - name: Get changed files
        id: changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED_FILES=$(git ls-files)
          fi
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      # 3️⃣ Deploy top-level assets (cached)
      - name: Deploy top-level assets
        uses: actions/cache@v3
        with:
          path: public_top
          key: top-assets-${{ github.sha }}
          restore-keys: top-assets-
      - run: |
          mkdir -p public
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "^$asset"; then
              rsync -au "$asset" public/
            elif [ -e "public_top/$asset" ]; then
              rsync -au "public_top/$asset" public/
            fi
          done
          cp -r public/* public_top/

      # 4️⃣ Deploy games incrementally, per-folder caching
      - name: Deploy changed games
        run: |
          mkdir -p public/games
          for folder in games/*; do
            NAME=$(basename "$folder")
            CACHE_KEY="game-${NAME}-${{ github.sha }}"

            # Check if folder has changes or new
            if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "^games/$NAME/"; then
              # Use rsync to copy changed files only
              rsync -au "$folder/" "public/games/$NAME/"
            elif [ ! -d "public/games/$NAME" ]; then
              # New game folder
              rsync -a "$folder/" "public/games/$NAME/"
            fi
          done

      # 5️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 6️⃣ Deploy
      - name: Deploy
        uses: actions/deploy-pages@v4
