name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (Reliable + Fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ✅ full history (fixes edge cases)
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      - name: Assemble Site
        run: |
          mkdir -p staging

          rsync -a --delete \
            index.html 404.html favicon.ico config.jsonc \
            css js imgs fonts games \
            staging/

      - name: Safety Check
        run: |
          echo "🔍 Running safety checks..."

          # HTML check
          if [ ! -s staging/index.html ] || ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html missing or malformed"
            exit 1
          fi

          # Config check (allow either config.js OR config.jsonc)
          if [ ! -s staging/config.jsonc ] && [ ! -f staging/js/config.js ]; then
            echo "❌ No config found (config.jsonc or config.js)"
            exit 1
          fi

          # JS check
          if ! find staging/js -type f -name "*.js" -print -quit | grep -q .; then
            echo "❌ No JS files found"
            exit 1
          fi

          # Core folders check
          for folder in css imgs fonts games; do
            if [ ! -d staging/$folder ]; then
              echo "❌ Missing folder: $folder"
              exit 1
            fi
          done

          echo "✅ All checks passed"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
