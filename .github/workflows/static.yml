name: Deploy static site

on:
  push:
    branches: ["main2", "staging"]
  pull_request:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔍 Detect changes (incremental logic)
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '**/*.html'
              - '**/*.css'
              - '**/*.js'
              - 'assets/**'
              - 'images/**'

      # 🧠 Version system
      - name: Generate version
        if: steps.filter.outputs.changed == 'true'
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

      # 📦 Build site
      - name: Build site
        if: steps.filter.outputs.changed == 'true'
        run: |
          rm -rf dist
          mkdir -p dist assets images

          # Ensure homepage exists
          if [ -f index.html ]; then
            cp index.html dist/
          else
            echo "<h1>Home Page</h1><p>Auto-generated</p>" > dist/index.html
          fi

          cp -r assets dist/ 2>/dev/null || true
          cp -r images dist/ 2>/dev/null || true

      # 🧭 Auto sitemap generator
      - name: Generate sitemap
        if: steps.filter.outputs.changed == 'true'
        run: |
          SITE="https://YOUR_USERNAME.github.io/YOUR_REPO"

          echo '<?xml version="1.0"?>' > dist/sitemap.xml
          echo '<urlset>' >> dist/sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> dist/sitemap.xml
          done

          echo '</urlset>' >> dist/sitemap.xml

      # ⚡ Cache busting
      - name: Cache busting
        if: steps.filter.outputs.changed == 'true'
        run: |
          VERSION="${{ env.VERSION }}"

          find dist -name "*.html" | while read file; do
            sed -i "s/\.css/\.css?v=$VERSION/g" "$file" || true
            sed -i "s/\.js/\.js?v=$VERSION/g" "$file" || true
          done

      # 📁 GitHub Pages requirement
      - name: No Jekyll
        if: steps.filter.outputs.changed == 'true'
        run: touch dist/.nojekyll

      # ⚙️ Setup Pages
      - name: Setup Pages
        if: steps.filter.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      # 📦 Upload production artifact
      - name: Upload production artifact
        if: steps.filter.outputs.changed == 'true' && github.ref_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 📦 Upload PR preview artifact (SAFE PREVIEW SYSTEM)
      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.number }}
          path: dist


  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true

    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: echo "Live site: ${{ steps.deploy.outputs.page_url }}"
