name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo fully
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Detect changes
      - name: Determine changed games and top-level files
        id: changes
        run: |
          GAMES_CHANGED=false
          CHANGED_GAMES=""
          CHANGED_TOPLEVEL=""

          # Only try git diff if there is a parent
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # Changed games
            CHANGED_GAMES=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
            if [ -n "$CHANGED_GAMES" ]; then
              GAMES_CHANGED=true
            fi

            # Changed top-level site files
            CHANGED_TOPLEVEL=$(git diff --name-only HEAD^ HEAD | grep -E '^(index\.html|404\.html|favicon\.ico|config\.jsonc|css/|js/|fonts/|imgs/)' || true)
          else
            # First commit → everything changed
            GAMES_CHANGED=true
            CHANGED_GAMES=$(ls games || true)
            CHANGED_TOPLEVEL="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          fi

          echo "games_changed=$GAMES_CHANGED" >> $GITHUB_OUTPUT
          echo "changed_games=$CHANGED_GAMES" >> $GITHUB_OUTPUT
          echo "changed_toplevel=$CHANGED_TOPLEVEL" >> $GITHUB_OUTPUT

      # Step 3: Sparse checkout only changed files
      - name: Sparse checkout changed files
        run: |
          git sparse-checkout init --cone
          BASE="$GITHUB_WORKSPACE"
          # Always include top-level assets
          BASE_PATHS="index.html 404.html favicon.ico config.jsonc css js imgs fonts"

          # Add only changed top-level files
          if [ -n "${{ steps.changes.outputs.changed_toplevel }}" ]; then
            git sparse-checkout set $BASE_PATHS ${{ steps.changes.outputs.changed_toplevel }}
          else
            git sparse-checkout set $BASE_PATHS
          fi

          # Add only changed game folders
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ] && [ -n "${{ steps.changes.outputs.changed_games }}" ]; then
            GAME_PATHS=$(echo "${{ steps.changes.outputs.changed_games }}" | sed 's/^/games\//g')
            git sparse-checkout set $BASE_PATHS $GAME_PATHS
          fi

      # Step 4: Prepare deploy folder
      - name: Prepare deploy folder
        run: |
          mkdir -p public
          # Copy changed top-level files
          for path in ${{ steps.changes.outputs.changed_toplevel }}; do
            if [ -e "$path" ]; then
              rsync -a "$path" public/
            fi
          done

          # Copy changed games
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            for folder in ${{ steps.changes.outputs.changed_games }}; do
              mkdir -p public/games/$folder
              rsync -a "games/$folder/" "public/games/$folder/"
            done
          fi

      # Step 5: Upload to Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # Step 6: Deploy
      - name: Deploy
        uses: actions/deploy-pages@v4
