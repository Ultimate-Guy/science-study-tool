name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # =========================================================
      # ⚡ CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ NODE
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ BUILD CORE DIST
      # =========================================================
      - name: Prepare core dist
        run: |
          rm -rf dist-core
          mkdir -p dist-core/js dist-core/css dist-core/imgs dist-core/fonts

      # =========================================================
      # ⚡ CHANGE DETECTION
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          set +e
          git diff --name-only HEAD~1 HEAD > changes.txt || true

          if [ ! -s changes.txt ]; then
            echo "full=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          grep -q '^games/' changes.txt && echo "games=true" >> $GITHUB_OUTPUT || echo "games=false" >> $GITHUB_OUTPUT

      # =========================================================
      # ⚡ JS
      # =========================================================
      - name: JS build
        run: |
          if ls js/*.js 1> /dev/null 2>&1; then
            esbuild js/*.js --minify --outdir=dist-core/js || true
          fi

      # =========================================================
      # ⚡ CSS
      # =========================================================
      - name: CSS build
        run: |
          if ls css/*.css 1> /dev/null 2>&1; then
            esbuild css/*.css --minify --outdir=dist-core/css || true
          fi

      # =========================================================
      # ⚡ STATIC FILES
      # =========================================================
      - name: Copy core files
        run: |
          cp *.html dist-core/ 2>/dev/null || true
          cp index.html dist-core/ 2>/dev/null || true
          cp 404.html dist-core/ 2>/dev/null || true

          rsync -a imgs/ dist-core/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist-core/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE CORE
      # =========================================================
      - name: Finalize core
        run: |
          cp favicon.ico dist-core/ 2>/dev/null || true
          touch dist-core/.nojekyll

      # =========================================================
      # 🧪 VALIDATION
      # =========================================================
      - name: Validate core
        run: |
          test -f dist-core/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 UPLOAD CORE ARTIFACT
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          name: core
          path: dist-core

  build-games:
    runs-on: ubuntu-latest

    needs: build-core
    if: contains(github.event.head_commit.message, '[games]')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare games dist
        run: |
          rm -rf dist-games
          mkdir -p dist-games/games

      - name: Sync games only
        run: |
          rsync -a games/ dist-games/games/ || true

      - name: Upload games artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: games
          path: dist-games

  deploy:
    needs: build-core
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
