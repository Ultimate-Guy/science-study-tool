name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Strip Repo to Essentials
        # This deletes every file NOT needed for the website to run.
        # Reducing the file count is the ONLY way to speed up the 'finalizing' freeze.
        run: |
          rm -rf .git .github .gitignore .prettierignore .prettierrc \
                 README.md package.json package-lock.json jsconfig.json \
                 build-config.js add-game-entry.js LICENSE
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Compression 0 is vital here. 
          # It trades a larger upload for 0% CPU usage on the runner.
          compression-level: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
