name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ ULTRA FAST CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ DETECT HEAVY CHANGE (KEY OPTIMIZATION)
      # =========================================================
      - name: Detect heavy changes
        id: mode
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '^games/|^css/|^js/'; then
            echo "heavy=true" >> $GITHUB_OUTPUT
          else
            echo "heavy=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ NODE + ESBUILD
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ CLEAN DIST
      # =========================================================
      - run: rm -rf dist && mkdir -p dist

      # =========================================================
      # 🟢 FAST PATH (DEFAULT)
      # =========================================================
      - name: Fast build
        if: steps.mode.outputs.heavy == 'false'
        run: |
          echo "FAST MODE (target < 1 min)"

          cp *.html dist/ || true
          rsync -a imgs/ dist/imgs/
          rsync -a fonts/ dist/fonts/

      # =========================================================
      # 🔴 HEAVY PATH (ONLY WHEN NEEDED)
      # =========================================================
      - name: Heavy build
        if: steps.mode.outputs.heavy == 'true'
        run: |
          echo "HEAVY MODE (games/css/js changed)"

          mkdir -p dist/js dist/css

          esbuild js/*.js --minify --outdir=dist/js
          esbuild css/*.css --minify --outdir=dist/css

          cp *.html dist/ || true

          rsync -a imgs/ dist/imgs/
          rsync -a fonts/ dist/fonts/
          rsync -a games/ dist/games/

      # =========================================================
      # ⚡ ROOT FILES
      # =========================================================
      - run: cp favicon.ico dist/ 2>/dev/null || true
      - run: cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # ⚡ STATIC OPTIMIZATION
      # =========================================================
      - run: touch dist/.nojekyll

      # =========================================================
      # ⚡ DEPLOY
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
