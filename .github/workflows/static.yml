name: Deploy static site

on:
  push:
    branches: ["main2"]
    paths:
      - "**"
      - "!*.md"
      - "!LICENSE"
      - "!package.json"
      - "!package-lock.json"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Setup GitHub Pages
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Generate version (FAST + scoped)
      # -----------------------------
      - name: Generate version
        run: |
          VERSION=$(find ./css ./js -type f \( -name "*.css" -o -name "*.js" \) -exec sha1sum {} + | sha1sum | cut -c1-8)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # -----------------------------
      # Cache busting (SAFE)
      # -----------------------------
      - name: Cache busting
        run: |
          VERSION="${{ env.VERSION }}"

          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep "\.html$" || true)

          # fallback if diff fails (first commit, etc.)
          if [ -z "$FILES" ]; then
            FILES=$(find . -name "*.html")
          fi

          for file in $FILES; do
            [ -f "$file" ] || continue

            # Only modify proper HTML asset tags
            sed -i -E "s/(href=\"[^\"]+\.css)(\?v=[^\"]*)?\"/\1?v=$VERSION\"/g" "$file"
            sed -i -E "s/(src=\"[^\"]+\.js)(\?v=[^\"]*)?\"/\1?v=$VERSION\"/g" "$file"
          done

      # -----------------------------
      # Generate sitemap
      # -----------------------------
      - name: Generate sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          find . -name "*.html" | while read file; do
            clean=${file#./}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - name: Disable Jekyll
        run: touch .nojekyll

      # -----------------------------
      # Prepare clean deploy folder (FASTER)
      # -----------------------------
      - name: Prepare build folder
        run: |
          mkdir dist
          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="package*.json" \
            --exclude="README.md" \
            --exclude="LICENSE" \
            ./ dist/

      # -----------------------------
      # Upload artifact (smaller)
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # -----------------------------
      # Deploy
      # -----------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
