name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed_top_assets: ${{ steps.set-output.outputs.top_assets }}
      changed_games: ${{ steps.set-output.outputs.games }}
    steps:
      - name: Checkout repository sparse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse: true
          # only top-level files and folders we care about initially
          # games folder will be selectively added later
          paths: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            fonts
            imgs

      - name: Restore public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}
          restore-keys: public-${{ github.ref }}-

      - name: Detect changed files
        id: set-output
        run: |
          # Top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          TOP_CHANGED=""
          for asset in $ASSETS; do
            if git diff --name-only HEAD^ HEAD | grep -q "^$asset"; then
              TOP_CHANGED="$TOP_CHANGED $asset"
            fi
          done

          # Detect changed game folders
          GAMES_CHANGED=""
          for folder in games/*; do
            NAME=$(basename "$folder")
            if git diff --name-only HEAD^ HEAD | grep -q "^games/$NAME/"; then
              GAMES_CHANGED="$GAMES_CHANGED $NAME"
            fi
          done

          echo "top_assets=$TOP_CHANGED" >> $GITHUB_OUTPUT
          echo "games=$GAMES_CHANGED" >> $GITHUB_OUTPUT

  deploy_top_assets:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.changed_top_assets != '' }}
    steps:
      - name: Checkout repository sparse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse: true
          paths: ${{ needs.prepare.outputs.changed_top_assets }}

      - name: Deploy top-level assets
        run: |
          mkdir -p public
          for asset in ${{ needs.prepare.outputs.changed_top_assets }}; do
            rsync -au "$asset" public/
          done

  deploy_games:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game: [${{ needs.prepare.outputs.games }}]
      fail-fast: false
    steps:
      - name: Checkout specific game folder sparse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse: true
          paths: "games/${{ matrix.game }}"

      - name: Deploy changed game folder
        run: |
          mkdir -p public/games
          rsync -a "games/${{ matrix.game }}/" "public/games/${{ matrix.game }}/"

  finalize:
    needs: [deploy_top_assets, deploy_games]
    runs-on: ubuntu-latest
    steps:
      - name: Save public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
