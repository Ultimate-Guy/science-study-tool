name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Optimized Checkout
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            package.json
            package-lock.json
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false 

      - name: Detect JS changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 | grep -E '^(js/|package-lock.json|package.json)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Build and Sync
        run: |
          set -euo pipefail

          mkdir -p staging/js

          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            ./node_modules/.bin/esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error &
          fi

          rsync -a --exclude=node_modules \
                    --exclude=js \
                    --exclude=staging \
                    --exclude="package*" \
                    ./ staging/

          wait || true

      - name: Safety Check
        run: |
          set -euo pipefail

          if [ ! -s staging/index.html ] || \
             ! grep -q "</html>" staging/index.html || \
             ! grep -q "<head>" staging/index.html; then
            echo "Critical Error: index.html missing or malformed."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
