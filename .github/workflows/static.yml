name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ultra-Fast Checkout
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 2
          clean: false
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # 🔥 Skip if nothing important changed
      - name: Detect changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 | grep -E '^(index.html|404.html|favicon.ico|config.jsonc|css/|js/|imgs/|fonts/|games/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop early if no changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "⚡ No relevant changes — skipping deploy"
          exit 0

      - name: Assemble Site (FAST + STABLE)
        run: |
          mkdir -p staging

          # ✅ Only copy required files (prevents rsync crash)
          rsync -a --delete --ignore-missing-args \
            index.html 404.html favicon.ico config.jsonc \
            css js imgs fonts games \
            staging/

      - name: Safety Check (STRICT)
        run: |
          # HTML check
          if [ ! -s staging/index.html ] || ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html missing or malformed"
            exit 1
          fi

          # Config check
          if [ ! -s staging/config.jsonc ]; then
            echo "❌ config.jsonc missing"
            exit 1
          fi

          # JS check
          if ! find staging/js -type f -print -quit | grep -q .; then
            echo "❌ JS missing → site would break"
            exit 1
          fi

          # Core folders check
          for folder in css imgs fonts games; do
            if [ ! -d staging/$folder ]; then
              echo "❌ Missing folder: $folder"
              exit 1
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
