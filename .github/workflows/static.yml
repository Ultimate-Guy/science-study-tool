name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # Sparse checkout only necessary files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # Upload main site (non-games) as artifact
      - name: Upload main site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
          compression-level: 0

      # Upload games in chunks safely
      - name: Upload games in chunks
        run: |
          CHUNK_SIZE=1800000000  # ~1.8GB per artifact
          CHUNK_NUM=1
          CURRENT_SIZE=0
          mkdir -p temp-chunk

          for game in games/*; do
            SIZE=$(du -s -B1 "$game" | cut -f1)
            if [ $((CURRENT_SIZE + SIZE)) -gt $CHUNK_SIZE ]; then
              echo "Uploading chunk-$CHUNK_NUM"
              # Upload chunk artifact
              actions/upload-pages-artifact@v3 --path temp-chunk --name "chunk-$CHUNK_NUM" --compression-level 0
              CHUNK_NUM=$((CHUNK_NUM + 1))
              CURRENT_SIZE=0
              rm -rf temp-chunk
              mkdir -p temp-chunk
            fi
            cp -r "$game" temp-chunk/
            CURRENT_SIZE=$((CURRENT_SIZE + SIZE))
          done

          # Upload the last chunk if it exists
          if [ "$(ls -A temp-chunk)" ]; then
            echo "Uploading final chunk-$CHUNK_NUM"
            actions/upload-pages-artifact@v3 --path temp-chunk --name "chunk-$CHUNK_NUM" --compression-level 0
          fi

      # Deploy all artifacts to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
