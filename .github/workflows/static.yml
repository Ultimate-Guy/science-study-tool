name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo with minimal history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # Cache node_modules
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build your site (if you have a build step)
      - name: Build site
        run: |
          # Example: if you have a build script
          if [ -f package.json ]; then
            npm run build || echo "No build script, skipping"
          fi

      # Setup Git for deployment
      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Deploy incrementally to gh-pages
      - name: Deploy to gh-pages (incremental & safe)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./          # root of repo
          publish_branch: gh-pages
          keep_files: true         # don't delete existing games
          force_orphan: true       # avoid .git conflicts
          incremental: true        # only upload changed files
