name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ✅ fetch all commits to safely diff
          filter: blob:none

      - name: Determine changed games
        id: changes
        run: |
          # Default values
          CHANGED=""
          GAMES_CHANGED=false

          # Only try git diff if HEAD has a parent
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # Get top-level folders under games that changed
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
            if [ -n "$CHANGED" ]; then
              GAMES_CHANGED=true
            fi
          else
            # First commit or single-commit branch → all games considered changed
            CHANGED=$(ls games)
            GAMES_CHANGED=true
          fi

          # Export to workflow outputs
          echo "games_changed=$GAMES_CHANGED" >> $GITHUB_OUTPUT
          echo "changed_folders=$CHANGED" >> $GITHUB_OUTPUT

      - name: Sparse checkout
        run: |
          git sparse-checkout init --cone
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            git sparse-checkout set index.html 404.html favicon.ico config.jsonc css js imgs fonts $(echo "${{ steps.changes.outputs.changed_folders }}" | sed 's/^/games\//g')
          else
            git sparse-checkout set index.html 404.html favicon.ico config.jsonc css js imgs fonts
          fi

      - name: Prepare deploy folder
        run: |
          mkdir -p public
          rsync -a index.html 404.html favicon.ico config.jsonc css js imgs fonts public/

          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            for folder in ${{ steps.changes.outputs.changed_folders }}; do
              mkdir -p public/games/$folder
              rsync -a games/$folder/ public/games/$folder/
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        uses: actions/deploy-pages@v4
