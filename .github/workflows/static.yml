name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ SPARSE CHECKOUT (HUGE SPEED BOOST FOR 3.8GB REPO)
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            *.html
            js
            css
            imgs
            fonts
            games
            favicon.ico
          sparse-checkout-cone-mode: true

      # =========================================================
      # ⚡ CHANGE DETECTION (SUPER LIGHT)
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -qE '^js/|^css/' changes.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ NODE ONLY IF NEEDED
      # =========================================================
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 22

      - name: Install esbuild
        if: steps.changes.outputs.frontend == 'true'
        run: npm install -g esbuild

      # =========================================================
      # ⚡ PREP DIST
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist

      # =========================================================
      # ⚡ JS
      # =========================================================
      - name: Build JS
        if: steps.changes.outputs.frontend == 'true'
        run: esbuild js/*.js --minify --outdir=dist/js

      - name: Copy JS
        if: steps.changes.outputs.frontend != 'true'
        run: rsync -a js/ dist/js/ 2>/dev/null || true

      # =========================================================
      # ⚡ CSS
      # =========================================================
      - name: Build CSS
        if: steps.changes.outputs.frontend == 'true'
        run: esbuild css/*.css --minify --outdir=dist/css

      - name: Copy CSS
        if: steps.changes.outputs.frontend != 'true'
        run: rsync -a css/ dist/css/ 2>/dev/null || true

      # =========================================================
      # ⚡ STATIC FILES (FAST RSYNC)
      # =========================================================
      - name: Copy HTML
        run: rsync -a *.html dist/ 2>/dev/null || true

      - name: Games
        run: rsync -a --delete games/ dist/games/ 2>/dev/null || true

      - name: Assets
        run: |
          rsync -a imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATION
      # =========================================================
      - name: Validate
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 UPLOAD
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
