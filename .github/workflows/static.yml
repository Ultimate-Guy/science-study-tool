name: Deploy static website

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 Always ensure folders exist (prevents silent failure)
      - name: Init folders
        run: |
          mkdir -p pages
          mkdir -p dist
          mkdir -p backup

      # ⚡ Detect changes
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -E "\.html|\.css|\.js|content" changes.txt; then
            echo "run_ai=true" >> $GITHUB_OUTPUT
          else
            echo "run_ai=false" >> $GITHUB_OUTPUT
          fi

      # 🧱 Fallback page (NEVER allow empty site)
      - name: Create fallback page
        run: |
          echo "<h1>Site is generating...</h1>" > pages/index.html

      # 📦 Node setup
      - name: Setup Node
        if: steps.changes.outputs.run_ai == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI
        if: steps.changes.outputs.run_ai == 'true'
        run: npm install openai fs

      # 🧠 SEO ranking (safe mock / API-ready)
      - name: SEO Ranking Tracker
        if: steps.changes.outputs.run_ai == 'true'
        run: |
          node -e "
          const fs = require('fs');

          const rankings = [
            { keyword: 'ai tools', position: 3 },
            { keyword: 'seo automation', position: 7 },
            { keyword: 'fast websites', position: 2 }
          ];

          fs.writeFileSync('seo.json', JSON.stringify(rankings,null,2));
          "

      # 🧠 AI Strategy
      - name: AI Strategy Engine
        if: steps.changes.outputs.run_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          async function run() {
            const rankings = fs.readFileSync('seo.json','utf8');

            const prompt =
              'Generate SEO strategy based on: ' + rankings +
              '. Return keywords, blog topics, page names.';

            const res = await client.chat.completions.create({
              model: 'gpt-4o-mini',
              messages: [{ role: 'user', content: prompt }]
            });

            fs.writeFileSync('strategy.json', res.choices[0].message.content);
          }

          run();
          "

      # ✍️ MULTI PAGE BUILDER (SAFE)
      - name: Multi-page Builder
        if: steps.changes.outputs.run_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          async function run() {
            const strategy = fs.readFileSync('strategy.json','utf8');

            const pages = ['index', 'blog', 'tools', 'guide'];

            for (const p of pages) {
              const res = await client.chat.completions.create({
                model: 'gpt-4o-mini',
                messages: [{
                  role: 'user',
                  content:
                    'Create SEO HTML page for ' + p +
                    ' using strategy: ' + strategy +
                    '. Return ONLY HTML.'
                }]
              });

              fs.writeFileSync('pages/' + p + '.html', res.choices[0].message.content);
            }
          }

          run();
          "

      # 🔥 VALIDATION (CRITICAL FAIL-SAFE)
      - name: Validate build output
        run: |
          if [ -z "$(ls -A pages 2>/dev/null)" ]; then
            echo "❌ pages empty, using fallback"
            cp pages/index.html dist/index.html
          else
            echo "✅ pages OK"
          fi

      # 📦 Prepare dist safely
      - name: Build dist
        run: |
          rsync -av pages/ dist/

      # 💾 BACKUP LAST WORKING VERSION
      - name: Backup current build
        run: |
          if [ -d "dist" ]; then
            rm -rf backup/*
            cp -r dist/* backup/ || true
          fi

      # 🔁 ROLLBACK IF BROKEN
      - name: Auto rollback check
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build broken, restoring backup"
            rm -rf dist/*
            cp -r backup/* dist/ || true
          fi

      # 🌍 SITEMAP
      - name: Sitemap generator
        run: |
          SITE="https://your-username.github.io/your-repo"

          echo '<?xml version="1.0"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          for file in $(find dist -name "*.html"); do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

          cp sitemap.xml dist/

      # 📁 REQUIRED
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # 📦 Upload
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 🚀 Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
