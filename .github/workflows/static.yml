name: Deploy Static Site Ultra-Fast File-Level

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Determine changed files
      - name: Get changed files
        id: changes
        run: |
          # Detect changes compared to previous commit, fallback to all files on first commit
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED_FILES=$(git ls-files)
          fi

          # Save outputs
          echo "changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      # 3️⃣ Prepare public folder
      - name: Prepare public folder
        run: |
          mkdir -p public

          # Top-level assets to always copy
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "^$asset"; then
              rsync -au "$asset" public/
            fi
          done

          # Deploy changed game files only
          mkdir -p public/games
          for file in ${{ steps.changes.outputs.changed_files }}; do
            if [[ $file == games/* ]]; then
              # Copy using relative path to preserve folder structure
              rsync -R "$file" public/
            fi
          done

          # Ensure any new games get copied fully (first commit or new folder)
          for folder in games/*; do
            NAME=$(basename "$folder")
            if [ ! -d "public/games/$NAME" ]; then
              rsync -a "$folder/" "public/games/$NAME/"
            fi
          done

      # 4️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 5️⃣ Deploy
      - name: Deploy
        uses: actions/deploy-pages@v4
