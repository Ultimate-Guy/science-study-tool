name: Deploy static website

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 Init folders (always safe)
      - name: Init workspace
        run: |
          mkdir -p pages
          mkdir -p dist
          mkdir -p backup
          mkdir -p preview

      # ⚡ Detect changes (safe fallback always runs AI for stability)
      - name: Detect changes
        id: changes
        run: |
          echo "run_ai=true" >> $GITHUB_OUTPUT

      # 🧱 Fallback page (NEVER allow empty deploy)
      - name: Fallback page
        run: |
          echo "<h1>Site is building...</h1>" > pages/index.html

      # 📦 Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI
        run: npm install openai

      # 🧠 SAFE AI GENERATOR (NO CRASH VERSION)
      - name: AI Multi-page Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          function safeJSON(str) {
            try {
              return JSON.parse(str);
            } catch (e) {
              const match = str.match(/\{[\s\S]*\}/);
              if (!match) {
                return {
                  index: "<h1>Fallback Index</h1>",
                  blog: "<h1>Blog</h1>",
                  tools: "<h1>Tools</h1>",
                  guide: "<h1>Guide</h1>"
                };
              }
              return JSON.parse(match[0]);
            }
          }

          async function run() {
            try {
              const res = await client.chat.completions.create({
                model: "gpt-4o-mini",
                messages: [{
                  role: "user",
                  content:
`Return ONLY JSON:
{
  "index": "<html>",
  "blog": "<html>",
  "tools": "<html>",
  "guide": "<html>"
}

Rules:
- no markdown
- no explanation
- valid HTML only`
                }]
              });

              const data = safeJSON(res.choices[0].message.content || "");

              fs.mkdirSync("pages", { recursive: true });

              for (const k in data) {
                fs.writeFileSync("pages/" + k + ".html", data[k]);
              }

            } catch (err) {
              console.log("AI failed, using fallback");

              fs.mkdirSync("pages", { recursive: true });
              fs.writeFileSync("pages/index.html", "<h1>Fallback Site</h1>");
            }
          }

          run();
          EOF

      # ⚡ Build
      - name: Build dist
        run: |
          rsync -a pages/ dist/

      # 🌍 Sitemap generator
      - name: Sitemap generator
        run: |
          SITE="https://your-username.github.io/your-repo"

          echo '<?xml version="1.0"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          for f in $(find dist -name "*.html"); do
            clean=${f#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml
          cp sitemap.xml dist/

      # 📁 Required for GitHub Pages
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # 💾 Backup system
      - name: Save backup
        run: |
          if [ -d "dist" ]; then
            rm -rf backup/*
            cp -r dist/* backup/ || true
          fi

      # 🔁 Rollback safety
      - name: Validate build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Rollback triggered"
            rm -rf dist/*
            cp -r backup/* dist/ || true
          fi

      # 🔗 Preview build
      - name: Create preview
        run: |
          mkdir -p preview
          cp -r dist/* preview/

      # 📦 Upload production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 📦 Upload preview artifact
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview

      # 🚀 Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
