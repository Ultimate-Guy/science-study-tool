name: Deploy static site

on:
  push:
    branches: ["main2"]
    paths-ignore:
      - "games/**"  # Exclude games for fast deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2-site"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
          sparse-checkout-cone-mode: true

      - name: Prepare deploy folder
        run: |
          mkdir public
          cp -r index.html 404.html favicon.ico config.jsonc css js imgs fonts public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        uses: actions/deploy-pages@v4
