name: Deploy static site

on:
  push:
    branches: ["main2"]
    paths:
      - "**"
      - "!*.md"
      - "!LICENSE"
      - "!package.json"
      - "!package-lock.json"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Pages
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------
      # Install tools
      # -----------------------------
      - name: Install tools
        run: |
          npm install -g html-minifier-terser terser clean-css-cli

      # -----------------------------
      # Create dist folder
      # -----------------------------
      - name: Prepare dist
        run: mkdir -p dist

      # =========================================================
      # SAFE COPY: GAMES
      # =========================================================
      - name: Copy games (no modifications)
        run: |
          rsync -av games dist/

      # =========================================================
      # COPY & MINIFY CORE SITE ONLY
      # =========================================================

      # HTML
      - name: Minify HTML
        run: |
          find . -maxdepth 1 -name "*.html" | while read file; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-css true \
              --minify-js true \
              -o "dist/$(basename "$file")" "$file"
          done

      # CSS
      - name: Minify CSS
        run: |
          mkdir -p dist/css
          find css -name "*.css" | while read file; do
            cleancss -o "dist/$file" "$file"
          done

      # JS (ONLY ROOT JS FILES — NOT GAME JS)
      - name: Minify JS (core only)
        run: |
          mkdir -p dist/js
          find js -maxdepth 1 -name "*.js" | while read file; do
            terser "$file" -c -m -o "dist/$file"
          done

      # -----------------------------
      # Copy assets
      # -----------------------------
      - name: Copy assets
        run: |
          rsync -av imgs fonts dist/

      # -----------------------------
      # Copy misc root files
      # -----------------------------
      - name: Copy root files
        run: |
          cp favicon.ico dist/ || true
          cp 404.html dist/ || true

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # -----------------------------
      # Generate sitemap
      # -----------------------------
      - name: Generate sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # -----------------------------
      # Deploy
      # -----------------------------
      - name: Deploy
        uses: actions/deploy-pages@v4
