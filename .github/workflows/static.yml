name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Global queue across all workflow runs
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Show Commit Info
        run: |
          echo "Deploying commit $GITHUB_SHA by $GITHUB_ACTOR"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # 👇 Add retry wrapper to avoid cancellation issues
      - name: Deploy to GitHub Pages (retry-safe)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5
          timeout_minutes: 10
          command: |
            npx --yes @actions/core@latest && echo "Deploying..."
        continue-on-error: false

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
