name: Deploy static site

on:
  push:
    branches: ["main2"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # -----------------------------
      # Detect changed files
      # -----------------------------
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changed.txt
          echo "Changed files:"
          cat changed.txt

      # -----------------------------
      # Restore previous build (HUGE SPEED BOOST)
      # -----------------------------
      - name: Restore dist cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.ref }}
          restore-keys: |
            dist-

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------
      # Install tools globally (FAST)
      # -----------------------------
      - name: Install tools
        run: npm install -g html-minifier-terser terser clean-css-cli

      # -----------------------------
      # Ensure dist exists
      # -----------------------------
      - name: Prepare dist
        run: mkdir -p dist/css dist/js

      # =========================================================
      # 🛡️ ALWAYS COPY GAMES (NO PROCESSING)
      # =========================================================
      - name: Copy games
        run: rsync -a --delete games dist/

      # =========================================================
      # HTML (ONLY changed)
      # =========================================================
      - name: Minify HTML (incremental)
        run: |
          set -e
          grep '\.html$' changed.txt | while read file; do
            echo "Processing $file"
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-css true \
              --minify-js true \
              -o "dist/$file" "$file"
          done || true

      # =========================================================
      # CSS (ONLY changed, parallel)
      # =========================================================
      - name: Minify CSS
        run: |
          grep '^css/.*\.css$' changed.txt | \
          xargs -r -P 4 -I {} sh -c 'mkdir -p dist/$(dirname {}); cleancss -o dist/{} {}'

      # =========================================================
      # JS (ONLY changed, parallel)
      # =========================================================
      - name: Minify JS
        run: |
          grep '^js/.*\.js$' changed.txt | \
          xargs -r -P 4 -I {} sh -c 'mkdir -p dist/$(dirname {}); terser {} -c -m -o dist/{}'

      # -----------------------------
      # Copy assets if changed
      # -----------------------------
      - name: Copy assets
        run: |
          if grep -q '^imgs/' changed.txt || grep -q '^fonts/' changed.txt; then
            echo "Updating assets"
            rsync -a imgs fonts dist/
          fi

      # -----------------------------
      # Root files (safe copy)
      # -----------------------------
      - name: Copy root files
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true
          cp index.html dist/ 2>/dev/null || true

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # -----------------------------
      # Sitemap (fast)
      # -----------------------------
      - name: Generate sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > dist/sitemap.xml
          echo '<urlset>' >> dist/sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> dist/sitemap.xml
          done

          echo '</urlset>' >> dist/sitemap.xml

      # -----------------------------
      # Save cache (updated dist)
      # -----------------------------
      - name: Save dist cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # -----------------------------
      # Deploy
      # -----------------------------
      - name: Deploy
        uses: actions/deploy-pages@v4
