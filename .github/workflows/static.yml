name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Speeds up subsequent runs by caching tools

      - name: Build & Sync
        run: |
          mkdir -p staging/js
          # Build JS only if the folder exists to save time
          if [ -d "js" ]; then
            npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error
          fi
          
          # High-speed asset sync using rsync
          rsync -am . staging/ --include='*.html' --include='css/***' --include='imgs/***' \
          --include='fonts/***' --include='games/***' --include='favicon.ico' --exclude='*'

      # =========================
      # 1. CRASH PROTECTION (Content Check)
      # =========================
      - name: Verify Build Integrity
        run: |
          # 1. Ensure index.html isn't empty (must be > 100 bytes)
          if [ $(stat -c%s "staging/index.html") -lt 100 ]; then
            echo "Error: index.html is too small or empty!" && exit 1
          fi
          # 2. Ensure page loaded properly (checks for essential closing tag)
          grep -q "</body>" staging/index.html || (echo "Error: index.html is malformed/incomplete!" && exit 1)

      # =========================
      # 2. FAST LINK CHECKER (Lychee)
      # =========================
      - name: Check for Broken Links
        uses: lycheeverse/lychee-action@v2
        with:
          # Checks all local HTML files in the staging folder
          args: --offline staging/**/*.html
          fail: true # This kills the build if a link is broken, preventing a bad deploy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
