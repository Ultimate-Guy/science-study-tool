name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # =========================================================
      # ⚡ CHECKOUT (FAST + FULL HISTORY FOR CACHE ACCURACY)
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # =========================================================
      # ⚡ NODE TOOLCHAIN
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ CACHE (CORE EDGE MODE SYSTEM)
      # =========================================================
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .edge-cache
          key: edge-${{ runner.os }}-${{ hashFiles('js/**','css/**') }}
          restore-keys: |
            edge-${{ runner.os }}-

      # =========================================================
      # ⚡ PREP DIST
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css dist/imgs dist/fonts dist/games
          mkdir -p .edge-cache

      # =========================================================
      # ⚡ JS (TRUE INCREMENTAL BUILD)
      # =========================================================
      - name: Build JS (cached)
        run: |
          JS_HASH=$(hashFiles js/** || echo "none")

          if [ -f ".edge-cache/js.hash" ] && [ "$(cat .edge-cache/js.hash)" = "$JS_HASH" ]; then
            echo "JS unchanged → copying cached build"
            cp -r .edge-cache/js dist/ || true
          else
            echo "JS changed → rebuilding"
            esbuild js/*.js --minify --outdir=dist/js
            rm -rf .edge-cache/js
            cp -r dist/js .edge-cache/ || true
            echo "$JS_HASH" > .edge-cache/js.hash
          fi

      # =========================================================
      # ⚡ CSS (TRUE INCREMENTAL BUILD)
      # =========================================================
      - name: Build CSS (cached)
        run: |
          CSS_HASH=$(hashFiles css/** || echo "none")

          if [ -f ".edge-cache/css.hash" ] && [ "$(cat .edge-cache/css.hash)" = "$CSS_HASH" ]; then
            echo "CSS unchanged → copying cached build"
            cp -r .edge-cache/css dist/ || true
          else
            echo "CSS changed → rebuilding"
            esbuild css/*.css --minify --outdir=dist/css
            rm -rf .edge-cache/css
            cp -r dist/css .edge-cache/ || true
            echo "$CSS_HASH" > .edge-cache/css.hash
          fi

      # =========================================================
      # ⚡ HTML (ALWAYS FAST COPY)
      # =========================================================
      - name: Copy HTML
        run: |
          cp *.html dist/ 2>/dev/null || true

      # =========================================================
      # 🎮 GAMES (NEVER TOUCH UNLESS CHANGED)
      # =========================================================
      - name: Sync games
        run: |
          rsync -a games/ dist/games/

      # =========================================================
      # ⚡ ASSETS (FAST MIRROR COPY)
      # =========================================================
      - name: Assets
        run: |
          rsync -a imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATION (FAILSAFE)
      # =========================================================
      - name: Validate build
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 ARTIFACT (FIXES YOUR PREVIOUS ERRORS)
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
