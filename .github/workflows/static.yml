name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Treeless Checkout
        uses: actions/checkout@v4
        with:
          # tree:0 is even faster than blob:none for initial startup
          filter: 'tree:0' 
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            package.json
            package-lock.json
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fast Install
        # npm ci is significantly faster than npm install
        run: npm ci 

      - name: Instant Sync
        run: |
          mkdir -p staging/js
          
          # esbuild is the fastest bundler available
          npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error
          
          # Fast linking: Skip copying bytes entirely. 
          # Using find + cp -rl creates instantaneous filesystem pointers
          find . -maxdepth 1 -not -path '*/.*' -not -path './staging' -not -path './js' -not -path './node_modules' -not -path './package*' -exec cp -rl {} staging/ \;

      - name: Safety Check
        run: |
          if [ ! -s staging/index.html ] || ! grep -q "</body>" staging/index.html; then
            echo "Blocking deploy: site files corrupted."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
