name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ultra-Fast Checkout
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 2   # needed for diff check
          clean: false
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # 🔥 Skip everything if nothing important changed
      - name: Detect changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 | grep -E '^(index.html|404.html|favicon.ico|css/|js/|imgs/|fonts/|games/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop early if no changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "⚡ No relevant changes — skipping build"
          exit 0

      - name: Assemble Site (MAX FAST)
        run: |
          mkdir -p staging

          # Core files (always copy)
          rsync -a --ignore-missing-args \
            index.html 404.html favicon.ico \
            css js imgs fonts \
            staging/

          # 🔥 ONLY copy games if they changed
          if git diff --name-only HEAD~1 | grep -q '^games/'; then
            echo "🎮 Games changed — syncing games folder"
            rsync -a games staging/
          else
            echo "⚡ Games unchanged — skipping (HUGE speed win)"
          fi

      - name: Safety Check (fast + strict)
        run: |
          # HTML check
          if [ ! -s staging/index.html ] || ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html missing or malformed"
            exit 1
          fi

          # JS check
          if ! find staging/js -type f -print -quit | grep -q .; then
            echo "❌ JS missing → site would break"
            exit 1
          fi

          # Essential folders
          for folder in imgs css fonts; do
            if ! find staging/$folder -type f -print -quit | grep -q .; then
              echo "❌ Essential folder $folder missing"
              exit 1
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
