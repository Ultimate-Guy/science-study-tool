name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sparse checkout prevents downloading unnecessary 3.7GB bloat
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fast Build and Sync
        run: |
          mkdir -p staging/js
          
          # Bundle only your core site JS files
          # Using esbuild is significantly faster than standard copy/minify tools
          npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error
          
          # Link all other static assets (instant move, zero extra disk usage)
          # We skip 'js' because we bundled it above, and '.git' for safety
          find . -maxdepth 1 -not -path '*/.*' -not -path './staging' -not -path './js' -not -path './package*' -exec cp -rl {} staging/ \;

      - name: Safety Check
        run: |
          if [ ! -s staging/index.html ] || ! grep -q "</body>" staging/index.html; then
            echo "Deployment Blocked: index.html is missing or incomplete."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
