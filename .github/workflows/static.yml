name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # Upload main site
      - name: Upload main site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
          compression-level: 0

      # Upload games folder as a single artifact
      - name: Upload games artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: games
          compression-level: 0

      # Deploy all uploaded artifacts
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
