name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # Minimal checkout of only required files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # Copy everything into a single staging folder
      - name: Prepare staging folder
        run: |
          mkdir -p staging
          cp -r index.html 404.html favicon.ico config.jsonc css js imgs fonts games staging/

      # Upload the staging folder as a Pages artifact (no compression)
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging
          compression-level: 0

      # Deploy the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
