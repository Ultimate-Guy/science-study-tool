name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ultra-Fast Checkout
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 1           # Shallow clone → huge speed gain
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      - name: Assemble Site (fast)
        run: |
          set -euo pipefail
          mkdir -p staging

          cp index.html staging/
          cp 404.html staging/ || true
          cp favicon.ico staging/ || true

          # Copy all folders safely, preserving subfolder structure
          for folder in css js imgs fonts games; do
            if [ -d "$folder" ]; then
              mkdir -p staging/$folder
              cp -r $folder/* staging/$folder/
            fi
          done

      - name: Safety Check
        run: |
          set -euo pipefail

          # Ensure HTML exists and is valid
          if [ ! -s staging/index.html ] || ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html missing or malformed"
            exit 1
          fi

          # Ensure JS exists
          if [ ! -d staging/js ] || [ -z "$(ls -A staging/js)" ]; then
            echo "❌ JS missing → site would hang"
            exit 1
          fi

          # Ensure essential folders exist
          for folder in imgs css fonts; do
            if [ ! -d staging/$folder ] || [ -z "$(ls -A staging/$folder)" ]; then
              echo "❌ Essential folder $folder missing"
              exit 1
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
