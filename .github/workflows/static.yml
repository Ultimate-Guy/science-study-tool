name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # Checkout only necessary files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # Upload main site artifact
      - name: Upload main site
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
          compression-level: 0

      # Dynamically create chunk folders (temp-chunk-1, temp-chunk-2, …)
      - name: Split games into chunk folders
        run: |
          mkdir -p chunks
          CHUNK_SIZE=1800000000
          CHUNK_NUM=1
          CURRENT_SIZE=0
          mkdir -p "chunks/chunk-$CHUNK_NUM"
          for game in games/*; do
            SIZE=$(du -s -B1 "$game" | cut -f1)
            if [ $((CURRENT_SIZE + SIZE)) -gt $CHUNK_SIZE ]; then
              CHUNK_NUM=$((CHUNK_NUM + 1))
              CURRENT_SIZE=0
              mkdir -p "chunks/chunk-$CHUNK_NUM"
            fi
            cp -r "$game" "chunks/chunk-$CHUNK_NUM/"
            CURRENT_SIZE=$((CURRENT_SIZE + SIZE))
          done

      # Upload each chunk artifact as a separate step
      - name: Upload game chunks
        uses: actions/upload-pages-artifact@v3
        with:
          path: chunks
          compression-level: 0

      # Deploy all uploaded artifacts to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
