name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fast & Safe Checkout
        uses: actions/checkout@v4
        with:
          # blob:none = fast BUT still fetches files correctly when needed
          filter: 'blob:none'
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            package.json
            package-lock.json
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fast Install
        run: npm ci 

      - name: Build JS
        run: |
          set -euo pipefail
          mkdir -p staging/js

          # avoid npx overhead
          ./node_modules/.bin/esbuild js/*.js \
            --bundle --minify \
            --outdir=staging/js \
            --log-level=error

      - name: Assemble Site (SAFE + FAST)
        run: |
          set -euo pipefail

          mkdir -p staging

          # Copy only what is needed (no repo scan)
          cp index.html staging/
          cp 404.html staging/ || true
          cp favicon.ico staging/ || true

          cp -r css staging/ || true
          cp -r fonts staging/ || true
          cp -r games staging/ || true
          cp -r imgs staging/ || true

          # If build failed, fallback to raw js (prevents blank site)
          if [ ! -d staging/js ] || [ -z "$(ls -A staging/js)" ]; then
            echo "⚠️ Build missing, falling back to raw JS"
            rm -rf staging/js
            cp -r js staging/
          fi

      - name: Safety Check (stronger)
        run: |
          set -euo pipefail

          if [ ! -s staging/index.html ] || \
             ! grep -q "</html>" staging/index.html || \
             ! grep -q "<head>" staging/index.html; then
            echo "Blocking deploy: index.html corrupted."
            exit 1
          fi

          # Ensure JS actually exists (prevents infinite loading)
          if [ ! -d staging/js ] || [ -z "$(ls -A staging/js)" ]; then
            echo "Blocking deploy: JS missing."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
