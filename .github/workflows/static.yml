name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed_top_assets: ${{ steps.detect.outputs.top_assets }}
      changed_games: ${{ steps.detect.outputs.games }}
    steps:
      - name: Checkout repository sparse
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse: true
          paths: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            fonts
            imgs

      - name: Restore public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}
          restore-keys: public-${{ github.ref }}-

      - name: Detect changed files
        id: detect
        run: |
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          TOP_CHANGED=""
          for asset in $ASSETS; do
            if git diff --name-only HEAD^ HEAD | grep -q "^$asset"; then
              TOP_CHANGED="$TOP_CHANGED $asset"
            fi
          done

          GAMES_CHANGED=""
          for folder in games/*; do
            NAME=$(basename "$folder")
            if git diff --name-only HEAD^ HEAD | grep -q "^games/$NAME/"; then
              GAMES_CHANGED="$GAMES_CHANGED $NAME"
            fi
          done

          # Ensure outputs are always valid strings
          echo "top_assets=${TOP_CHANGED}" >> $GITHUB_OUTPUT
          echo "games=${GAMES_CHANGED}" >> $GITHUB_OUTPUT

  prebuild_public:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository sparse for all files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse: true
          paths: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            fonts
            imgs
            games

      - name: Prebuild public folder
        run: |
          mkdir -p public
          # Copy top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            [ -e "$asset" ] && rsync -au "$asset" public/
          done
          # Copy all games
          for folder in games/*; do
            NAME=$(basename "$folder")
            mkdir -p public/games/$NAME
            rsync -a "$folder/" "public/games/$NAME/"
          done

  deploy_top_assets:
    needs: [prepare, prebuild_public]
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.changed_top_assets != '' }}
    steps:
      - name: Deploy changed top-level assets
        run: |
          mkdir -p public
          for asset in ${{ needs.prepare.outputs.changed_top_assets }}; do
            rsync -au "$asset" public/
          done

  deploy_games:
    needs: [prepare, prebuild_public]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON('["' + needs.prepare.outputs.changed_games.replace(' ', '","') + '"]') }}
    if: ${{ matrix.game != '' }}
    steps:
      - name: Deploy changed game folder
        run: |
          mkdir -p public/games
          rsync -a "games/${{ matrix.game }}/" "public/games/${{ matrix.game }}/"

  finalize:
    needs: [deploy_top_assets, deploy_games]
    runs-on: ubuntu-latest
    steps:
      - name: Save public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
