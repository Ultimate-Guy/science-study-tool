name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # =========================================================
      # ⚡ CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ NODE TOOLING
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ INIT BUILD
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css dist/imgs dist/fonts dist/games

      # =========================================================
      # 🧠 HASH SYSTEM
      # =========================================================
      - name: Generate folder hashes
        id: hash
        run: |
          mkdir -p .cache

          hash_folder () {
            find "$1" -type f -exec sha1sum {} \; 2>/dev/null | sha1sum | cut -d' ' -f1
          }

          JS_HASH=$(hash_folder js)
          CSS_HASH=$(hash_folder css)
          GAMES_HASH=$(hash_folder games)

          echo "js=$JS_HASH" >> $GITHUB_OUTPUT
          echo "css=$CSS_HASH" >> $GITHUB_OUTPUT
          echo "games=$GAMES_HASH" >> $GITHUB_OUTPUT

          echo "$JS_HASH" > .cache/js.hash
          echo "$CSS_HASH" > .cache/css.hash
          echo "$GAMES_HASH" > .cache/games.hash

      # =========================================================
      # ⚡ JS BUILD
      # =========================================================
      - name: Build JS (incremental)
        run: |
          OLD=$(cat .cache/js.hash 2>/dev/null || echo "")
          NEW="${{ steps.hash.outputs.js }}"

          if [ "$OLD" != "$NEW" ]; then
            echo "JS changed → building"
            esbuild js/*.js --minify --outdir=dist/js || true
          else
            echo "JS unchanged → skipping"
            cp -r js/* dist/js/ 2>/dev/null || true
          fi

      # =========================================================
      # ⚡ CSS BUILD
      # =========================================================
      - name: Build CSS (incremental)
        run: |
          OLD=$(cat .cache/css.hash 2>/dev/null || echo "")
          NEW="${{ steps.hash.outputs.css }}"

          if [ "$OLD" != "$NEW" ]; then
            echo "CSS changed → building"
            esbuild css/*.css --minify --outdir=dist/css || true
          else
            echo "CSS unchanged → skipping"
            cp -r css/* dist/css/ 2>/dev/null || true
          fi

      # =========================================================
      # ⚡ GAMES
      # =========================================================
      - name: Games sync (incremental safe)
        run: |
          OLD=$(cat .cache/games.hash 2>/dev/null || echo "")
          NEW="${{ steps.hash.outputs.games }}"

          if [ "$OLD" != "$NEW" ]; then
            echo "Games changed → syncing"
            rsync -a games/ dist/games/ || true
          else
            echo "Games unchanged → skipping heavy sync"
            rsync -a games/ dist/games/ || true
          fi

      # =========================================================
      # ⚡ CORE FILES
      # =========================================================
      - name: Copy HTML
        run: |
          cp *.html dist/ 2>/dev/null || true
          cp index.html dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # ⚡ ASSETS
      # =========================================================
      - name: Copy assets
        run: |
          rsync -a imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE
      # =========================================================
      - name: Finalize build
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATION
      # =========================================================
      - name: Validate build
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 SINGLE ARTIFACT
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
