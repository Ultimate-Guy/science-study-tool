name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Determine changed files
      - name: Get changed files
        id: changes
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed.txt
          else
            git ls-files > changed.txt
          fi
          echo "changed_files=$(cat changed.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      # 3️⃣ Prepare public folder incrementally
      - name: Prepare public folder
        run: |
          mkdir -p public

          # 3a. Top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            if echo "${{ steps.changes.outputs.changed_files }}" | grep -q "^$asset"; then
              rsync -au "$asset" public/
            elif [ ! -e "public/$asset" ]; then
              rsync -a "$asset" public/
            fi
          done

          # 3b. Deploy only changed files in games/
          mkdir -p public/games
          for file in ${{ steps.changes.outputs.changed_files }}; do
            if [[ $file == games/* ]]; then
              rsync -R "$file" public/
            fi
          done

          # 3c. Deploy new game folders fully (if they don’t exist in public)
          for folder in games/*; do
            NAME=$(basename "$folder")
            if [ ! -d "public/games/$NAME" ]; then
              rsync -a "$folder/" "public/games/$NAME/"
            fi
          done

      # 4️⃣ Upload artifact (always present)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 5️⃣ Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
