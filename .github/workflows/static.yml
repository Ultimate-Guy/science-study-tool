name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fast Checkout (minimal)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          clean: false
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games/**
          sparse-checkout-cone-mode: true

      - name: Assemble Site (faster with tar)
        run: |
          mkdir -p staging

          tar -cf - \
            index.html 404.html favicon.ico config.jsonc \
            css js imgs fonts games \
          | tar -xf - -C staging

      - name: Lightweight Safety Check
        run: |
          test -s staging/index.html || exit 1
          test -d staging/games || exit 1
          compgen -G "staging/js/*.js" > /dev/null || exit 1

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging
          compression-level: 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
