name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fast Checkout (safe for large repos)
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false

      - name: Build JS (never fails)
        run: |
          set -euo pipefail
          mkdir -p staging/js

          # Try fast build
          if npx --yes esbuild js/*.js \
            --bundle --minify \
            --outdir=staging/js \
            --log-level=error; then
            echo "✅ JS built with esbuild"
          else
            echo "⚠️ Build failed → using raw JS"
            rm -rf staging/js
            cp -r js staging/
          fi

      - name: Assemble site (fast, no repo scan)
        run: |
          set -euo pipefail

          mkdir -p staging

          cp index.html staging/
          cp 404.html staging/ || true
          cp favicon.ico staging/ || true

          cp -r css staging/ || true
          cp -r fonts staging/ || true
          cp -r games staging/ || true
          cp -r imgs staging/ || true

          # If build didn't produce JS, ensure fallback exists
          if [ ! -d staging/js ] || [ -z "$(ls -A staging/js)" ]; then
            echo "⚠️ JS missing → copying fallback"
            rm -rf staging/js
            cp -r js staging/
          fi

      - name: Safety Check (prevents broken sites)
        run: |
          set -euo pipefail

          if [ ! -s staging/index.html ]; then
            echo "❌ index.html missing"
            exit 1
          fi

          if ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html malformed"
            exit 1
          fi

          if [ ! -d staging/js ] || [ -z "$(ls -A staging/js)" ]; then
            echo "❌ JS missing → site would hang"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
