name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Minimal Checkout (only what we need)
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            fonts
            games
            imgs
            js
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      # 🔍 Detect JS-related changes using GitHub event (FAST, no git diff)
      - name: Detect JS changes
        id: changes
        run: |
          echo "changed=false" >> $GITHUB_OUTPUT
          for file in ${{ join(github.event.head_commit.modified, ' ') }}; do
            if [[ "$file" == js/* || "$file" == package.json || "$file" == package-lock.json ]]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              break
            fi
          done

      # ⚡ Only setup Node if needed
      - name: Setup Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      # 🚀 Build ONLY when needed
      - name: Build JS
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p staging/js
          ./node_modules/.bin/esbuild js/*.js \
            --bundle --minify \
            --outdir=staging/js \
            --log-level=error

      # ⚡ Copy ONLY required files (NO repo-wide scan)
      - name: Assemble site (fast path)
        run: |
          set -euo pipefail

          mkdir -p staging

          # Copy core files (tiny cost)
          cp index.html staging/
          cp 404.html staging/ || true
          cp favicon.ico staging/ || true

          # Copy directories individually (no find/rsync over root!)
          cp -r css staging/ || true
          cp -r fonts staging/ || true
          cp -r games staging/ || true
          cp -r imgs staging/ || true

          # If JS wasn't rebuilt, just copy it raw
          if [ ! -d staging/js ]; then
            cp -r js staging/
          fi

      # 🛡️ Strong safety check
      - name: Safety Check
        run: |
          set -euo pipefail

          if [ ! -s staging/index.html ] || \
             ! grep -q "</html>" staging/index.html || \
             ! grep -q "<head>" staging/index.html; then
            echo "Critical Error: index.html missing or malformed."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
