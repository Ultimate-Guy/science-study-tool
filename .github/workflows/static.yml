name: Deploy static site

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "imgs/**"
      - "img/**"
      - "fonts/**"
      - "games/**"
      - "favicon.ico"
      - ".github/workflows/**"
      
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Setup GitHub Pages
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Version
      # -----------------------------
      - name: Generate version
        run: echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # -----------------------------
      # Safe cache busting
      # 
      # -----------------------------
      - name: Cache busting
        run: |
          VERSION="${{ env.VERSION }}"

          find . -name "*.html" | while read file; do
            sed -i "s/\.css/\.css?v=$VERSION/g" "$file" || true
            sed -i "s/\.js/\.js?v=$VERSION/g" "$file" || true
          done

      # -----------------------------
      # Generate sitemap
      # -----------------------------
      - name: Generate sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          find . -name "*.html" | while read file; do
            clean=${file#./}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      # -----------------------------
      # Prevent Jekyll breaking folders like /games
      # -----------------------------
      - name: Disable Jekyll
        run: touch .nojekyll

      # -----------------------------
      # Upload ROOT (matches this repo exactly)
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # -----------------------------
      # Deploy
      # -----------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
