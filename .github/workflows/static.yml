name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # =========================================================
      # ⚡ CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # =========================================================
      # ⚡ NODE TOOLING
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ SAFE DIST PREP
      # =========================================================
      - name: Prepare build
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css dist/imgs dist/fonts dist/games

      # =========================================================
      # ⚡ SAFE CHANGE DETECTION
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          set +e

          git rev-parse HEAD^ >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "full=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git diff --name-only HEAD^ HEAD > changes.txt || true

          if [ ! -s changes.txt ]; then
            echo "full=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -q '^games/' changes.txt; then
            echo "games=true" >> $GITHUB_OUTPUT
          else
            echo "games=false" >> $GITHUB_OUTPUT
          fi

          if grep -qE '^css/|^js/|\.html$|index.html'; then
            echo "core=true" >> $GITHUB_OUTPUT
          else
            echo "core=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # 🧱 CORE BUILD
      # =========================================================
      - name: Build JS (safe)
        if: steps.changes.outputs.full != 'true'
        run: |
          if ls js/*.js 1> /dev/null 2>&1; then
            esbuild js/*.js --minify --outdir=dist/js || true
          fi

      - name: Build CSS (safe)
        if: steps.changes.outputs.full != 'true'
        run: |
          if ls css/*.css 1> /dev/null 2>&1; then
            esbuild css/*.css --minify --outdir=dist/css || true
          fi

      # =========================================================
      # ⚡ FULL FALLBACK
      # =========================================================
      - name: Full build fallback
        if: steps.changes.outputs.full == 'true'
        run: |
          echo "FULL SAFE BUILD MODE"

          if ls js/*.js 1> /dev/null 2>&1; then
            esbuild js/*.js --minify --outdir=dist/js || true
          fi

          if ls css/*.css 1> /dev/null 2>&1; then
            esbuild css/*.css --minify --outdir=dist/css || true
          fi

      # =========================================================
      # ⚡ HTML
      # =========================================================
      - name: Copy HTML
        run: |
          cp *.html dist/ 2>/dev/null || true
          cp index.html dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # 🎮 GAMES
      # =========================================================
      - name: Copy games
        run: |
          if [ -d games ]; then
            rsync -a games/ dist/games/ || true
          fi

      # =========================================================
      # ⚡ ASSETS
      # =========================================================
      - name: Copy assets
        run: |
          if [ -d imgs ]; then rsync -a imgs/ dist/imgs/; fi
          if [ -d fonts ]; then rsync -a fonts/ dist/fonts/; fi

      # =========================================================
      # ⚡ FINAL FILES
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATION
      # =========================================================
      - name: Validate build
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: Missing index.html in dist"
            exit 1
          fi

      # =========================================================
      # 📦 SINGLE ARTIFACT ONLY
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
