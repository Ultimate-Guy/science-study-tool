name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Optimized Checkout
        uses: actions/checkout@v4
        with:
          # Blobless clone: doesn't download file data until needed
          filter: 'blob:none'
          # Sparse checkout: only brings in your specific folders
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            fonts
            games
            imgs
            js
          sparse-checkout-cone-mode: false 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fast Build and Sync
        run: |
          mkdir -p staging/js
          
          # Bundle your core JS (super fast with esbuild)
          npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error
          
          # 'cp -rl' creates hard links (instant pointers) instead of copying bytes.
          # This is the fastest way to move 3GB+ of game files.
          find . -maxdepth 1 -not -path '*/.*' -not -path './staging' -not -path './js' -not -path './package*' -exec cp -rl {} staging/ \;

      - name: Integrity Check
        run: |
          # Safe check: verifies the critical index.html isn't empty or cut off
          if [ ! -s staging/index.html ] || ! grep -q "</body>" staging/index.html; then
            echo "DEPLOY BLOCKED: index.html is missing or corrupted."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
