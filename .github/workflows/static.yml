name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.filter.outputs.deploy }}

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect relevant changes
        id: filter
        run: |
          git diff --name-only HEAD~1 HEAD > changes.txt || true

          if grep -qE '^js/|^css/|^imgs/|^fonts/|^games/|\.html$|^favicon\.ico$' changes.txt; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ ULTRA FAST CHECKOUT (BIGGEST SPEED BOOST)
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            *.html
            js
            css
            imgs
            fonts
            games
            favicon.ico
          sparse-checkout-cone-mode: false

      # =========================================================
      # ⚡ DETECT FRONTEND CHANGES
      # =========================================================
      - name: Detect frontend changes
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changes.txt || true

          if grep -qE '^js/|^css/' changes.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ NODE ONLY IF NEEDED
      # =========================================================
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 22

      - name: Install esbuild (fast)
        if: steps.changes.outputs.frontend == 'true'
        run: npm install -g esbuild


      # =========================================================
      # ⚡ CLEAN DIST
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir dist

      # =========================================================
      # ⚡ JS
      # =========================================================
      - name: JS
        run: |
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            esbuild js/*.js --minify --outdir=dist/js


          else
            rsync -a --delete js/ dist/js/


          fi

      # =========================================================
      # ⚡ CSS
      # =========================================================
      - name: CSS
        run: |
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            esbuild css/*.css --minify --outdir=dist/css
          else
            rsync -a --delete css/ dist/css/
          fi

      # =========================================================
      # ⚡ STATIC FILES
      # =========================================================
      - name: HTML
        run: rsync -a *.html dist/ 2>/dev/null || true

      - name: Games (OPTIMIZED COPY)
        run: |
          if [ -d "games" ]; then
            rsync -a --delete --exclude='*.psd' --exclude='*.zip' games/ dist/games/
          fi

      - name: Assets
        run: |
          rsync -a --delete imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a --delete fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINAL CLEAN (REDUCE ARTIFACT SIZE)
      # =========================================================
      - name: Remove junk files
        run: |
          find dist -type f \( -name "*.map" -o -name "*.log" -o -name "*.tmp" \) -delete

      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATE
      # =========================================================
      - name: Validate

        run: test -f dist/index.html || exit 1

      # =========================================================
      # 📦 UPLOAD (FASTER BECAUSE SMALLER)
      # =========================================================
      - uses: actions/upload-pages-artifact@v3

        with:
          path: dist

  deploy:
    needs: build
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
