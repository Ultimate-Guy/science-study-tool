name: Deploy static website

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 Init folders
      - name: Init workspace
        run: |
          mkdir -p pages
          mkdir -p dist
          mkdir -p backup
          mkdir -p preview

      # ⚡ Detect changes
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -E "\.html|\.css|\.js|content" changes.txt; then
            echo "run_ai=true" >> $GITHUB_OUTPUT
          else
            echo "run_ai=false" >> $GITHUB_OUTPUT
          fi

      # 🧱 Fallback page
      - name: Fallback page
        run: echo "<h1>Site is building...</h1>" > pages/index.html

      # 📦 Node
      - name: Setup Node
        if: steps.changes.outputs.run_ai == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI
        if: steps.changes.outputs.run_ai == 'true'
        run: npm install openai

      # 🧠 SAFE AI GENERATOR (FIXED)
      - name: AI Multi-page Generator
        if: steps.changes.outputs.run_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          async function run() {

            const res = await client.chat.completions.create({
              model: "gpt-4o-mini",
              messages: [{
                role: "user",
                content:
"Generate 4 SEO HTML pages (index, blog, tools, guide).\nReturn ONLY valid JSON like:\n{\n\"index\":\"html\",\n\"blog\":\"html\",\n\"tools\":\"html\",\n\"guide\":\"html\"\n}\nRules:\n- valid HTML only\n- include meta tags\n- no explanations"
              }]
            });

            const data = JSON.parse(res.choices[0].message.content);

            for (const k in data) {
              fs.writeFileSync("pages/" + k + ".html", data[k]);
            }
          }

          run();
          EOF

      # ⚡ Build
      - name: Build dist
        run: rsync -a pages/ dist/

      # 🌍 Sitemap
      - name: Sitemap generator
        run: |
          SITE="https://your-username.github.io/your-repo"

          echo '<?xml version="1.0"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          for f in $(find dist -name "*.html"); do
            clean=${f#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml
          cp sitemap.xml dist/

      # 📁 Required
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # 💾 Backup
      - name: Save backup
        run: |
          if [ -d "dist" ]; then
            rm -rf backup/*
            cp -r dist/* backup/ || true
          fi

      # 🔁 Rollback safety
      - name: Validate build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build broken → restoring backup"
            rm -rf dist/*
            cp -r backup/* dist/ || true
          fi

      # 🔗 Preview
      - name: Preview build
        run: |
          mkdir -p preview
          cp -r dist/* preview/

      # 📦 Upload production
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 📦 Upload preview
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview

      # 🚀 Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
