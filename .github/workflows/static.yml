name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout (safe + fast)
      # =========================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================
      # Setup Node ONLY if needed
      # =========================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
        if: contains(join(github.event.head_commit.modified, ','), 'js/') ||
            contains(join(github.event.head_commit.modified, ','), 'css/')

      # =========================
      # Install esbuild (only if JS exists)
      # =========================
      - name: Install tools
        if: hashFiles('js/**/*.js') != ''
        run: npm i -g esbuild

      # =========================
      # Build output folder
      # =========================
      - name: Prepare dist
        run: rm -rf dist && mkdir dist

      # =========================
      # JS (safe build)
      # =========================
      - name: Build JS
        run: |
          if [ -d "js" ]; then
            esbuild js/*.js --minify --outdir=dist/js || cp -r js dist/js
          fi

      # =========================
      # CSS (safe copy, no fragile bundling)
      # =========================
      - name: CSS
        run: |
          if [ -d "css" ]; then
            cp -r css dist/
          fi

      # =========================
      # HTML
      # =========================
      - name: HTML
        run: cp *.html dist/ 2>/dev/null || true

      # =========================
      # Assets
      # =========================
      - name: Assets
        run: |
          cp -r imgs dist/ 2>/dev/null || true
          cp -r fonts dist/ 2>/dev/null || true
          cp -r games dist/ 2>/dev/null || true
          cp favicon.ico dist/ 2>/dev/null || true

      # =========================
      # Safety checks
      # =========================
      - name: Validate
        run: test -f dist/index.html

      # =========================
      # Pages artifact
      # =========================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
