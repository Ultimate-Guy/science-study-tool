name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ultra-Fast Checkout
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 2
          clean: false
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # 🔥 Skip entire workflow if nothing relevant changed
      - name: Detect changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 | grep -E '^(index.html|404.html|favicon.ico|config.jsonc|css/|js/|imgs/|fonts/|games/)'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop early if no changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "⚡ No relevant changes — skipping deploy"
          exit 0

      - name: Assemble Site (FAST + SAFE)
        run: |
          mkdir -p staging

          # 🔥 Single fast sync (handles everything efficiently)
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='*.jsonc' \
            ./ staging/

          # Re-add config.jsonc explicitly (since excluded above)
          cp config.jsonc staging/

      - name: Safety Check
        run: |
          # HTML
          if [ ! -s staging/index.html ] || ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html broken"
            exit 1
          fi

          # Config
          if [ ! -s staging/config.jsonc ]; then
            echo "❌ config.jsonc missing"
            exit 1
          fi

          # JS
          if ! find staging/js -type f -print -quit | grep -q .; then
            echo "❌ JS missing"
            exit 1
          fi

          # Core assets
          for folder in css imgs fonts games; do
            if [ ! -d staging/$folder ]; then
              echo "❌ Missing $folder"
              exit 1
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
