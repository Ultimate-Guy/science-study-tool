name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}
          restore-keys: public-${{ github.ref }}-

      - name: Detect changed files
        id: changes
        run: |
          # Default: everything changed (first commit)
          GAMES_CHANGED=true
          TOP_CHANGED="index.html 404.html favicon.ico config.jsonc css js fonts imgs"

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # Detect top-level asset changes
            TOP_CHANGED=$(git diff --name-only HEAD^ HEAD | grep -E '^(index.html|404.html|favicon.ico|config.jsonc|css|js|fonts|imgs)' || echo "")
            # Detect changed games
            GAMES_CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
          else
            # First commit → include all games
            GAMES_CHANGED=$(ls games)
          fi

          echo "top_changed=$TOP_CHANGED" >> $GITHUB_OUTPUT
          echo "games_changed=$GAMES_CHANGED" >> $GITHUB_OUTPUT

      - name: Build public folder
        run: |
          mkdir -p public

          # Copy top-level assets
          if [ -n "${{ steps.changes.outputs.top_changed }}" ]; then
            for asset in ${{ steps.changes.outputs.top_changed }}; do
              [ -e "$asset" ] && rsync -au "$asset" public/
            done
          fi

          # Copy changed games
          if [ -n "${{ steps.changes.outputs.games_changed }}" ]; then
            for folder in ${{ steps.changes.outputs.games_changed }}; do
              mkdir -p public/games/$folder
              rsync -a "games/$folder/" "public/games/$folder/"
            done
          fi

          # First deploy fallback: ensure public has everything if cache empty
          if [ ! -e public/index.html ]; then
            echo "Fallback: copying all assets and games..."
            ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
            for asset in $ASSETS; do
              [ -e "$asset" ] && rsync -au "$asset" public/
            done
            for folder in games/*; do
              NAME=$(basename "$folder")
              mkdir -p public/games/$NAME
              rsync -a "games/$NAME/" "public/games/$NAME/"
            done
          fi

      - name: Save public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
