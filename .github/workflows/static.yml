name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 1

      - name: Inject TMDB Secret
        # This MUST happen before the Strip Repo step
        run: |
          sed -i "s/TMDB_REPLACE_ME/${{ secrets.TMDB_API_KEY }}/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Strip Repo to Essentials
        # Keeps your site fast by removing non-website files
        run: |
          rm -rf .git .github .gitignore .prettierignore .prettierrc \
                 README.md package.json package-lock.json jsconfig.json \
                 build-config.js add-game-entry.js LICENSE
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          compression-level: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
