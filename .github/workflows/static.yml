name: Deploy static site

on:
  push:
    branches: ["main2"]
    paths:
      - "**"
      - "!README.md"
      - "!LICENSE"
      - "!package.json"
      - "!package-lock.json"
      - "!*.md"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Setup GitHub Pages
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Generate content-based version
      # -----------------------------
      - name: Generate version
        run: |
          VERSION=$(find . -type f \( -name "*.css" -o -name "*.js" \) -exec sha1sum {} + | sha1sum | cut -c1-8)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # -----------------------------
      # Cache busting (safe + changed HTML only)
      # -----------------------------
      - name: Cache busting
        run: |
          VERSION="${{ env.VERSION }}"

          FILES=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep "\.html$" || true)

          # fallback if diff fails (first commit, etc.)
          if [ -z "$FILES" ]; then
            FILES=$(find . -name "*.html")
          fi

          for file in $FILES; do
            [ -f "$file" ] || continue

            # remove old ?v=
            sed -i -E "s/\.css\?v=[^\"']*/.css/g" "$file" || true
            sed -i -E "s/\.js\?v=[^\"']*/.js/g" "$file" || true

            # add fresh version
            sed -i "s/\.css/\.css?v=$VERSION/g" "$file" || true
            sed -i "s/\.js/\.js?v=$VERSION/g" "$file" || true
          done

      # -----------------------------
      # Generate sitemap
      # -----------------------------
      - name: Generate sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          find . -name "*.html" | while read file; do
            clean=${file#./}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      # -----------------------------
      # Prevent Jekyll issues
      # -----------------------------
      - name: Disable Jekyll
        run: touch .nojekyll

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # -----------------------------
      # Deploy
      # -----------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
