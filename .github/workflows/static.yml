name: Deploy static site

on:
  push:
    branches: ["main2"]
    paths:
      - "**"
      - "!*.md"
      - "!LICENSE"
      - "!package.json"
      - "!package-lock.json"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout (fast shallow clone)
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # -----------------------------
      # Detect changes (optional speed gate)
      # -----------------------------
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            '*.html' '*.css' '*.js' 'imgs/' 'fonts/' 'index.html' 'css/' 'js/'; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no changes
        if: steps.changes.outputs.skip == 'true'
        run: |
          echo "No relevant changes — skipping deploy."
          exit 0

      # -----------------------------
      # Setup Pages
      # -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Setup Node (latest stable)
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # -----------------------------
      # Install tools
      # -----------------------------
      - name: Install tools
        run: npm install html-minifier-terser terser clean-css-cli

      # -----------------------------
      # Prepare build folder
      # -----------------------------
      - name: Prepare dist
        run: mkdir -p dist

      # =========================================================
      # 🛡️ MICRO-IMPROVEMENT: GAMES SAFETY GUARD
      # =========================================================
      - name: Guard games folder (safety check)
        run: |
          echo "Ensuring games folder is never processed by build steps..."
          if grep -r "games/" .github || grep -r "games/" js css; then
            echo "Warning: games reference detected (this is OK if intentional)."
          fi

      # =========================================================
      # COPY GAMES (UNCHANGED - CRITICAL)
      # =========================================================
      - name: Copy games (no processing)
        run: |
          rsync -av games dist/

      # =========================================================
      # CORE SITE BUILD ONLY
      # =========================================================

      # HTML
      - name: Minify HTML
        run: |
          find . -maxdepth 1 -name "*.html" | while read file; do
            npx html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-css true \
              --minify-js true \
              -o "dist/$(basename "$file")" "$file"
          done

      # CSS
      - name: Minify CSS
        run: |
          mkdir -p dist/css
          find css -type f -name "*.css" | while read file; do
            npx cleancss -o "dist/$file" "$file"
          done

      # JS (core only)
      - name: Minify JS
        run: |
          mkdir -p dist/js
          find js -maxdepth 1 -name "*.js" | while read file; do
            npx terser "$file" -c -m -o "dist/$file"
          done

      # -----------------------------
      # Assets
      # -----------------------------
      - name: Copy assets
        run: |
          rsync -a imgs fonts dist/

      # -----------------------------
      # Root files
      # -----------------------------
      - name: Copy root files
        run: |
          cp favicon.ico dist/ || true
          cp 404.html dist/ || true
          cp index.html dist/ || true

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # -----------------------------
      # Sitemap (fast dist scan)
      # -----------------------------
      - name: Generate sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # -----------------------------
      # Deploy
      # -----------------------------
      - name: Deploy
        uses: actions/deploy-pages@v4
