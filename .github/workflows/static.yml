name: Deploy Static Site

on:
  push:
    branches: ["main2"]
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'games/**'
      - 'imgs/**'
      - 'fonts/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Disable Jekyll
        run: echo "" > .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site (filtered)
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            404.html
            css/
            js/
            imgs/
            games/
            fonts/

      - name: Deploy
        uses: actions/deploy-pages@v4
