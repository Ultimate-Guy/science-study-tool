name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}
          restore-keys: public-${{ github.ref }}-

      - name: Detect changed files
        id: changes
        run: |
          # Top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          TOP_CHANGED=""
          for asset in $ASSETS; do
            if git diff --name-only HEAD^ HEAD | grep -q "^$asset"; then
              TOP_CHANGED="$TOP_CHANGED $asset"
            fi
          done

          # Changed games
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            GAMES_CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
          else
            # First commit: all games
            GAMES_CHANGED=$(ls games)
          fi

          echo "top_changed=$TOP_CHANGED" >> $GITHUB_OUTPUT
          echo "games_changed=$GAMES_CHANGED" >> $GITHUB_OUTPUT

      - name: Build public folder (parallel)
        run: |
          mkdir -p public

          # Copy top-level assets
          if [ -n "${{ steps.changes.outputs.top_changed }}" ]; then
            for asset in ${{ steps.changes.outputs.top_changed }}; do
              [ -e "$asset" ] && rsync -au "$asset" public/
            done
          fi

          # Copy changed games in parallel for speed
          if [ -n "${{ steps.changes.outputs.games_changed }}" ]; then
            echo "${{ steps.changes.outputs.games_changed }}" | xargs -n1 -P8 -I{} bash -c 'mkdir -p public/games/{} && rsync -a games/{}/ public/games/{}'
          fi

          # Fallback: full build if public is empty (first deploy)
          if [ ! -e public/index.html ]; then
            echo "Fallback: copying all assets and games..."
            ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
            for asset in $ASSETS; do
              [ -e "$asset" ] && rsync -au "$asset" public/
            done
            for folder in games/*; do
              NAME=$(basename "$folder")
              mkdir -p public/games/$NAME
              rsync -a "games/$NAME/" "public/games/$NAME/"
            done
          fi

      - name: Save public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
