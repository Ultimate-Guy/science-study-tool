name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fast Checkout (minimal)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none   # 🔥 speeds up large repos
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      - name: Assemble Site (ultra fast copy)
        run: |
          mkdir -p staging

          # faster than rsync for many small files
          cp -r index.html 404.html favicon.ico config.jsonc css js imgs fonts games staging/

      - name: Lightweight Safety Check
        run: |
          echo "🔍 Quick validation..."

          [ -s staging/index.html ] || (echo "❌ index.html missing" && exit 1)
          [ -d staging/games ] || (echo "❌ games folder missing" && exit 1)

          # only check ONE js file exists (fast)
          ls staging/js/*.js >/dev/null 2>&1 || (echo "❌ JS missing" && exit 1)

          echo "✅ OK"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging
          compression-level: 0   # 🔥 faster upload (bigger file, less CPU)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
