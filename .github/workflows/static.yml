name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Official high-speed caching

      - name: Build and Sync
        run: |
          mkdir -p staging/js
          # Build JS if it exists; otherwise skip to keep it fast
          if [ -d "js" ]; then
            npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error
          fi
          
          # Use rsync for the fastest possible asset sync
          rsync -am . staging/ --include='*.html' --include='css/***' --include='imgs/***' \
          --include='fonts/***' --include='games/***' --include='favicon.ico' --exclude='*'

      # =========================
      # 1. CRASH PREVENTION: Content Integrity Check
      # =========================
      - name: Content Integrity Check
        run: |
          # Fails if index.html is too small (e.g. empty/corrupted)
          if [ $(stat -c%s "staging/index.html") -lt 100 ]; then
            echo "CRITICAL: index.html looks empty or broken!" && exit 1
          fi
          # Fails if critical tags like <body> are missing
          grep -q "</body>" staging/index.html || (echo "CRITICAL: Missing closing body tag!" && exit 1)

      # =========================
      # 2. BROKEN LINK CHECKER (High Speed)
      # =========================
      - name: Check for Broken Links
        uses: untitaker/hyperlink-link-checker@v0.1.34
        with:
          args: staging/ --check-anchors --sources # Scans local files in milliseconds

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
