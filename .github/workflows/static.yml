name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # Sparse checkout of required files
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      # Upload main site artifact (non-games files)
      - name: Upload main site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
          compression-level: 0

      # Upload games in chunks safely
      - name: Upload game chunks
        run: |
          CHUNK_SIZE=1800000000  # ~1.8GB
          CHUNK_NUM=1
          CURRENT_SIZE=0
          mkdir -p temp-chunk

          for game in games/*; do
            SIZE=$(du -s -B1 "$game" | cut -f1)
            if [ $((CURRENT_SIZE + SIZE)) -gt $CHUNK_SIZE ]; then
              echo "Uploading chunk-$CHUNK_NUM"
              gh workflow run upload-pages-artifact@v3 --with "path=temp-chunk compression-level=0" || true
              CHUNK_NUM=$((CHUNK_NUM + 1))
              CURRENT_SIZE=0
              rm -rf temp-chunk
              mkdir -p temp-chunk
            fi
            cp -r "$game" temp-chunk/
            CURRENT_SIZE=$((CURRENT_SIZE + SIZE))
          done

          # Upload last chunk
          if [ "$(ls -A temp-chunk)" ]; then
            echo "Uploading final chunk-$CHUNK_NUM"
            gh workflow run upload-pages-artifact@v3 --with "path=temp-chunk compression-level=0" || true
          fi

      # Deploy all uploaded artifacts to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
