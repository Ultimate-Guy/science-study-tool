name: Deploy static website

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 Init workspace
      - name: Init workspace
        run: |
          mkdir -p pages
          mkdir -p dist
          mkdir -p backup
          mkdir -p preview

      # ⚡ Always run AI safely (prevents conditional bugs)
      - name: Set AI flag
        run: echo "run_ai=true" >> $GITHUB_ENV

      # 🧱 Fallback page
      - name: Fallback page
        run: echo "<h1>Loading site...</h1>" > pages/index.html

      # 📦 Node setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI
        run: npm install openai

      # 🧠 SAFE AI STEP (NO HEREDOC = NO YAML ERRORS)
      - name: AI Multi-page Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node ai.js

      # ⚡ Build
      - name: Build dist
        run: rsync -a pages/ dist/

      # 🌍 Sitemap
      - name: Sitemap generator
        run: |
          SITE="https://your-username.github.io/your-repo"

          echo '<?xml version="1.0"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          for f in $(find dist -name "*.html"); do
            clean=${f#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml
          cp sitemap.xml dist/

      # 📁 Required for Pages
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # 💾 Backup
      - name: Save backup
        run: |
          rm -rf backup/*
          cp -r dist/* backup/ || true

      # 🔁 Rollback safety
      - name: Validate build
        run: |
          if [ ! -f "dist/index.html" ]; then
            rm -rf dist/*
            cp -r backup/* dist/ || true
          fi

      # 🔗 Preview build
      - name: Preview build
        run: |
          mkdir -p preview
          cp -r dist/* preview/

      # 📦 Upload production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 📦 Upload preview
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview

      # 🚀 Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
