name: Deploy static site

on:
  push:
    branches: ["main2", "staging"]
  pull_request:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧠 Version system
      - name: Generate version
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

      # 📦 Create build folder
      - name: Build site safely
        run: |
          rm -rf dist
          mkdir -p dist assets images

          # Always ensure index exists
          if [ -f index.html ]; then
            cp index.html dist/
          else
            echo "<h1>Home Page</h1><p>Site is live</p>" > dist/index.html
          fi

          # Copy optional folders if they exist
          cp -r assets dist/ 2>/dev/null || true
          cp -r images dist/ 2>/dev/null || true

      # 🧭 Auto-generate missing pages
      - name: Auto page generator
        run: |
          if [ ! -f dist/about.html ]; then
            echo "<h1>About</h1><p>Auto-generated page</p>" > dist/about.html
          fi

          if [ ! -f dist/contact.html ]; then
            echo "<h1>Contact</h1><p>Auto-generated page</p>" > dist/contact.html
          fi

      # ⚡ Cache busting
      - name: Cache busting
        run: |
          VERSION="${{ env.VERSION }}"

          find dist -name "*.html" | while read file; do
            sed -i "s/\.css/\.css?v=$VERSION/g" "$file" || true
            sed -i "s/\.js/\.js?v=$VERSION/g" "$file" || true
          done

      # 📁 Required for GitHub Pages
      - name: No Jekyll
        run: touch dist/.nojekyll

      # ⚙️ Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 📦 Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  deploy:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true

    environment:
      name: production

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: echo "Deployed: ${{ steps.deploy.outputs.page_url }}"
