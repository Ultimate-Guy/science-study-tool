name: Deploy Static Site Ultra-Fast Safe

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout full repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Determine changed games
      - name: Determine changed games
        id: changes
        run: |
          # Default: nothing changed
          CHANGED_GAMES=""

          # Only try git diff if not first commit
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_GAMES=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
          else
            # First commit → all games
            CHANGED_GAMES=$(ls games || true)
          fi

          echo "changed_games=$CHANGED_GAMES" >> $GITHUB_OUTPUT

      # 3️⃣ Prepare public folder
      - name: Prepare public folder
        run: |
          mkdir -p public

          # Copy top-level assets (always update if newer)
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          for asset in $ASSETS; do
            if [ -e "$asset" ]; then
              rsync -au "$asset" public/
            fi
          done

          # Copy only changed games, but ensure all exist at least once
          mkdir -p public/games
          for folder in games/*; do
            NAME=$(basename "$folder")
            # Copy if changed OR if folder doesn't exist yet in public
            if [ -d "$folder" ] && ( [[ "${{ steps.changes.outputs.changed_games }}" == *"$NAME"* ]] || [ ! -d "public/games/$NAME" ] ); then
              rsync -au "$folder/" "public/games/$NAME/"
            fi
          done

      # 4️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 5️⃣ Deploy
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
