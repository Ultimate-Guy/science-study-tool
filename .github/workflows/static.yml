name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ ULTRA MINIMAL CHECKOUT (FASTEST POSSIBLE)
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ NODE + ESBUILD (ONLY IF NEEDED)
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install esbuild
        run: npm install -g esbuild

      # =========================================================
      # ⚡ FAST CHANGE DETECTION (NO FILE HASHING)
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -qE '^js/|^css/' changes.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ PREP DIST (FAST CLEAN)
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css dist/imgs dist/fonts dist/games

      # =========================================================
      # ⚡ JS (ONLY IF CHANGED)
      # =========================================================
      - name: Build JS
        if: steps.changes.outputs.frontend == 'true'
        run: |
          esbuild js/*.js --minify --outdir=dist/js

      - name: Restore JS (skip build)
        if: steps.changes.outputs.frontend != 'true'
        run: |
          echo "JS unchanged → copying raw files"
          cp -r js/* dist/js/ 2>/dev/null || true

      # =========================================================
      # ⚡ CSS (ONLY IF CHANGED)
      # =========================================================
      - name: Build CSS
        if: steps.changes.outputs.frontend == 'true'
        run: |
          esbuild css/*.css --minify --outdir=dist/css

      - name: Restore CSS (skip build)
        if: steps.changes.outputs.frontend != 'true'
        run: |
          cp -r css/* dist/css/ 2>/dev/null || true

      # =========================================================
      # ⚡ HTML (ALWAYS FAST COPY)
      # =========================================================
      - name: Copy HTML
        run: |
          cp *.html dist/ 2>/dev/null || true

      # =========================================================
      # 🎮 GAMES (CRITICAL FIX: ALWAYS SAFE, NO SKIP LOGIC)
      # =========================================================
      - name: Games sync (SAFE FAST COPY)
        run: |
          if [ -d "games" ]; then
            rsync -a games/ dist/games/
          else
            mkdir -p dist/games
          fi

      # =========================================================
      # ⚡ ASSETS (FAST MIRROR COPY)
      # =========================================================
      - name: Assets
        run: |
          rsync -a imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE (STATIC OPTIMIZED)
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATION (FAST FAILSAFE)
      # =========================================================
      - name: Validate
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 FIXED GITHUB PAGES ARTIFACT (STABLE DEPLOY)
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
