name: Deploy Static Site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      top_assets: ${{ steps.detect.outputs.top_assets }}
      games: ${{ steps.detect.outputs.games }}
    steps:
      - name: Checkout sparse repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse: true
          paths: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            fonts
            imgs

      - name: Restore public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}
          restore-keys: public-${{ github.ref }}-

      - name: Detect changed files
        id: detect
        run: |
          # Top-level assets
          ASSETS="index.html 404.html favicon.ico config.jsonc css js fonts imgs"
          TOP_CHANGED=""
          for asset in $ASSETS; do
            if git diff --name-only HEAD^ HEAD | grep -q "^$asset"; then
              TOP_CHANGED="$TOP_CHANGED $asset"
            fi
          done

          # All changed games (or all games on first commit)
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            GAMES_CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
          else
            GAMES_CHANGED=$(ls games)
          fi

          echo "top_assets=${TOP_CHANGED}" >> $GITHUB_OUTPUT
          echo "games=${GAMES_CHANGED}" >> $GITHUB_OUTPUT

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prebuild public folder
        run: |
          mkdir -p public
          # Copy top-level assets
          for asset in ${{ needs.prepare.outputs.top_assets }}; do
            [ -e "$asset" ] && rsync -au "$asset" public/
          done
          # Copy all games (safe and always works)
          for folder in ${{ needs.prepare.outputs.games }}; do
            mkdir -p public/games/$folder
            rsync -a "games/$folder/" "public/games/$folder/"
          done

      - name: Save public cache
        uses: actions/cache@v3
        with:
          path: public
          key: public-${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_path: public
