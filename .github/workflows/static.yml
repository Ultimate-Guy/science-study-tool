name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ⚡ FAST CHECKOUT
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none

      # ⚡ DETECT CHANGES
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changes.txt || true

          grep -qE '^js/|^css/' changes.txt && echo "frontend=true" >> $GITHUB_OUTPUT || echo "frontend=false" >> $GITHUB_OUTPUT
          grep -qE '^js/|^css/|^imgs/|^fonts/|^games/|\.html$|^favicon\.ico$' changes.txt && echo "deploy=true" >> $GITHUB_OUTPUT || echo "deploy=false" >> $GITHUB_OUTPUT

      # ✅ SKIP IF NOTHING CHANGED
      - name: Stop if no changes
        if: steps.changes.outputs.deploy != 'true'
        run: echo "No relevant changes. Skipping."

      # ⚡ BUILD (combined + parallelized)
      - name: Build site
        if: steps.changes.outputs.deploy == 'true'
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css

          # JS + CSS in parallel
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            npx esbuild js/*.js --minify --outdir=dist/js &
            npx esbuild css/*.css --minify --outdir=dist/css &
            wait
          else
            cp -r js dist/js &
            cp -r css dist/css &
            wait
          fi

          # Static files (fast copy)
          cp *.html dist/ 2>/dev/null || true
          cp favicon.ico dist/ 2>/dev/null || true

          # Large folders (safe full copy)
          cp -r games dist/games 2>/dev/null || true
          cp -r imgs dist/imgs 2>/dev/null || true
          cp -r fonts dist/fonts 2>/dev/null || true

          # Cleanup
          find dist -type f \( -name "*.map" -o -name "*.log" -o -name "*.tmp" \) -delete

          touch dist/.nojekyll

      # 🧪 VALIDATE
      - name: Validate
        if: steps.changes.outputs.deploy == 'true'
        run: test -f dist/index.html || exit 1

      # 📦 DEPLOY
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.deploy == 'true'
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        if: steps.changes.outputs.deploy == 'true'
