name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            js
            css
            imgs
            fonts
            games
            favicon.ico
          sparse-checkout-cone-mode: false # Keeps only exactly what you need

      - name: Setup Node & Build
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Fast Build and Sync
        run: |
          mkdir -p staging
          
          # JS: Bundle & Minify (Fastest with esbuild)
          if [ -d "js" ]; then
            npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error || cp -r js staging/
          fi
          
          # HARD LINK SYNC: Much faster than copying for large assets
          # This links files into staging without duplicating the 3.7GB of data on disk
          find . -maxdepth 1 -not -path '*/.*' -not -path './staging' -not -path './js' -exec cp -rl {} staging/ \;

      - name: Safety Check
        run: |
          if [ ! -s staging/index.html ] || ! grep -q "</body>" staging/index.html; then
            echo "Critical Error: index.html missing or corrupted."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
