name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          filter: 'blob:none' # Don't download full file history
          fetch-depth: 1      # Only the most recent commit

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove Git metadata
        # This prevents uploading the massive hidden .git folder
        run: rm -rf .git

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Level 0 = No compression. 
          # At 2.3GB, skipping the "Zipping" phase saves 1-3 minutes.
          compression-level: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
