name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ultra-Fast Checkout
        uses: actions/checkout@v4
        with:
          filter: 'blob:none'
          fetch-depth: 1          # Shallow clone → huge speed gain
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            css
            js
            imgs
          sparse-checkout-cone-mode: true  # Optimized for folders

      - name: Build JS (fast & safe)
        run: |
          set -euo pipefail
          mkdir -p staging/js

          # Attempt esbuild; fallback to raw JS if unavailable
          if npx --yes esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error; then
            echo "✅ JS built successfully"
          else
            echo "⚠️ esbuild failed → copying raw JS"
            rm -rf staging/js
            cp -r js staging/
          fi

      - name: Assemble Site
        run: |
          set -euo pipefail
          mkdir -p staging

          cp index.html staging/
          cp 404.html staging/ || true
          cp favicon.ico staging/ || true
          cp -r css staging/ || true
          cp -r js staging/ || true
          cp -r imgs staging/ || true

      - name: Safety Check
        run: |
          set -euo pipefail

          if [ ! -s staging/index.html ] || \
             ! grep -q "</html>" staging/index.html; then
            echo "❌ index.html missing or malformed"
            exit 1
          fi

          if [ ! -d staging/js ] || [ -z "$(ls -A staging/js)" ]; then
            echo "❌ JS missing → site would hang"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
