name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ FAST CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      # =========================================================
      # ⚡ NODE
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # ⚡ ESBUILD ONLY
      # =========================================================
      - name: Install esbuild
        run: npm install -g esbuild

      # =========================================================
      # ⚡ CLEAN BUILD FOLDER
      # =========================================================
      - run: rm -rf dist && mkdir -p dist

      # =========================================================
      # ⚡ JS BUILD
      # =========================================================
      - name: Build JS
        run: |
          mkdir -p dist/js
          find js -name "*.js" -print0 | xargs -0 -P 4 -I {} sh -c '
            esbuild "{}" --minify --outfile="dist/{}"
          '

      # =========================================================
      # ⚡ CSS BUILD
      # =========================================================
      - name: Build CSS
        run: |
          mkdir -p dist/css
          find css -name "*.css" -print0 | xargs -0 -P 4 -I {} sh -c '
            esbuild "{}" --minify --outfile="dist/{}"
          '

      # =========================================================
      # ⚡ HTML COPY
      # =========================================================
      - name: Copy HTML
        run: cp -f *.html dist/ || true

      # =========================================================
      # ⚡ GAMES
      # =========================================================
      - name: Sync games
        run: |
          rsync -a --delete --info=stats2 games/ dist/games/

      # =========================================================
      # ⚡ ASSETS
      # =========================================================
      - name: Sync assets
        run: |
          rsync -a imgs/ dist/imgs/
          rsync -a fonts/ dist/fonts/

      # =========================================================
      # ⚡ ROOT FILES
      # =========================================================
      - run: cp favicon.ico dist/ 2>/dev/null || true
      - run: cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # ⚡ NO JEKYLL
      # =========================================================
      - run: touch dist/.nojekyll

      # =========================================================
      # ⚡ ARTIFACT UPLOAD
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # =========================================================
      # ⚡ DEPLOY
      # =========================================================
      - uses: actions/deploy-pages@v4
