name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

# Automatically kills old, slow deployments when you push a new one
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Only download the "now" files, skipping 2.8GB+ of history
          fetch-depth: 1 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Skip compression to save CPU time on the runner 
          # since many game files are already compressed
          compression-level: 0 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
