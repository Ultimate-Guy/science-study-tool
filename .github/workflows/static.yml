name: Deploy Ultra Fast

on:
  push:
    branches: ["main2"]

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fastest possible)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Disable git compression (faster push)
        run: |
          git config --global core.compression 0

      - name: Deploy to gh-pages (optimized)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
