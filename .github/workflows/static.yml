name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (ultra minimal)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none   # 🚀 HUGE speedup for big repos
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      - name: Prepare deploy folder
        run: |
          mkdir public
          cp -r index.html 404.html favicon.ico config.jsonc css js imgs fonts games public/

      - name: Upload artifact (single bundle)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          compression-level: 0   # already optimal for speed

      - name: Deploy
        uses: actions/deploy-pages@v4
