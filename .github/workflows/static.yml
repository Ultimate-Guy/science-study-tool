name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # =========================================================
      # ⚡ FAST CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ NODE
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ CLEAN DIST
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css dist/imgs dist/fonts dist/games

      # =========================================================
      # ⚡ LIGHTWEIGHT CHANGE DETECTION
      # =========================================================
      - name: Detect changes (FAST MODE)
        id: changes
        run: |
          set +e
          git diff --name-only HEAD~1 HEAD > changes.txt || true

          if [ ! -s changes.txt ]; then
            echo "full=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          grep -q '^games/' changes.txt && echo "games=true" >> $GITHUB_OUTPUT || echo "games=false" >> $GITHUB_OUTPUT
          grep -q '^css/' changes.txt && echo "css=true" >> $GITHUB_OUTPUT || echo "css=false" >> $GITHUB_OUTPUT
          grep -q '^js/' changes.txt && echo "js=true" >> $GITHUB_OUTPUT || echo "js=false" >> $GITHUB_OUTPUT
          grep -q '\.html$' changes.txt && echo "html=true" >> $GITHUB_OUTPUT || echo "html=false" >> $GITHUB_OUTPUT

      # =========================================================
      # ⚡ JS BUILD
      # =========================================================
      - name: JS build
        if: steps.changes.outputs.js == 'true' || steps.changes.outputs.full == 'true'
        run: |
          echo "Building JS"
          if ls js/*.js 1> /dev/null 2>&1; then
            esbuild js/*.js --minify --outdir=dist/js || true
          fi

      # =========================================================
      # ⚡ CSS BUILD
      # =========================================================
      - name: CSS build
        if: steps.changes.outputs.css == 'true' || steps.changes.outputs.full == 'true'
        run: |
          echo "Building CSS"
          if ls css/*.css 1> /dev/null 2>&1; then
            esbuild css/*.css --minify --outdir=dist/css || true
          fi

      # =========================================================
      # ⚡ HTML COPY
      # =========================================================
      - name: HTML
        run: |
          cp *.html dist/ 2>/dev/null || true
          cp index.html dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # 🎮 GAMES
      # =========================================================
      - name: Games sync
        if: steps.changes.outputs.games == 'true' || steps.changes.outputs.full == 'true'
        run: |
          echo "Syncing games"
          rsync -a --delete games/ dist/games/ || true

      # =========================================================
      # ⚡ ASSETS
      # =========================================================
      - name: Assets
        run: |
          rsync -a imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 SAFE VALIDATION
      # =========================================================
      - name: Validate
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 SINGLE ARTIFACT
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
