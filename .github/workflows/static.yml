name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ ULTRA FAST CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ NODE + ESBUILD
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g esbuild

      # =========================================================
      # ⚡ CLEAN BUILD
      # =========================================================
      - run: rm -rf dist && mkdir -p dist

      # =========================================================
      # ⚡ JS (PARALLEL)
      # =========================================================
      - name: Build JS
        run: |
          mkdir -p dist/js
          find js -name "*.js" | xargs -P 4 -I {} sh -c '
            esbuild "{}" --minify --outfile="dist/{}"
          '

      # =========================================================
      # ⚡ CSS (PARALLEL)
      # =========================================================
      - name: Build CSS
        run: |
          mkdir -p dist/css
          find css -name "*.css" | xargs -P 4 -I {} sh -c '
            esbuild "{}" --minify --outfile="dist/{}"
          '

      # =========================================================
      # ⚡ HTML (ZERO PROCESSING)
      # =========================================================
      - name: Copy HTML
        run: |
          find . -maxdepth 1 -name "*.html" | while read file; do
            cp "$file" "dist/$(basename "$file")"
          done

      # =========================================================
      # ⚡ SMART GAME SYNC (KEY OPTIMIZATION)
      # =========================================================
      - name: Detect game changes
        id: games
        run: |
          if git diff --name-only HEAD^ HEAD | grep '^games/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync games (only if changed)
        if: steps.games.outputs.changed == 'true'
        run: rsync -a games/ dist/games/

      # =========================================================
      # ⚡ STATIC ASSETS
      # =========================================================
      - run: rsync -a imgs/ dist/imgs/
      - run: rsync -a fonts/ dist/fonts/

      # =========================================================
      # ⚡ ROOT FILES
      # =========================================================
      - run: cp favicon.ico dist/ 2>/dev/null || true
      - run: cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # ⚡ SPEED BOOST: SKIP SITEMAP WHEN UNCHANGED HTML
      # =========================================================
      - name: Detect HTML changes
        id: html
        run: |
          if git diff --name-only HEAD^ HEAD | grep '\.html'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sitemap
        if: steps.html.outputs.changed == 'true'
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > dist/sitemap.xml
          echo '<urlset>' >> dist/sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> dist/sitemap.xml
          done

          echo '</urlset>' >> dist/sitemap.xml

      # =========================================================
      # ⚡ DISABLE JEKYLL
      # =========================================================
      - run: touch dist/.nojekyll

      # =========================================================
      # ⚡ DEPLOY
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
