name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2-smart"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed to check previous commit for changes
          filter: blob:none

      - name: Detect if games changed
        id: changes
        run: |
          # Check if HEAD^ exists to avoid exit 128
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep '^games/'; then
              echo "games_changed=true" >> $GITHUB_OUTPUT
            else
              echo "games_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            # First commit or single commit branch: deploy everything
            echo "games_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Sparse checkout (smart)
        run: |
          git sparse-checkout init --cone
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            echo "Including games..."
            git sparse-checkout set index.html 404.html favicon.ico config.jsonc css js imgs fonts games
          else
            echo "Skipping games..."
            git sparse-checkout set index.html 404.html favicon.ico config.jsonc css js imgs fonts
          fi

      - name: Prepare deploy folder
        run: |
          mkdir -p public
          # Copy main site files
          cp -r index.html 404.html favicon.ico config.jsonc css js imgs fonts public/
          
          # Copy games only if they changed
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            echo "Copying games..."
            cp -r games/. public/games/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        uses: actions/deploy-pages@v4
