name: Deploy static website

on:
  push:
    branches: ["main2"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 Init safe folders
      - name: Init workspace
        run: |
          mkdir -p pages
          mkdir -p dist
          mkdir -p backup
          mkdir -p preview

      # ⚡ Detect changed files (true incremental mode)
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -E "\.html|\.css|\.js|content" changes.txt; then
            echo "run_ai=true" >> $GITHUB_OUTPUT
          else
            echo "run_ai=false" >> $GITHUB_OUTPUT
          fi

      # 🧱 Always fallback page (prevents empty deploy)
      - name: Fallback page
        run: echo "<h1>Site is building...</h1>" > pages/index.html

      # 📦 Node setup
      - name: Setup Node
        if: steps.changes.outputs.run_ai == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI
        if: steps.changes.outputs.run_ai == 'true'
        run: npm install openai fs

      # 🧠 SINGLE AI CALL (fast generator)
      - name: AI Multi-page Generator
        if: steps.changes.outputs.run_ai == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const OpenAI = require('openai');

          const client = new OpenAI({ apiKey: process.env.OPENAI_API_KEY });

          async function run() {

            const res = await client.chat.completions.create({
              model: 'gpt-4o-mini',
              messages: [{
                role: 'user',
                content: `
Generate 4 SEO HTML pages:
- index
- blog
- tools
- guide

Return JSON:
{
  \"index\": \"html\",
  \"blog\": \"html\",
  \"tools\": \"html\",
  \"guide\": \"html\"
}

Rules:
- valid HTML only
- include meta tags
- no explanation
`
              }]
            });

            const data = JSON.parse(res.choices[0].message.content);

            for (const k in data) {
              fs.writeFileSync('pages/' + k + '.html', data[k]);
            }
          }

          run();
          "

      # ⚡ BUILD ONLY CHANGED OUTPUT (fast sync)
      - name: Build dist
        run: |
          rsync -a pages/ dist/

      # 🌍 SITEMAP
      - name: Sitemap generator
        run: |
          SITE="https://your-username.github.io/your-repo"

          echo '<?xml version="1.0"?>' > sitemap.xml
          echo '<urlset>' >> sitemap.xml

          for f in $(find dist -name "*.html"); do
            clean=${f#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml
          cp sitemap.xml dist/

      # 📁 REQUIRED FILE
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # 💾 BACKUP LAST GOOD BUILD
      - name: Save backup
        run: |
          if [ -d "dist" ]; then
            rm -rf backup/*
            cp -r dist/* backup/ || true
          fi

      # 🔁 ROLLBACK IF BUILD IS BROKEN
      - name: Validate build
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build broken → restoring backup"
            rm -rf dist/*
            cp -r backup/* dist/ || true
          fi

      # 🔗 PREVIEW BUILD (PER COMMIT)
      - name: Create preview build
        run: |
          mkdir -p preview
          cp -r dist/* preview/

          echo "Preview build ready for this commit"

      # 📦 Upload (PRODUCTION)
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 📦 Upload (PREVIEW ARTIFACT)
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: preview

      # 🚀 DEPLOY
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
