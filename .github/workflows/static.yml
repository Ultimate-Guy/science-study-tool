name: Deploy static site

on:
  push:
    branches: ["main2", "staging"]
  pull_request:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

      - name: Build site
        run: |
          rm -rf dist
          mkdir -p dist assets images

          if [ -f index.html ]; then
            cp index.html dist/
          else
            echo "<h1>Home Page</h1><p>Auto-generated site</p>" > dist/index.html
          fi

          cp -r assets dist/ 2>/dev/null || true
          cp -r images dist/ 2>/dev/null || true

      - name: Generate sitemap
        run: |
          SITE="https://YOUR_USERNAME.github.io/YOUR_REPO"

          echo '<?xml version="1.0"?>' > dist/sitemap.xml
          echo '<urlset>' >> dist/sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> dist/sitemap.xml
          done

          echo '</urlset>' >> dist/sitemap.xml

      - name: Cache busting
        run: |
          VERSION="${{ env.VERSION }}"

          find dist -name "*.html" | while read file; do
            sed -i "s/\.css/\.css?v=$VERSION/g" "$file" || true
            sed -i "s/\.js/\.js?v=$VERSION/g" "$file" || true
          done

      - name: No Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  deploy:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true

    environment:
      name: production

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4

      - name: Show URL
        run: echo "Live site deployed"
