name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2-partial"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # ✅ needed to diff
          filter: blob:none

      - name: Detect changed games
        id: changes
        run: |
          # Handle first commit safely
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # List all changed top-level games folders
            CHANGED=$(git diff --name-only HEAD^ HEAD | grep '^games/' | cut -d/ -f2 | sort -u)
            if [ -z "$CHANGED" ]; then
              echo "games_changed=false" >> $GITHUB_OUTPUT
            else
              echo "games_changed=true" >> $GITHUB_OUTPUT
              echo "changed_folders=$CHANGED" >> $GITHUB_OUTPUT
            fi
          else
            echo "games_changed=true" >> $GITHUB_OUTPUT
            CHANGED=$(ls games)
            echo "changed_folders=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Sparse checkout
        run: |
          git sparse-checkout init --cone
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            # Include only changed folders + main site files
            git sparse-checkout set index.html 404.html favicon.ico config.jsonc css js imgs fonts $(echo "${{ steps.changes.outputs.changed_folders }}" | sed 's/^/games\//g')
          else
            git sparse-checkout set index.html 404.html favicon.ico config.jsonc css js imgs fonts
          fi

      - name: Prepare deploy folder
        run: |
          mkdir -p public
          # Copy main site files
          cp -r index.html 404.html favicon.ico config.jsonc css js imgs fonts public/
          
          # Copy only changed games folders
          if [ "${{ steps.changes.outputs.games_changed }}" = "true" ]; then
            for folder in ${{ steps.changes.outputs.changed_folders }}; do
              echo "Copying games/$folder..."
              mkdir -p public/games/$folder
              cp -r games/$folder/. public/games/$folder/
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        uses: actions/deploy-pages@v4
