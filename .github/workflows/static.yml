name: Deploy static site

on:
  push:
    branches: ["main2"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # -----------------------------
      # Detect changes
      # -----------------------------
      - name: Detect changes
        run: |
          git diff --name-only HEAD^ HEAD > changed.txt
          cat changed.txt

      # -----------------------------
      # Restore previous dist
      # -----------------------------
      - name: Restore dist cache
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.ref }}
          restore-keys: |
            dist-

      # -----------------------------
      # Setup Node
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # -----------------------------
      # Install esbuild (FAST AF)
      # -----------------------------
      - name: Install esbuild
        run: npm install -g esbuild

      # -----------------------------
      # Prepare dist
      # -----------------------------
      - run: mkdir -p dist/css dist/js

      # =========================================================
      # 🧠 REMOVE DELETED FILES FROM DIST
      # =========================================================
      - name: Remove deleted files
        run: |
          git diff --name-only --diff-filter=D HEAD^ HEAD | while read file; do
            echo "Deleting dist/$file"
            rm -f "dist/$file"
          done || true

      # =========================================================
      # 🎮 GAMES (ONLY IF CHANGED)
      # =========================================================
      - name: Sync games (smart)
        run: |
          if grep -q '^games/' changed.txt; then
            echo "Updating games folder..."
            rsync -a --delete games/ dist/games/
          else
            echo "Games unchanged — skipping"
          fi

      # =========================================================
      # ⚡ JS (SUPER FAST)
      # =========================================================
      - name: Build JS
        run: |
          grep '^js/.*\.js$' changed.txt | while read file; do
            echo "Building $file"
            mkdir -p dist/$(dirname $file)
            esbuild "$file" --minify --outfile="dist/$file"
          done || true

      # =========================================================
      # ⚡ CSS (SUPER FAST)
      # =========================================================
      - name: Build CSS
        run: |
          grep '^css/.*\.css$' changed.txt | while read file; do
            echo "Building $file"
            mkdir -p dist/$(dirname $file)
            esbuild "$file" --minify --outfile="dist/$file"
          done || true

      # =========================================================
      # HTML (lightweight minify)
      # =========================================================
      - name: Build HTML
        run: |
          grep '\.html$' changed.txt | while read file; do
            echo "Processing $file"
            mkdir -p dist/$(dirname $file)
            sed '/<!--.*-->/d' "$file" | tr -d '\n' > "dist/$file"
          done || true

      # -----------------------------
      # Assets (smart copy)
      # -----------------------------
      - name: Copy assets
        run: |
          if grep -q '^imgs/' changed.txt || grep -q '^fonts/' changed.txt; then
            rsync -a imgs/ dist/imgs/
            rsync -a fonts/ dist/fonts/
          fi

      # -----------------------------
      # Root files
      # -----------------------------
      - name: Copy root
        run: |
          cp index.html dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true
          cp favicon.ico dist/ 2>/dev/null || true

      # -----------------------------
      # Disable Jekyll
      # -----------------------------
      - run: touch dist/.nojekyll

      # -----------------------------
      # Sitemap
      # -----------------------------
      - name: Sitemap
        run: |
          SITE="https://XHunter75.github.io/ExistenceGG75"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > dist/sitemap.xml
          echo '<urlset>' >> dist/sitemap.xml

          find dist -name "*.html" | while read file; do
            clean=${file#dist/}
            echo "<url><loc>$SITE/$clean</loc></url>" >> dist/sitemap.xml
          done

          echo '</urlset>' >> dist/sitemap.xml

      # -----------------------------
      # Save cache
      # -----------------------------
      - uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}

      # -----------------------------
      # Upload + Deploy
      # -----------------------------
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
