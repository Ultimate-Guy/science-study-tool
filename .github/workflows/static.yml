name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Speeds up Node tools on every run

      - name: Build and Sync
        run: |
          mkdir -p staging/js
          
          # JS: Bundle & Minify only if folder exists
          if [ -d "js" ]; then
            npx esbuild js/*.js --bundle --minify --outdir=staging/js --log-level=error || cp -r js/* staging/js/
          fi
          
          # FAST SYNC: Moves all assets into staging in one pass
          rsync -am . staging/ --include='*.html' --include='css/***' --include='imgs/***' \
          --include='fonts/***' --include='games/***' --include='favicon.ico' --exclude='*'

      - name: Crash Protection Check
        run: |
          # 1. Check if index.html actually exists and has content
          if [ ! -s staging/index.html ]; then
            echo "ERROR: index.html is empty or missing! Blocking deploy."
            exit 1
          fi
          # 2. Check for the closing body tag (ensures the file isn't cut off)
          if ! grep -q "</body>" staging/index.html; then
            echo "ERROR: index.html is incomplete/corrupted! Blocking deploy."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
