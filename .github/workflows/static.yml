name: Deploy static site

on:
  push:
    branches: ["main2", "staging"]
  pull_request:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔍 Only deploy if real site files changed
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '**/*.html'
              - '**/*.css'
              - '**/*.js'
              - 'assets/**'
              - 'images/**'

      # 🧠 Version tagging
      - name: Generate version
        if: steps.filter.outputs.changed == 'true'
        run: |
          echo "VERSION=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_ENV

      # ⚡ Performance audit (Lighthouse)
      - name: Run Lighthouse
        if: steps.filter.outputs.changed == 'true'
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            file://${{ github.workspace }}/index.html
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Disable Jekyll
        if: steps.filter.outputs.changed == 'true'
        run: touch .nojekyll

      - name: Upload artifact
        if: steps.filter.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages-deploy
      cancel-in-progress: true

    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref_name == 'staging' && 'staging' || 'production') }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Show URL
        run: echo "Deployed to ${{ steps.deploy.outputs.page_url }}"

      - name: Rollback notice
        if: failure()
        run: |
          echo "⚠️ Deployment failed!"
          echo "Go to Actions → re-run a previous successful workflow to restore."
