name: Deploy static site

on:
  push:
    branches: ["main2"]
    paths:
      - "css/**"
      - "js/**"
      - "imgs/**"
      - "fonts/**"
      - "games/**"
      - "index.html"
      - "404.html"
      - "config.jsonc"
      - "favicon.ico"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (absolute minimum)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            index.html
            404.html
            favicon.ico
            config.jsonc
            css
            js
            imgs
            fonts
            games
          sparse-checkout-cone-mode: true

      - name: Add .nojekyll (safety)
        run: touch .nojekyll

      - name: Add build timestamp (cache bust)
        run: echo "window.__BUILD_TIME__=$(date +%s)" > js/build.js

      - name: Upload artifact (no compression = fastest)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          compression-level: 0

      - name: Deploy
        uses: actions/deploy-pages@v4
