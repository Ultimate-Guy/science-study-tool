name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-main2"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ ULTRA FAST CHECKOUT
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # ⚡ NODE (ONLY FOR BUILD IF NEEDED)
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install esbuild (cached by runner layer)
        run: npm install -g esbuild

      # =========================================================
      # ⚡ CACHE (REAL EDGE SPEED BOOST)
      # =========================================================
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .edge-cache
          key: edge-${{ runner.os }}-${{ hashFiles('js/**','css/**') }}
          restore-keys: |
            edge-${{ runner.os }}-

      # =========================================================
      # ⚡ PREP OUTPUT
      # =========================================================
      - name: Prepare dist
        run: |
          rm -rf dist
          mkdir -p dist/js dist/css dist/imgs dist/fonts dist/games
          mkdir -p .edge-cache

      # =========================================================
      # ⚡ SMART CHANGE DETECTION (FAST GIT DIFF)
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changes.txt || true

          if grep -q '^js/\|^css/' changes.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if grep -q '^games/' changes.txt; then
            echo "games=true" >> $GITHUB_OUTPUT
          else
            echo "games=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ JS (CACHED + SKIP WHEN POSSIBLE)
      # =========================================================
      - name: JS build or restore
        run: |
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            echo "JS rebuild"
            esbuild js/*.js --minify --outdir=dist/js
            rm -rf .edge-cache/js
            cp -r dist/js .edge-cache/
          else
            echo "JS cache reuse"
            cp -r .edge-cache/js dist/ || true
          fi

      # =========================================================
      # ⚡ CSS (CACHED + SKIP WHEN POSSIBLE)
      # =========================================================
      - name: CSS build or restore
        run: |
          if [ "${{ steps.changes.outputs.frontend }}" = "true" ]; then
            echo "CSS rebuild"
            esbuild css/*.css --minify --outdir=dist/css
            rm -rf .edge-cache/css
            cp -r dist/css .edge-cache/
          else
            echo "CSS cache reuse"
            cp -r .edge-cache/css dist/ || true
          fi

      # =========================================================
      # ⚡ HTML (INSTANT)
      # =========================================================
      - name: HTML copy
        run: |
          cp *.html dist/ 2>/dev/null || true

      # =========================================================
      # 🎮 GAMES (ONLY WHEN CHANGED — BIG SPEED WIN)
      # =========================================================
      - name: Games sync
        if: steps.changes.outputs.games == 'true'
        run: |
          rsync -a games/ dist/games/

      - name: Skip games sync
        if: steps.changes.outputs.games == 'false'
        run: |
          echo "Games unchanged → skipping rsync (major speed boost)"

      # =========================================================
      # ⚡ ASSETS (FAST MIRROR COPY)
      # =========================================================
      - name: Assets
        run: |
          rsync -a imgs/ dist/imgs/ 2>/dev/null || true
          rsync -a fonts/ dist/fonts/ 2>/dev/null || true

      # =========================================================
      # ⚡ FINALIZE
      # =========================================================
      - name: Finalize
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          touch dist/.nojekyll

      # =========================================================
      # 🧪 VALIDATION (SAFETY NET)
      # =========================================================
      - name: Validate
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)

      # =========================================================
      # 📦 FIXED GITHUB PAGES ARTIFACT (NO MORE ERRORS)
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
