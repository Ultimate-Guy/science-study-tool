name: Deploy static site

on:
  push:
    branches: ["main2"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # ⚡ CHECKOUT (FAST)
      # =========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # =========================================================
      # ⚡ DETECT CHANGES (CORE OF HYBRID MODE)
      # =========================================================
      - name: Detect changes
        id: changes
        run: |
          git diff --name-only HEAD^ HEAD > changed.txt
          cat changed.txt

          if grep -qE '^games/|^css/|^js/|^imgs/|^fonts/' changed.txt; then
            echo "full=true" >> $GITHUB_OUTPUT
          else
            echo "full=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # ⚡ NODE + ESBUILD (ONLY IF NEEDED)
      # =========================================================
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tool
        run: npm install -g esbuild

      # =========================================================
      # ⚡ CLEAN BUILD FOLDER
      # =========================================================
      - run: rm -rf dist && mkdir -p dist

      # =========================================================
      # ⚡ FAST PATH (NO HEAVY FOLDERS CHANGED)
      # =========================================================
      - name: Fast build (HTML only)
        if: steps.changes.outputs.full == 'false'
        run: |
          echo "FAST MODE"

          find . -maxdepth 1 -name "*.html" | while read file; do
            cp "$file" "dist/$(basename "$file")"
          done

          rsync -a imgs/ dist/imgs/
          rsync -a fonts/ dist/fonts/
          rsync -a games/ dist/games/
          rsync -a css/ dist/css/
          rsync -a js/ dist/js/

      # =========================================================
      # ⚡ FULL SAFE BUILD (WHEN HEAVY CHANGES DETECTED)
      # =========================================================
      - name: Full build (optimized)
        if: steps.changes.outputs.full == 'true'
        run: |
          echo "FULL MODE (games/css/js changed)"

          # JS
          mkdir -p dist/js
          find js -name "*.js" | xargs -P 4 -I {} sh -c '
            esbuild "{}" --minify --outfile="dist/{}"
          '

          # CSS
          mkdir -p dist/css
          find css -name "*.css" | xargs -P 4 -I {} sh -c '
            esbuild "{}" --minify --outfile="dist/{}"
          '

          # HTML
          find . -maxdepth 1 -name "*.html" | while read file; do
            cp "$file" "dist/$(basename "$file")"
          done

          # Assets
          rsync -a imgs/ dist/imgs/
          rsync -a fonts/ dist/fonts/
          rsync -a games/ dist/games/

      # =========================================================
      # ⚡ ROOT FILES
      # =========================================================
      - name: Copy root files
        run: |
          cp favicon.ico dist/ 2>/dev/null || true
          cp 404.html dist/ 2>/dev/null || true

      # =========================================================
      # ⚡ DISABLE JEKYLL
      # =========================================================
      - run: touch dist/.nojekyll

      # =========================================================
      # ⚡ DEPLOY
      # =========================================================
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
